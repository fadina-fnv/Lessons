<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Контроль: компьютерная графика</title>
<style>
:root{
  --bg:#f3f7fc; --card:#ffffff; --ink:#1f2d4d; --muted:#4a5a7a;
  --blue:#2f6fd6; --blue-l:#e3eefc; --line:#c9d8ef;
  --ok:#23914a; --ok-l:#e2f5e7; --warn:#d07400; --warn-l:#fff0d9;
  --vio:#7448c4; --vio-l:#efe7fb; --sun:#ffd24d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Times New Roman",Times,serif;font-size:20px;line-height:1.45;
  -webkit-user-select:none;user-select:none}
input,select{-webkit-user-select:text;user-select:text}
header{background:linear-gradient(135deg,#d8e9ff,#eef5ff 55%,#fff1dc);border-bottom:2px solid var(--line);padding:14px 18px}
header h1{margin:0;font-size:32px;color:#1d4ea3;line-height:1.15}
.student{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;align-items:flex-end}
.student label{display:flex;flex-direction:column;font-size:17px;color:var(--muted);font-weight:bold}
.student input,.student select{font:inherit;font-size:21px;padding:6px 10px;border:2px solid #9fb8de;border-radius:8px;background:#fff;color:var(--ink)}
.student input{width:320px;max-width:100%}
.student select{width:120px}
.student .empty{border-color:var(--warn);background:#fffaf2}
.student input:disabled,.student select:disabled{background:#eef3fa;color:var(--ink);opacity:1}
main{max-width:920px;margin:0 auto;padding:16px 14px 60px}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:18px}
.card h2{margin:0 0 10px;font-size:27px;color:#1d4ea3;line-height:1.2}
.card p{margin:8px 0}
.card ul{margin:6px 0;padding-left:26px}.card li{margin:4px 0}
.big-btn{font:inherit;font-size:22px;font-weight:bold;padding:12px 22px;border-radius:12px;border:2px solid var(--blue);background:var(--blue);color:#fff;cursor:pointer}
.big-btn.sec{background:#fff;color:var(--blue)}
.big-btn:disabled{opacity:.45;cursor:default}
.center{text-align:center}
.alert{background:var(--warn-l);border:2px solid var(--warn);border-radius:10px;padding:10px 14px;margin:10px 0}
.note{background:var(--blue-l);border-left:6px solid var(--blue);border-radius:8px;padding:10px 14px;margin:10px 0}

/* номера вопросов */
.nums{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
.nums button{font:inherit;font-size:20px;font-weight:bold;width:44px;height:44px;border-radius:50%;border:3px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;padding:0}
.nums button.ans{background:var(--vio);border-color:var(--vio);color:#fff}
.nums button.cur{box-shadow:0 0 0 4px var(--sun)}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:18px;color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:18px;height:18px;border-radius:50%;border:3px solid var(--line);vertical-align:-3px;margin-right:5px;background:#fff}
.legend i.a{background:var(--vio);border-color:var(--vio)}
.legend i.c{box-shadow:0 0 0 3px var(--sun)}
.tbar{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:20px;margin-bottom:6px}
.tname{font-weight:bold;color:#1d4ea3}
.qcard{border:3px solid var(--line);border-radius:16px;padding:18px}
.qt{font-size:26px;font-weight:bold;margin:0 0 12px;text-align:center}
.opts{display:grid;gap:10px}
.opts button{font:inherit;font-size:22px;text-align:left;padding:12px 16px;border:3px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);cursor:pointer}
.opts button:hover{background:#f4f8ff}
.opts button.sel{border-color:var(--vio);background:var(--vio-l);font-weight:bold}
.navrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:16px}
.finrow{text-align:center;margin-top:18px;padding-top:14px;border-top:2px dashed var(--line)}

/* результат */
table.res{width:100%;border-collapse:collapse;font-size:21px;margin:10px 0}
table.res td,table.res th{border:2px solid var(--line);padding:8px 10px;text-align:left}
table.res th{background:var(--blue-l)}
.grade{font-size:56px;font-weight:bold;color:#1d4ea3;text-align:center;margin:8px 0}
.err{list-style:none;padding:0 !important}
.err li{background:var(--warn-l);border-radius:8px;padding:8px 12px;margin:6px 0;font-size:19px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.sendst{text-align:center;font-size:20px;margin:10px 0}
.sendst .ok{color:var(--ok);font-weight:bold}.sendst .no{color:var(--warn);font-weight:bold}

/* окно подтверждения */
.modal{position:fixed;inset:0;background:rgba(31,45,77,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.open{display:flex}
.modal .box{background:#fff;border:3px solid var(--blue);border-radius:16px;padding:20px 24px;max-width:560px;width:100%;font-size:22px}
.modal .box .btns{margin-top:16px}
@media (max-width:640px){
  body{font-size:19px} header h1{font-size:26px} .qt{font-size:23px}
  .student input{width:100%} .student label{flex:1 1 100%} .student label.c{flex:0 0 auto}
}
</style>
</head>
<body>
<header>
  <h1>Контроль: компьютерная графика</h1>
  <div class="student">
    <label>Фамилия и имя
      <input id="fio" type="text" autocomplete="off" spellcheck="false" placeholder="Введите фамилию и имя">
    </label>
    <label class="c">Класс
      <select id="cls"><option value="">—</option><option>5А</option><option>5Б</option><option>5В</option></select>
    </label>
  </div>
</header>
<main id="app"></main>
<div class="modal" id="modal"><div class="box"><div id="mText"></div><div class="btns"><button class="big-btn sec" id="mNo"></button><button class="big-btn" id="mYes"></button></div></div></div>

<script>
/* ============================================================================
   GOOGLE_SHEET_URL — сюда вставляется ссылка веб-приложения Google Apps Script
   (заканчивается на /exec). Метка GOOGLE_SHEET_URL остаётся после замены.
   ============================================================================ */
const GOOGLE_SHEET_URL = 'https://script.google.com/macros/s/AKfycbz9rYHXWIoMM8BFgRL0nj6S9c5BZxoMXa5rjIpPZIBXrkCkL5iY9TEAMZYtSGVKwyXvSw/exec';

const MAX_ATTEMPTS = 2;      // сколько раз можно пройти контрольную
const TEST_ID = 'kontrol-grafika';

/* ===================== БАНК ВОПРОСОВ ===================== */
// Верный ответ всегда первый, при показе варианты перемешиваются.
const TOPICS = [
 {id:'form', name:'Как строится изображение', n:5},
 {id:'zoom', name:'Увеличение изображения', n:3},
 {id:'use',  name:'Достоинства, недостатки, применение', n:5},
 {id:'fmt',  name:'Форматы и программы', n:2},
 {id:'col',  name:'Цветовые модели RGB и CMYK', n:1},
 {id:'pick', name:'Выбор цветовой модели: экран или печать', n:4, parts:[['rgb',2],['cmyk',2]]}
];
const SITU = ['RGB','CMYK','SVG','BMP'], SITU2 = ['CMYK','RGB','SVG','BMP'];
const BANK = {
 form:[
  {q:'Пиксель — это…',o:['самый маленький элемент растрового изображения, точка одного цвета','фигура в векторном рисунке','название программы для рисования','формат файла']},
  {q:'Растровое изображение состоит из…',o:['пикселей','фигур: линий и кругов','букв','звуков']},
  {q:'Векторное изображение состоит из…',o:['фигур: линий, кругов, многоугольников','пикселей','точек, у каждой из которых свой цвет','звуков']},
  {q:'Как компьютер хранит растровое изображение?',o:['как цвет каждого пикселя','как описание фигур','как набор звуков','как список слов']},
  {q:'Как компьютер хранит векторное изображение?',o:['как описание фигур: где, какого размера, какого цвета','как цвет каждого пикселя','как набор звуков','как текст']},
  {q:'Какое изображение получается при съёмке на телефон?',o:['растровое','векторное','звуковое','текстовое']},
  {q:'Какое изображение получается при сканировании?',o:['растровое','векторное','никакое','звуковое']},
  {q:'Рисунок собран из отдельных фигур: кругов, линий, прямоугольников. Какая это графика?',o:['векторная','растровая','звуковая','текстовая']},
  {q:'Как называют простые фигуры (линии, овалы, прямоугольники), из которых строится векторное изображение?',o:['графические примитивы','пиксели','форматы','палитра']}
 ],
 zoom:[
  {q:'Что такое пикселизация?',o:['при увеличении становятся видны отдельные пиксели-квадратики','картинка становится чёрно-белой','рисунок превращается в вектор','файл становится меньше']},
  {q:'Какую картинку можно сильно увеличить без потери качества?',o:['векторную','растровую','любую','никакую']},
  {q:'Маленькую фотографию растянули на весь экран. Что произойдёт?',o:['появится пикселизация, фото станет нечётким','фото станет ещё чётче','фото превратится в вектор','ничего не изменится']},
  {q:'Что происходит с растровым изображением при сильном увеличении?',o:['становятся видны квадратики-пиксели','оно остаётся таким же чётким','оно становится векторным','оно меняет цвет']},
  {q:'Что происходит с векторным изображением при увеличении?',o:['оно остаётся чётким','появляется пикселизация','оно становится растровым','оно исчезает']}
 ],
 use:[
  {q:'Какое достоинство у растровой графики?',o:['передаёт фотографии реалистично, с плавными переходами цвета','увеличивается без потери качества','файлы всегда маленькие','каждую фигуру можно перекрасить отдельно']},
  {q:'Какой недостаток у растровой графики?',o:['при увеличении появляется пикселизация','нельзя передать фотографию','её нельзя открыть на компьютере','в ней нет цвета']},
  {q:'Какое достоинство у векторной графики?',o:['увеличивается без потери качества','лучше всего передаёт фотографии','получается сразу при съёмке на телефон','состоит из пикселей']},
  {q:'Какой недостаток у векторной графики?',o:['трудно передать фотографию с плавными переходами цвета','при увеличении появляется пикселизация','файлы очень большие','фигуры нельзя перекрасить']},
  {q:'У какой графики файлы обычно меньше по размеру?',o:['у векторной','у растровой','у обеих одинаковые','размер файла не зависит от вида графики']},
  {q:'Для чего лучше всего подходит растровая графика?',o:['для фотографий','для логотипов','для схем','для чертежей']},
  {q:'Для чего лучше всего подходит векторная графика?',o:['для логотипов, значков и схем','для фотографий','для скриншотов','для отсканированных страниц']},
  {q:'Что лучше всего хранить как растровое изображение?',o:['фотографию с экскурсии','логотип из фигур','схему метро','чертёж']},
  {q:'Что лучше сделать векторным?',o:['эмблему школы из простых фигур','фото пейзажа','селфи','скриншот игры']},
  {q:'Логотип печатают и на маленькой ручке, и на огромном баннере. Какую графику выбрать?',o:['векторную — она чёткая при любом размере','растровую — в ней больше пикселей','растровую — файл будет меньше','любую, разницы нет']},
  {q:'В векторном рисунке нужно перекрасить только солнце. Можно ли это сделать?',o:['да, каждая фигура — отдельный объект','нет, перекрасить можно только весь рисунок','нет, векторный рисунок нельзя менять','только если нарисовать всё заново']}
 ],
 fmt:[
  {q:'Файл «море.jpg» — это…',o:['растровое изображение','векторное изображение','звук','текстовый документ']},
  {q:'Формат SVG используют для…',o:['векторных изображений','фотографий','музыки','видео']},
  {q:'Какой из форматов — векторный?',o:['SVG','JPG','BMP','PNG']},
  {q:'Какой из форматов — растровый?',o:['PNG','SVG','WMF','CDR']},
  {q:'Paint — это какой графический редактор?',o:['растровый','векторный','текстовый','звуковой']},
  {q:'В какой программе рисуют растровые картинки?',o:['Paint','Inkscape','CorelDRAW','PowerPoint (фигуры)']},
  {q:'Как можно создать векторное изображение?',o:['нарисовать фигурами в PowerPoint','сфотографировать на телефон','отсканировать рисунок','нарисовать кистью в Paint']}
 ],
 col:[
  {q:'От чего зависит выбор цветовой модели?',o:['от того, где будет изображение: на экране или на бумаге','от размера файла','от названия файла','от того, кто рисовал']},
  {q:'Что означают буквы RGB?',o:['красный, зелёный, синий','голубой, пурпурный, жёлтый','красный, жёлтый, белый','растр, графика, вектор']},
  {q:'Что означает буква K в CMYK?',o:['чёрный цвет','красный цвет','белый цвет','контур']},
  {q:'Что получится, если смешать красный, зелёный и синий свет?',o:['белый','чёрный','коричневый','голубой']},
  {q:'Что происходит, когда смешивают краски CMYK?',o:['цвет становится темнее','цвет становится светлее','получается белый','краски исчезают']}
 ],
 rgb:[
  {q:'Какую цветовую модель используют для экранов?',o:['RGB','CMYK','JPG','SVG']},
  {q:'Картинка для сайта школы. Какую цветовую модель выбрать?',o:SITU},
  {q:'Презентация для интерактивной панели. Какую цветовую модель выбрать?',o:SITU},
  {q:'Фото для обоев на экране телефона. Какую цветовую модель выбрать?',o:SITU},
  {q:'Аватарка для мессенджера. Какую цветовую модель выбрать?',o:SITU},
  {q:'Изображение, которое покажут через проектор. Какую цветовую модель выбрать?',o:SITU}
 ],
 cmyk:[
  {q:'Какую цветовую модель используют для печати?',o:['CMYK','RGB','PNG','BMP']},
  {q:'Плакат, который напечатают в типографии. Какую цветовую модель выбрать?',o:SITU2},
  {q:'Грамота, которую распечатают на принтере. Какую цветовую модель выбрать?',o:SITU2},
  {q:'Обложка печатной книги. Какую цветовую модель выбрать?',o:SITU2},
  {q:'Фото для печати в фотоальбом. Какую цветовую модель выбрать?',o:SITU2},
  {q:'Школьная газета на бумаге. Какую цветовую модель выбрать?',o:SITU2}
 ]
};
const TOTAL = TOPICS.reduce((a,t)=>a+t.n,0);

/* ===================== СОСТОЯНИЕ ===================== */
let phase='intro', qs=[], cur=0, attempt=1, exits=[], startedAt=0, finishedAt=0, lastExit=0;
let sendInfo={count:0,status:''};
const app=document.getElementById('app'), fioEl=document.getElementById('fio'), clsEl=document.getElementById('cls');
function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];}return a;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function plural(n,a,b,c){n=Math.abs(n)%100;const d=n%10;if(n>10&&n<20)return c;if(d>1&&d<5)return b;if(d===1)return a;return c;}
function hhmm(d){return d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',second:'2-digit'});}
function fio(){return fioEl.value.trim().replace(/\s+/g,' ');}

/* ----- попытки: считаются по фамилии, классу и дате на этом компьютере ----- */
function aKey(){return 'kg:'+TEST_ID+':'+new Date().toLocaleDateString('ru-RU')+':'+clsEl.value+':'+fio().toLowerCase();}
function usedAttempts(){try{return +localStorage.getItem(aKey())||0;}catch(e){return 0;}}
function saveAttempts(n){try{localStorage.setItem(aKey(),String(n));}catch(e){}}

function build(){
  qs=[];
  TOPICS.forEach(t=>{
    let set = t.parts ? shuffle([].concat(...t.parts.map(p=>shuffle(BANK[p[0]]).slice(0,p[1])))) : shuffle(BANK[t.id]).slice(0,t.n);
    set.forEach(q=>qs.push({t:t.id,q:q.q,right:q.o[0],opts:shuffle(q.o),ans:null}));
  });
}

/* ===================== ОКНО ПОДТВЕРЖДЕНИЯ ===================== */
function ask(html,yes,no,onYes){
  const m=document.getElementById('modal');
  document.getElementById('mText').innerHTML=html;
  const y=document.getElementById('mYes'), n=document.getElementById('mNo');
  y.textContent=yes; n.textContent=no;
  y.onclick=()=>{m.classList.remove('open');onYes();};
  n.onclick=()=>m.classList.remove('open');
  m.classList.add('open');
}

/* ===================== НАЧАЛО ===================== */
function ready(){ return fio() && clsEl.value; }
function markEmpty(){ fioEl.classList.toggle('empty',!fio()); clsEl.classList.toggle('empty',!clsEl.value); }
function renderIntro(){
  app.innerHTML='<div class="card"><h2>Контрольная работа</h2>'+
   '<ul><li>В работе <b>'+TOTAL+' вопросов</b>, в каждом один верный ответ.</li>'+
   '<li>К вопросам можно переходить <b>в любом порядке</b> и менять ответ. Вопросы с ответом закрашиваются.</li>'+
   '<li>Проверка и <b>оценка по 10-балльной шкале</b> — в самом конце. Вопрос без ответа считается неверным.</li>'+
   '<li>Работу можно выполнить <b>'+MAX_ATTEMPTS+' раза</b>: учитель учтёт лучший результат.</li></ul>'+
   '<div class="note">Во время работы не открывайте другие окна и вкладки: каждый выход записывается и будет виден учителю.</div>'+
   '<div class="alert" id="needName">Чтобы начать, впишите фамилию и имя и выберите класс вверху страницы.</div>'+
   '<div class="alert" id="noTries" style="display:none">Вы уже выполнили работу '+MAX_ATTEMPTS+' раза. Попыток больше нет.</div>'+
   '<p class="center"><button class="big-btn" id="startBtn" disabled>Начать контроль</button></p></div>';
  document.getElementById('startBtn').onclick=start;
  updIntro();
}
function updIntro(){
  const b=document.getElementById('startBtn'); if(!b) return;
  const used=ready()?usedAttempts():0, left=used<MAX_ATTEMPTS;
  b.disabled=!(ready()&&left);
  document.getElementById('needName').style.display=ready()?'none':'';
  document.getElementById('noTries').style.display=ready()&&!left?'':'none';
}
function start(){
  if(!ready()) return;
  const used=usedAttempts(); if(used>=MAX_ATTEMPTS) return;
  attempt=used+1; build(); cur=0; exits=[]; startedAt=Date.now(); sendInfo={count:0,status:''};
  phase='quiz'; fioEl.disabled=true; clsEl.disabled=true; renderQuiz(); window.scrollTo(0,0);
}

/* ===================== ВОПРОСЫ ===================== */
function answered(){return qs.filter(q=>q.ans!==null).length;}
function renderQuiz(){
  const q=qs[cur], t=TOPICS.find(x=>x.id===q.t), n=answered();
  let h='<div class="card">'+
   '<div class="tbar"><span class="tname">'+t.name+'</span><span>Попытка '+attempt+' из '+MAX_ATTEMPTS+' · Отвечено <b>'+n+'</b> из '+TOTAL+'</span></div>'+
   '<div class="nums">'+qs.map((x,k)=>'<button data-n="'+k+'" class="'+(x.ans!==null?'ans':'')+(k===cur?' cur':'')+'" aria-label="Вопрос '+(k+1)+'">'+(k+1)+'</button>').join('')+'</div>'+
   '<div class="legend"><span><i class="a"></i>ответ выбран</span><span><i></i>ответа пока нет</span><span><i class="c"></i>текущий вопрос</span></div>';
  if(exits.length) h+='<div class="note">Выходов из окна контрольной: <b>'+exits.length+'</b>. Они записываются и будут видны учителю.</div>';
  h+='<div class="qcard"><div class="qt">'+(cur+1)+'. '+esc(q.q)+'</div><div class="opts">'+
   q.opts.map((o,k)=>'<button data-k="'+k+'" class="'+(q.ans===o?'sel':'')+'">'+esc(o)+'</button>').join('')+'</div>'+
   '<div class="navrow"><button class="big-btn sec" id="prevBtn"'+(cur===0?' disabled':'')+'>← Назад</button>'+
   '<button class="big-btn sec" id="nextBtn"'+(cur===qs.length-1?' disabled':'')+'>Дальше →</button></div></div>'+
   '<div class="finrow"><button class="big-btn'+(n<TOTAL?' sec':'')+'" id="finBtn">Завершить и проверить ✓</button></div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.nums button').forEach(b=>b.onclick=()=>{cur=+b.dataset.n;renderQuiz();});
  app.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{q.ans=q.opts[+b.dataset.k];renderQuiz();});
  document.getElementById('prevBtn').onclick=()=>{if(cur>0){cur--;renderQuiz();}};
  document.getElementById('nextBtn').onclick=()=>{if(cur<qs.length-1){cur++;renderQuiz();}};
  document.getElementById('finBtn').onclick=()=>{
    const left=TOTAL-answered();
    ask(left?'Без ответа '+plural(left,'остался','осталось','осталось')+' <b>'+left+'</b> '+plural(left,'вопрос','вопроса','вопросов')+'. Они будут засчитаны как неверные.<br><br>Завершить контрольную?'
            :'Вы ответили на все вопросы. После завершения изменить ответы будет нельзя.<br><br>Завершить контрольную?',
        'Завершить','Вернуться к вопросам',finish);
  };
}
function finish(){
  if(phase!=='quiz') return;
  phase='done'; finishedAt=Date.now(); saveAttempts(attempt);
  renderResult(); window.scrollTo(0,0);
  sendResult(true);
}

/* ===================== РЕЗУЛЬТАТ ===================== */
function calc(){
  const per=TOPICS.map(t=>({id:t.id,name:t.name,got:0,max:t.n}));
  qs.forEach(q=>{ if(q.ans===q.right) per.find(p=>p.id===q.t).got++; });
  const tot=per.reduce((a,p)=>a+p.got,0);
  const pct=Math.round(100*tot/TOTAL), grade=Math.max(1,Math.round(pct/10));
  const minutes=Math.max(1,Math.round((finishedAt-startedAt)/60000));
  return {per,tot,max:TOTAL,pct,grade,minutes,unanswered:qs.filter(q=>q.ans===null).length};
}
function wrongList(){
  return qs.map((q,k)=>({n:k+1,q:q.q,your:q.ans===null?'нет ответа':q.ans,right:q.right,ok:q.ans===q.right})).filter(e=>!e.ok);
}
function renderResult(){
  const r=calc(), w=wrongList(), left=MAX_ATTEMPTS-attempt;
  let h='<div class="card"><h2>Результат контроля</h2>'+
   '<p style="font-size:22px">Ученик: <b>'+esc(fio())+'</b>, класс: <b>'+esc(clsEl.value)+'</b>. Попытка '+attempt+' из '+MAX_ATTEMPTS+'.</p>'+
   '<div style="overflow-x:auto"><table class="res"><tr><th>Тема</th><th>Верно</th></tr>'+
   r.per.map(p=>'<tr><td>'+p.name+'</td><td><b>'+p.got+'</b> из '+p.max+'</td></tr>').join('')+
   '<tr><td><b>Всего</b></td><td><b>'+r.tot+'</b> из '+r.max+' ('+r.pct+'%)</td></tr></table></div>'+
   '<div class="grade">Оценка: '+r.grade+' из 10</div>'+
   '<div class="sendst" id="sendStatus">'+sendInfo.status+'</div>';
  if(exits.length) h+='<div class="note">Выходов из окна контрольной: <b>'+exits.length+'</b>.</div>';
  if(w.length){
    h+='<h2 style="font-size:23px;margin-top:14px">Над чем поработать</h2><ul class="err">'+w.map(e=>'<li>'+e.n+'. '+esc(e.q)+'<br>Ваш ответ: '+esc(e.your)+' · Правильно: <b>'+esc(e.right)+'</b></li>').join('')+'</ul>';
  } else h+='<p class="center" style="font-size:22px">Ошибок нет — отлично!</p>';
  h+='<div class="btns"><button class="big-btn" id="sendBtn">📨 Отправить учителю ещё раз</button>'+
     '<button class="big-btn sec" id="txtBtn">Сохранить результат (.txt)</button></div>'+
     '<div class="btns">'+(left>0?'<button class="big-btn sec" id="againBtn">Пройти ещё раз (осталась '+left+' попытка)</button>':'')+
     '<button class="big-btn sec" id="nextStudent">Следующий ученик</button></div></div>';
  app.innerHTML=h;
  document.getElementById('sendBtn').onclick=()=>sendResult(false);
  document.getElementById('txtBtn').onclick=saveTxt;
  const ab=document.getElementById('againBtn');
  if(ab) ab.onclick=()=>ask('Пройти контрольную ещё раз? Вопросы будут другими.<br>Первый результат уже записан, учитель учтёт лучший.','Начать вторую попытку','Отмена',()=>{
    attempt++; build(); cur=0; exits=[]; startedAt=Date.now(); sendInfo={count:0,status:''}; phase='quiz'; renderQuiz(); window.scrollTo(0,0);
  });
  document.getElementById('nextStudent').onclick=()=>ask('Передать компьютер следующему ученику? Фамилия и результат на экране будут стёрты.','Да, следующий ученик','Отмена',resetAll);
}
function resetAll(){
  phase='intro'; qs=[]; exits=[]; fioEl.disabled=false; clsEl.disabled=false; fioEl.value=''; clsEl.value=''; markEmpty(); renderIntro(); window.scrollTo(0,0);
}
function report(){
  const r=calc(), w=wrongList(), d=new Date(finishedAt);
  let t='Контроль: компьютерная графика\r\nУченик: '+fio()+'\r\nКласс: '+clsEl.value+'\r\nДата: '+d.toLocaleDateString('ru-RU')+' '+hhmm(d)+
    '\r\nПопытка: '+attempt+' из '+MAX_ATTEMPTS+'\r\nВремя работы: '+r.minutes+' мин\r\n\r\n';
  r.per.forEach(p=>{t+=p.name+': '+p.got+' из '+p.max+'\r\n';});
  t+='\r\nВсего: '+r.tot+' из '+r.max+' ('+r.pct+'%)\r\nОценка: '+r.grade+' из 10\r\nБез ответа: '+r.unanswered+
     '\r\nВыходов из окна: '+exits.length+(exits.length?' ('+exits.join(', ')+')':'')+'\r\n';
  if(w.length){ t+='\r\nОшибки:\r\n'; w.forEach(e=>{t+=e.n+') '+e.q+'\r\n   Ответ ученика: '+e.your+'; правильно: '+e.right+'\r\n';}); }
  return t;
}
function saveTxt(){
  const blob=new Blob(['﻿'+report()],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='Контроль_графика_'+fio().replace(/[\\/:*?"<>|]+/g,'').replace(/\s+/g,'_')+'_попытка'+attempt+'.txt';
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}

/* ===================== ОТПРАВКА УЧИТЕЛЮ ===================== */
function setSend(html){ sendInfo.status=html; const e=document.getElementById('sendStatus'); if(e) e.innerHTML=html; }
function sendResult(auto){
  if(phase!=='done') return;
  if(GOOGLE_SHEET_URL.indexOf('PASTE_')===0){ setSend('<span class="no">Отправка учителю не настроена. Нажмите «Сохранить результат (.txt)» и покажите результат учителю.</span>'); return; }
  const r=calc(), w=wrongList(), g=id=>{const p=r.per.find(x=>x.id===id);return p.got+' из '+p.max;};
  const data={test:TEST_ID, fio:fio(), cls:clsEl.value, attempt:attempt, score:r.tot, max:r.max, pct:r.pct, grade:r.grade,
    form:g('form'), zoom:g('zoom'), use:g('use'), fmt:g('fmt'), col:g('col'), pick:g('pick'),
    unanswered:r.unanswered, exits:exits.length, exitTimes:exits.join(', '), minutes:r.minutes, sent:sendInfo.count+1,
    errors:w.map(e=>e.q+' → '+e.your).join(' | ').slice(0,3000)};
  const btn=document.getElementById('sendBtn'); if(btn) btn.disabled=true;
  setSend('Отправляю результат учителю…');
  fetch(GOOGLE_SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)})
   .then(()=>{ sendInfo.count++; setSend('<span class="ok">✓ Результат отправлен учителю ('+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})+').</span>'); if(btn) btn.disabled=false; })
   .catch(()=>{ setSend('<span class="no">Не получилось отправить: проверьте интернет и нажмите «Отправить учителю ещё раз». Если не получится — сохраните результат (.txt).</span>'); if(btn) btn.disabled=false; });
}

/* ===================== ЗАЩИТА ===================== */
function leave(){
  if(phase!=='quiz') return;
  const n=Date.now(); if(n-lastExit<1500) return; lastExit=n; exits.push(hhmm(new Date()));
}
document.addEventListener('visibilitychange',()=>{ if(document.hidden) leave(); else if(phase==='quiz') renderQuiz(); });
window.addEventListener('blur',leave);
window.addEventListener('focus',()=>{ if(phase==='quiz') renderQuiz(); });
['contextmenu','copy','cut','dragstart','selectstart'].forEach(ev=>document.addEventListener(ev,e=>{ if(e.target.tagName!=='INPUT') e.preventDefault(); }));
document.addEventListener('keydown',e=>{
  const k=e.code;
  if(k==='F12' || (e.ctrlKey&&e.shiftKey&&(k==='KeyI'||k==='KeyJ'||k==='KeyC')) || (e.ctrlKey&&(k==='KeyU'||k==='KeyS'||k==='KeyP'))) e.preventDefault();
});
window.addEventListener('beforeunload',e=>{ if(phase==='quiz'){ e.preventDefault(); e.returnValue=''; } });

/* ===================== ЗАПУСК ===================== */
[fioEl,clsEl].forEach(e=>{const f=()=>{markEmpty(); if(phase==='intro') updIntro();}; e.addEventListener('input',f); e.addEventListener('change',f);});
window.addEventListener('pageshow',()=>{ if(phase==='intro'){ fioEl.value=''; clsEl.value=''; markEmpty(); updIntro(); } });
fioEl.value=''; clsEl.value=''; markEmpty(); renderIntro();
</script>
</body>
