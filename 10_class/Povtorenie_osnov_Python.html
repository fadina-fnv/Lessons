<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Повторяем основы Python</title>
<style>
:root{
  --bg:#f3f7fc; --card:#ffffff; --text:#1f2a3a; --muted:#56657a; --line:#cdd8e6;
  --blue:#2459a8; --blue-soft:#e4eefc; --green:#1d8a57; --green-soft:#e2f6ec;
  --orange:#d9771a; --orange-soft:#fff1e0; --violet:#6b4bb8; --violet-soft:#efeafc;
  --code-bg:#f2f5fa; --kw:#2459a8; --fn:#7a3fb0; --str:#1d7a3e; --num:#b35a00; --com:#7a8799;
}
*{box-sizing:border-box}
html{font-size:19px}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Times New Roman",Times,serif;line-height:1.45}
code,pre,.mono,kbd{font-family:"JetBrains Mono",Consolas,"Courier New",monospace}
code{background:var(--code-bg);border:1px solid var(--line);border-radius:5px;padding:0 .25em;font-size:.88em}
header{background:linear-gradient(120deg,#dceafe 0%,#e3f7ee 100%);border-bottom:2px solid var(--line);padding:18px 20px 14px}
header h1{margin:0;font-size:1.75rem;color:var(--blue)}
header p{margin:4px 0 0;color:var(--muted);font-size:1.02rem}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.student{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin:16px 0 12px}
.student label{font-weight:bold}
.student input,.student select{font:inherit;font-size:1rem;padding:6px 10px;border:2px solid var(--line);border-radius:8px;background:#fff}
.student input{min-width:250px}
.student .grow{flex:1}
.modes{display:inline-flex;border:2px solid var(--blue);border-radius:10px;overflow:hidden}
.modes button{font:inherit;font-size:1rem;border:0;background:#fff;color:var(--blue);padding:7px 14px;cursor:pointer}
.modes button.on{background:var(--blue);color:#fff}
.modes button.on.ctrl{background:var(--violet)}
nav.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
nav.tabs button{font:inherit;font-size:1rem;border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px 13px;cursor:pointer;color:var(--text)}
nav.tabs button .n{display:inline-block;min-width:1.5em;height:1.5em;border-radius:50%;background:var(--blue-soft);color:var(--blue);font-weight:bold;text-align:center;margin-right:6px;font-size:.9em;line-height:1.5em}
nav.tabs button:disabled{opacity:.45;cursor:not-allowed}
nav.tabs button.on{border-color:var(--blue);background:var(--blue-soft);font-weight:bold}
nav.tabs button.py{border-color:#9cc9b2}
nav.tabs button.py.on{background:var(--green-soft);border-color:var(--green)}
.panel{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:22px}
.subtabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.subtabs button{font:inherit;font-size:1.02rem;padding:7px 16px;border-radius:999px;border:2px solid var(--line);background:#fff;cursor:pointer}
.subtabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.mode-banner{border-radius:10px;padding:8px 14px;margin-bottom:14px;font-size:1rem}
.mode-banner.learn{background:var(--blue-soft);color:var(--blue)}
.mode-banner.ctrl{background:var(--violet-soft);color:var(--violet)}
h2{margin:.2em 0 .5em;font-size:1.45rem;color:var(--blue)}
h3{margin:1.1em 0 .4em;font-size:1.18rem;color:var(--blue)}
.theory p{margin:.45em 0}
.theory table{border-collapse:collapse;margin:.5em 0 .8em;width:100%;max-width:760px}
.theory td,.theory th{border:1.5px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
.theory th{background:var(--blue-soft)}
.box{border-radius:10px;padding:10px 14px;margin:.7em 0}
.box.rule{background:var(--blue-soft);border-left:6px solid var(--blue)}
.box.warn{background:var(--orange-soft);border-left:6px solid var(--orange)}
.box.link{background:var(--green-soft);border-left:6px solid var(--green)}
pre.code{background:var(--code-bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;margin:.5em 0;font-size:.9rem;line-height:1.5;overflow-x:auto;white-space:pre}
pre.code.nums{counter-reset:ln}
pre.code.nums .ln{counter-increment:ln}
pre.code.nums .ln::before{content:counter(ln);display:inline-block;width:1.6em;color:var(--com);margin-right:.6em;text-align:right;border-right:1px solid var(--line);padding-right:.4em}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .2em;font-size:.95em}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .2em}
.math{font-style:italic;font-size:1.1em}
.tk{color:var(--kw);font-weight:bold}.tf{color:var(--fn)}.ts{color:var(--str)}.tn{color:var(--num)}.tc{color:var(--com);font-style:italic}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two>div{min-width:0}
.out{background:#fff;border:1.5px dashed var(--line);border-radius:10px;padding:8px 14px;font-family:"JetBrains Mono",Consolas,monospace;font-size:.9rem;white-space:pre;overflow-x:auto}
.cap{font-size:.9rem;color:var(--muted);margin-top:.4em}
details.try{background:#fbfcfe;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;margin:.6em 0}
details.try summary{cursor:pointer;color:var(--blue);font-weight:bold}
.task{border:2px solid var(--line);border-radius:12px;padding:14px 16px;background:#fcfdff}
.task .head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:.95rem;margin-bottom:6px}
.task .q{font-size:1.1rem;font-weight:bold;margin:.2em 0 .4em}
.task .given{margin:.4em 0}
kbd{background:#fff;border:1.5px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:1px 7px;font-size:.9em}
.answer{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.answer input{font-family:"JetBrains Mono",Consolas,monospace;font-size:1rem;padding:8px 12px;border:2px solid var(--line);border-radius:8px;min-width:260px;flex:1;max-width:520px}
.opts{display:grid;gap:8px;margin-top:10px}
.opts button{font:inherit;font-size:1.02rem;text-align:left;padding:9px 13px;border:2px solid var(--line);border-radius:10px;background:#fff;cursor:pointer}
.opts button.mono{font-family:"JetBrains Mono",Consolas,monospace;font-size:.92rem}
.opts button:disabled{color:var(--text);opacity:1;cursor:default}
.opts button.sel{border-color:var(--blue);background:var(--blue-soft)}
.opts button.right{border-color:var(--green);background:var(--green-soft)}
.opts button.wrong{border-color:var(--orange);background:var(--orange-soft)}
.btn{font:inherit;font-size:1.02rem;padding:9px 18px;border-radius:10px;border:2px solid var(--blue);background:var(--blue);color:#fff;cursor:pointer}
.btn.sec{background:#fff;color:var(--blue)}
.btn.green{background:var(--green);border-color:var(--green)}
.btn.violet{background:var(--violet);border-color:var(--violet)}
.btn:disabled{opacity:.5;cursor:default}
.fb{margin-top:12px;border-radius:10px;padding:10px 14px}
.fb.ok{background:var(--green-soft);border-left:6px solid var(--green)}
.fb.no{background:var(--orange-soft);border-left:6px solid var(--orange)}
.fb b.t{font-size:1.08rem}
.fb table{border-collapse:collapse;margin:.4em 0;font-size:.92rem}
.fb td,.fb th{border:1px solid var(--line);padding:3px 8px;background:#fff}
.progress{display:flex;gap:4px;margin:4px 0 12px;flex-wrap:wrap}
.progress span{width:26px;height:10px;border-radius:5px;background:var(--line)}
.progress span.ok{background:var(--green)}
.progress span.no{background:var(--orange)}
.progress span.cur{background:var(--blue)}
.progress span.ans{background:var(--violet)}
.cnav{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.cnav button{font-family:"JetBrains Mono",Consolas,monospace;font-size:.95rem;width:42px;height:38px;border-radius:8px;border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--text)}
.cnav button.done{background:var(--violet-soft);border-color:#b9a6e8;color:var(--violet);font-weight:bold}
.cnav button.cur{border-color:var(--violet);box-shadow:0 0 0 2px var(--violet)}
.cbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:6px}
.confirm{background:var(--violet-soft);border:2px solid var(--violet);border-radius:12px;padding:12px 16px;margin:10px 0}
.review td.skip{color:var(--muted)}
.summary{text-align:center;padding:10px}
.big{font-size:2.6rem;font-weight:bold;color:var(--violet)}
.review{width:100%;border-collapse:collapse;margin-top:12px;font-size:.95rem}
.review td,.review th{border:1.5px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.review th{background:var(--violet-soft)}
.review td.ok{color:var(--green);font-weight:bold}
.review td.no{color:var(--orange);font-weight:bold}
.review pre{margin:0;font-size:.8rem;white-space:pre-wrap}
.note{color:var(--muted);font-size:.95rem}
.level{border:2px solid var(--line);border-radius:12px;padding:12px 16px;margin:12px 0;background:#fcfdff}
.level h3{margin-top:.2em}
.level .tag{display:inline-block;border-radius:999px;padding:1px 10px;font-size:.88rem;margin-left:6px;vertical-align:middle}
.tagA{background:var(--green-soft);color:var(--green)}.tagB{background:var(--blue-soft);color:var(--blue)}.tagC{background:var(--violet-soft);color:var(--violet)}.tagS{background:var(--orange-soft);color:var(--orange)}
.io{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:640px}
.io div b{display:block;font-size:.9rem;color:var(--muted)}
.check{background:var(--blue-soft);border-radius:10px;padding:10px 14px;margin-top:10px}
.check input,.check select{font-family:"JetBrains Mono",Consolas,monospace;font-size:1rem;padding:6px 10px;border:2px solid var(--line);border-radius:8px;width:150px}
.check .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:6px 0}
.res-table{width:100%;border-collapse:collapse}
.res-table td,.res-table th{border:1.5px solid var(--line);padding:7px 10px;text-align:left}
.res-table th{background:var(--blue-soft)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--blue);color:#fff;padding:10px 18px;border-radius:10px;font-size:1rem;display:none;z-index:9;max-width:90vw}
@media (max-width:760px){
  html{font-size:17px}
  header h1{font-size:1.4rem}
  .two,.io{grid-template-columns:1fr}
  .student input{min-width:0;width:100%}
  .student .grow{flex-basis:100%}
  .panel{padding:14px 12px}
  .answer input{min-width:0;width:100%}
  pre.code{font-size:.82rem}
  .theory table,.review{display:block;overflow-x:auto}
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>🐍 Повторяем основы Python</h1>
    <p>Учебник-тренажёр: ввод и вывод · переменные и типы данных · условия · циклы for и while</p>
  </div>
</header>

<div class="wrap">
  <div class="student">
    <label for="fio">Фамилия, имя:</label>
    <input id="fio" type="text" autocomplete="off" name="fio_nosave">
    <label for="cls">Класс:</label>
    <select id="cls"><option value="">— выбери —</option><option>10А</option><option>10Б</option></select>
    <span class="grow"></span>
    <span id="saveState" class="note"></span>
  </div>

  <nav class="tabs" id="tabs"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============ утилиты ============ */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const L=(...l)=>l.join('\n');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const pf=v=>Number.isInteger(v)?v+'.0':String(v); // как Python печатает float
function hl(code){
  const re=/(#.*$)|('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*")|\b(if|elif|else|for|in|while|and|or|not|break|continue|True|False|def|return)\b|\b(print|input|int|float|str|bool|range|map|type|len|round|split)\b|(\b\d+(?:\.\d+)?\b)/g;
  return code.split('\n').map(line=>{
    let out='',last=0;
    line.replace(re,(m,c,s,k,f,n,off)=>{
      out+=esc(line.slice(last,off));last=off+m.length;
      const cls=c?'tc':s?'ts':k?'tk':f?'tf':'tn';
      out+=`<span class="${cls}">${esc(m)}</span>`;return m;});
    out+=esc(line.slice(last));
    return out;
  });
}
function codeBlock(code,nums){
  const lines=hl(code);
  if(nums) return `<pre class="code nums">${lines.map(l=>`<span class="ln">${l}</span>`).join('\n')}</pre>`;
  return `<pre class="code">${lines.join('\n')}</pre>`;
}
function trace(head,rows){
  return `<table><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table>`;
}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',2600);}

/* ============ генераторы заданий ============
   kind:'input' — ответ вводится; kind:'choice' — выбор варианта (ans — индекс)
*/
const G={io:[],vars:[],cond:[],for:[],while:[]};
const OUT='Что появится на экране? Впиши вывод программы.';

/* ---------- 1. Ввод и вывод ---------- */
G.io.push(function(){ // sep
  const a=R(1,30),b=pick(['кот','py','ok','Да','abc']),c=R(10,99),s=pick(['-','.','*',':','/','','+']);
  return {kind:'input',text:OUT,code:`print(${a}, '${b}', ${c}, sep='${s}')`,ans:[a,b,c].join(s),
    explain:`Параметр <code>sep</code> — разделитель между значениями. Здесь <code>sep='${esc(s)}'</code>${s===''?' — пустая строка, поэтому значения «склеиваются» без пробелов':''}. Если <code>sep</code> не указан, значения разделяются пробелом.`};
});
G.io.push(function(){ // end
  if(Math.random()<.5){
    const w1=pick(['Привет','Python','Старт','Готово']),w2=pick(['мир','код','финиш','!']),e=pick(['-','!','...','*','']);
    return {kind:'input',text:OUT+' (весь вывод окажется в одной строке)',code:L(`print('${w1}', end='${e}')`,`print('${w2}')`),ans:w1+e+w2,
      explain:`Обычно <code>print()</code> после вывода переходит на новую строку. Параметр <code>end='${esc(e)}'</code> заменяет этот переход на ${e===''?'пустую строку':'символы <code>'+esc(e)+'</code>'}, поэтому второе слово печатается в той же строке.`};
  }
  const a=R(1,9),b=R(1,9),c=R(1,9),d=R(1,9),e=pick([';','!','|']);
  return {kind:'input',text:OUT+' (весь вывод окажется в одной строке)',code:L(`print(${a}, ${b}, ${c}, end='${e}')`,`print(${d})`),ans:`${a} ${b} ${c}${e}${d}`,
    explain:`Между значениями стоит пробел (разделитель по умолчанию), а в конце вместо перехода на новую строку печатается <code>${e}</code>. Следующий <code>print</code> продолжает ту же строку.`};
});
G.io.push(function(){ // + и * со строками
  const v=R(1,4);
  if(v===1){const s=pick(['ab','12','*-','Ок']),n=R(2,4);return {kind:'input',text:OUT,code:`print('${s}' * ${n})`,ans:s.repeat(n),explain:`Строку можно «умножить» на целое число — она повторится ${n} раза: <code>'${s}' * ${n}</code> → <code>${s.repeat(n)}</code>.`};}
  if(v===2){const x=R(11,25),n=R(2,3);return {kind:'input',text:OUT,code:`print(${x} * ${n})`,ans:String(x*n),explain:`Здесь <b>число</b> ${x} (без кавычек), поэтому выполняется обычное умножение: ${x}·${n} = ${x*n}. Сравни: <code>'${x}' * ${n}</code> дало бы <code>${String(x).repeat(n)}</code>.`};}
  if(v===3){const a=String(R(10,40)),b='0'+R(1,9);return {kind:'input',text:OUT,code:`print('${a}' + '${b}')`,ans:a+b,explain:`В кавычках — <b>строки</b>, а знак <code>+</code> для строк означает «склеить» (конкатенация): '${a}' + '${b}' = '${a+b}'. Числами они не складываются!`};}
  const p=pick([['Везде','ход'],['Пар','оход'],['шести','классник'],['Сам','олёт'],['Кит','ай']]);
  return {kind:'input',text:OUT,code:`print('${p[0]}' + '${p[1]}')`,ans:p[0]+p[1],explain:`Знак <code>+</code> склеивает строки без пробела: <code>${p[0]+p[1]}</code>.`};
});
G.io.push(function(){ // input возвращает строку
  const v=R(1,4),d=R(2,9);
  if(v===1)return {kind:'input',text:'Что появится на экране?',code:L('x = input()','print(x * 2)'),input:String(d),ans:String(d)+String(d),
    explain:`<code>input()</code> <b>всегда</b> возвращает строку (str). x = '${d}', а строка, умноженная на 2, повторяется: '${d}${d}'. Чтобы получить число, нужно <code>int(input())</code>.`};
  if(v===2)return {kind:'input',text:'Что появится на экране?',code:L('x = int(input())','print(x * 2)'),input:String(d),ans:String(2*d),
    explain:`<code>int()</code> превращает введённую строку '${d}' в целое число ${d}, поэтому ${d}·2 = ${2*d}.`};
  if(v===3){const a=R(10,30),b=R(1,9);return {kind:'input',text:'Пользователь вводит два значения (каждое — с новой строки). Что появится на экране?',code:L('a = input()','b = input()','print(a + b)'),input:a+' и '+b,ans:String(a)+String(b),
    explain:`a и b — строки ('${a}' и '${b}'), поэтому <code>+</code> их склеивает: '${a}${b}'. Чтобы сложить как числа: <code>a = int(input())</code>.`};}
  return {kind:'input',text:'Что появится на экране?',code:L('x = float(input())','print(x)'),input:String(d),ans:d+'.0',
    explain:`<code>float()</code> делает вещественное число, поэтому ${d} печатается как <code>${d}.0</code>.`};
});
G.io.push(function(){ // map split
  const a=R(2,30),b=R(2,30),v=R(1,3);
  if(v===1)return {kind:'input',text:'Что появится на экране?',code:L('a, b = map(int, input().split())','print(a + b)'),input:`${a} ${b}`,ans:String(a+b),
    explain:`<code>input().split()</code> разрезает строку '${a} ${b}' по пробелу на две части, <code>map(int, …)</code> превращает каждую часть в целое число. a = ${a}, b = ${b}, a + b = ${a+b}.`};
  if(v===2)return {kind:'input',text:'Что появится на экране?',code:L('a, b = input().split()','print(a + b)'),input:`${a} ${b}`,ans:`${a}${b}`,
    explain:`Без <code>map(int, …)</code> части остаются <b>строками</b>: a = '${a}', b = '${b}'. Строки склеиваются: '${a}${b}'.`};
  const c=R(1,9);
  return {kind:'input',text:'Что появится на экране?',code:L('a, b, c = map(int, input().split())','print(a * b - c)'),input:`${a} ${b} ${c}`,ans:String(a*b-c),
    explain:`a = ${a}, b = ${b}, c = ${c}. Сначала умножение: ${a}·${b} = ${a*b}, затем вычитание: ${a*b} − ${c} = ${a*b-c}.`};
});
G.io.push(function(){ // несколько аргументов
  if(Math.random()<.5){const a=R(2,40),b=R(2,40);return {kind:'input',text:OUT,code:`print('${a}+${b}=', ${a}+${b})`,ans:`${a}+${b}= ${a+b}`,
    explain:`Первый аргумент — <b>текст</b> в кавычках, он печатается как есть: <code>${a}+${b}=</code>. Второй — выражение, Python его вычисляет: ${a+b}. Между аргументами — пробел.`};}

  return {kind:'input',text:'Что выведет программа?',code:L('s = 0','k = 0',`i = ${a}`,`while i <= ${b}:`,`    if i % ${m} == 0:`,'        s += i','        k += 1','    i += 1','print(k, s)'),ans:`${k} ${s}`,
    explain:`Перебираются числа от ${a} до ${b}; числа, кратные ${m}: ${rng(a,b+1,1).filter(i=>i%m===0).join(', ')}. Их количество k = ${k}, сумма s = ${s}. Обрати внимание: <code>i += 1</code> стоит вне if — иначе цикл стал бы бесконечным.`};
});

/* Адрес веб-приложения Google Apps Script (вставить после развёртывания скрипта).

function makeTasks(mod,n){
  let gens=[];
  if(mod==='final'){const per=Math.ceil(n/5);['io','vars','cond','for','while'].forEach(m=>{gens.push(...shuffle(G[m]).slice(0,per).map(g=>({g,m})));});gens=shuffle(gens).slice(0,n);}
  else{let pool=[];while(pool.length<n)pool.push(...shuffle(G[mod]));gens=pool.slice(0,n).map(g=>({g,m:mod}));}
  return gens.map(x=>Object.assign(x.g(),{mod:x.m}));
}
function newSession(mod,mode){return {tasks:makeTasks(mod,mode==='learn'?LEARN_N:CTRL_N),idx:0,ans:[],checked:false,sel:null,started:mode==='learn',done:false,logged:false};}

function ctrlActive(){const f=S.sess.final&&S.sess.final.control;return !!(f&&f.started&&!f.done);}
function setDirty(v){S.dirty=v;const el=document.getElementById('saveState');if(el)el.innerHTML=v?'⚠️ Есть несохранённые результаты':'';}
function enterModule(id){

}

/* ============ проверка ответа ============ */
const LOOKALIKE={A:'А',B:'В',C:'С',E:'Е',H:'Н',K:'К',M:'М',O:'О',P:'Р',T:'Т',X:'Х',a:'а',c:'с',e:'е',o:'о',p:'р',x:'х',y:'у'};
function normalize(s,seq){
  s=String(s).replace(/ /g,' ').trim();
  if(seq)s=s.replace(/[,;]/g,' ');
  s=s.replace(/[ABCEHKMOPTXaceopxy]/g,ch=>LOOKALIKE[ch]); // латинские буквы-двойники → русские
  return s.replace(/\s+/g,' ');
}
function isCorrect(t,given){
  if(t.kind==='choice')return given===t.ans;
  const g=normalize(given,t.seq),a=normalize(t.ans,t.seq);
  if(t.ans==='пусто')return /^(пусто|пустая|пустой|нет|ничего|-|—)$/i.test(g);
  return g===a;
}
function quoteHint(t,given){
  if(t.kind!=='input')return '';
  const g=normalize(given,t.seq);
  if(/^['"].*['"]$/.test(g)&&normalize(g.slice(1,-1),t.seq)===normalize(t.ans,t.seq))return '<br>💡 Кавычки на экран <b>не выводятся</b> — они только показывают Python, где начинается и заканчивается строка.';
  if(normalize(t.ans).includes('.0')&&g+'.0'===normalize(t.ans))return '<br>💡 Обрати внимание на тип: результат — вещественное число (float).';
  return '';
}

function progressBar(s,mode){
  return '<div class="progress">'+s.tasks.map((t,i)=>{let c='';if(i<s.ans.length)c=mode==='learn'?(s.ans[i].ok?'ok':'no'):'ans';else if(i===s.idx&&!s.done)c='cur';return `<span class="${c}"></span>`;}).join('')+'</div>';
}
function taskBody(t){
  let h=`<div class="q">${t.text}</div>`;
  if(t.code)h+=codeBlock(t.code,t.nums);
  if(t.input)h+=`<div class="given">⌨️ Пользователь вводит: <kbd>${esc(t.input)}</kbd></div>`;
  return h;
}
function taskHTML(mode){
  const s=S.sess[S.mod][mode];
  if(mode==='control'&&!s.started){
    return `<p>В контрольной работе ${CTRL_N} заданий по всем темам: ввод и вывод, переменные и типы, условия, циклы for и while (по ${CTRL_N/5} на каждую тему). Подсказок и разборов во время работы нет. Между заданиями можно переходить по номерам и менять ответы. Закончить контроль можно в любой момент кнопкой «Завершить контроль» — оценка ставится <b>только по решённым заданиям</b>. Пока контроль не завершён, другие вкладки недоступны.</p><p>Контроль можно пройти несколько раз — сохраняются все попытки.</p><p>Перед началом впиши <b>фамилию, имя</b> и выбери <b>класс</b> вверху страницы.</p><button type="button" class="btn violet" id="startCtrl">${S.ctrl.length?'Начать новую попытку':'Начать контроль'}</button>`;
  }
  if(s.done)return summaryHTML(s,mode);
  if(mode==='control')return ctrlHTML(s);

  let h=progressBar(s,mode)+`<div class="task"><div class="head"><span>Задание ${s.idx+1} из ${s.tasks.length}</span>${S.mod==='final'?`<span>Тема: ${TITLE[t.mod]}</span>`:''}</div>`+taskBody(t);
  if(t.kind==='choice'){
    h+=`<div class="opts">`+t.opts.map((o,i)=>{let c='';if(s.checked&&mode==='learn'){if(i===t.ans)c='right';else if(i===s.sel)c='wrong';}else if(i===s.sel)c='sel';
      return `<button type="button" data-i="${i}" class="${t.mono?'mono':''} ${c}" ${s.checked?'disabled':''}>${t.pre?`<pre style="margin:0;font:inherit">${esc(o)}</pre>`:esc(o)}</button>`;}).join('')+`</div>`;
  }else{
    h+=`<div class="answer"><input type="text" id="ansIn" autocomplete="off" spellcheck="false" placeholder="Твой ответ" ${s.checked?'disabled':''} value="${s.checked?esc(s.ans[s.idx].given):''}"></div>`;
  }
  if(mode==='learn'){
    if(!s.checked)h+=`<div class="answer"><button type="button" class="btn" id="chk">Проверить</button></div>`;
    else{const a=s.ans[s.idx];
      h+=`<div class="fb ${a.ok?'ok':'no'}"><b class="t">${a.ok?'✔ Верно!':'✘ Не совсем.'}</b>${a.ok?'':` Правильный ответ: <code>${esc(t.kind==='choice'?t.opts[t.ans]:t.ans)}</code>`}${a.ok?'':quoteHint(t,a.given)}<div style="margin-top:6px">${t.explain}</div>${!a.ok&&S.mod!=='final'?'<div style="margin-top:8px"><button type="button" class="btn sec" id="toTheory">📘 Открыть справку по теме</button></div>':''}</div>
      <div class="answer"><button type="button" class="btn" id="nxt">${s.idx+1<s.tasks.length?'Следующее задание →':'Итоги серии →'}</button></div>`;}
  }else{
    h+=`<div class="answer"><button type="button" class="btn violet" id="chk">${s.idx+1<s.tasks.length?'Ответить и дальше →':'Ответить и завершить'}</button></div>`;
  }
  return h+'</div>';
}
function grade(c,n){return n?Math.round(c/n*10):0;}
const hasAns=r=>r!==null&&r!==undefined&&String(r).trim()!=='';
function ctrlHTML(s){
  if(!s.resp)s.resp=s.tasks.map(()=>null);
  const t=s.tasks[s.idx],r=s.resp[s.idx],cnt=s.resp.filter(hasAns).length;
  let h=`<div class="cbar"><b>Решено: <span id="cntDone">${cnt}</span> из ${s.tasks.length}</b><button type="button" class="btn sec" id="finCtrl">🏁 Завершить контроль</button></div>`;
  if(s.confirm)h+=`<div class="confirm"><b>Завершить контроль?</b><br>Решено ${cnt} из ${s.tasks.length} заданий. ${cnt<s.tasks.length?'Нерешённые задания не учитываются — оценка будет выставлена только по решённым.':'Все задания решены.'}${cnt?'':' <br>Ты не ответил ни на одно задание — попытка не будет засчитана.'}
    <div class="answer"><button type="button" class="btn violet" id="finYes">Да, завершить</button> <button type="button" class="btn sec" id="finNo">Продолжить решать</button></div></div>`;
  h+=`<div class="cnav">${s.tasks.map((x,i)=>`<button type="button" data-k="${i}" class="${hasAns(s.resp[i])?'done':''} ${i===s.idx?'cur':''}" title="Задание ${i+1}">${i+1}</button>`).join('')}</div>`;
  h+=`<div class="task"><div class="head"><span>Задание ${s.idx+1} из ${s.tasks.length}</span><span>Тема: ${TITLE[t.mod]}</span></div>`+taskBody(t);
  if(t.kind==='choice'){
    h+=`<div class="opts">`+t.opts.map((o,i)=>`<button type="button" data-i="${i}" class="${t.mono?'mono':''} ${r===i?'sel':''}">${t.pre?`<pre style="margin:0;font:inherit">${esc(o)}</pre>`:esc(o)}</button>`).join('')+`</div>`;
  }else{
    h+=`<div class="answer"><input type="text" id="ansIn" autocomplete="off" spellcheck="false" placeholder="Твой ответ" value="${hasAns(r)?esc(r):''}"></div>`;
  }
  h+=`<div class="answer"><button type="button" class="btn sec" id="cPrev" ${s.idx===0?'disabled':''}>← Предыдущее</button> <button type="button" class="btn violet" id="cNext" ${s.idx===s.tasks.length-1?'disabled':''}>Следующее →</button></div>`;
  return h+'</div>';
}
function bindCtrl(s){
  const area=document.getElementById('taskArea');
  const upd=()=>{const b=area.querySelector(`.cnav button[data-k="${s.idx}"]`);if(b)b.classList.toggle('done',hasAns(s.resp[s.idx]));document.getElementById('cntDone').textContent=s.resp.filter(hasAns).length;};
  const go=k=>{if(k<0||k>=s.tasks.length)return;s.idx=k;s.confirm=false;render();};
  area.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{s.resp[s.idx]=+b.dataset.i;area.querySelectorAll('.opts button').forEach(x=>x.classList.toggle('sel',+x.dataset.i===s.resp[s.idx]));upd();});
  const inp=document.getElementById('ansIn');
  if(inp){if(!s.confirm)inp.focus();inp.oninput=()=>{s.resp[s.idx]=inp.value;upd();};inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go(s.idx+1);}};}
  area.querySelectorAll('.cnav button').forEach(b=>b.onclick=()=>go(+b.dataset.k));
  document.getElementById('cPrev').onclick=()=>go(s.idx-1);
  document.getElementById('cNext').onclick=()=>go(s.idx+1);
  document.getElementById('finCtrl').onclick=()=>{s.confirm=true;render();};
  const y=document.getElementById('finYes');if(y)y.onclick=()=>finishCtrl(s);
  const n=document.getElementById('finNo');if(n)n.onclick=()=>{s.confirm=false;render();};
}
function finishCtrl(s){
  if(!s.resp.some(hasAns)){S.sess.final.control=newSession('final','control');toast('Нет ни одного ответа — попытка не засчитана');render();return;}
  s.ans=s.tasks.map((t,i)=>hasAns(s.resp[i])?{given:s.resp[i],ok:isCorrect(t,s.resp[i]),skip:false}:{given:null,ok:false,skip:true});
  s.done=true;s.confirm=false;logCtrl(s);setDirty(true);render();window.scrollTo({top:0,behavior:'smooth'});sendResults('sendMsg');
}
function summaryHTML(s,mode){
  const c=s.ans.filter(a=>a.ok).length,n=s.tasks.length;
  let h=`<div class="summary">`;
  if(mode==='learn'){h+=`<h3>Серия завершена!</h3><div class="big" style="color:var(--blue)">${c} из ${n}</div><p>${c===n?'Отлично — всё верно! 🎉':c>=n*0.7?'Хороший результат. Посмотри ещё раз задания, где были ошибки.':'Перечитай справку и попробуй новую серию — задания будут другими.'}</p>
    <button type="button" class="btn" id="again">Новая серия заданий</button></div>`;return h;}

  <table class="res-table" style="max-width:520px;margin:10px auto"><tr><th>Тема</th><th>Верно из решённых</th></tr>${TOPICS.map(id=>`<tr><td>${TITLE[id]}</td><td>${last.topics[id]}</td></tr>`).join('')}</table>

    return `<tr><td>${i+1}</td><td>${t.text.replace(/<br>/g,' ')}${t.code?`<pre class="mono">${esc(t.code)}</pre>`:''}${t.input?`<div class="note">Ввод: ${esc(t.input)}</div>`:''}</td><td class="${a.skip?'skip':a.ok?'ok':'no'}">${a.skip?'— не решено':(a.ok?'✔ ':'✘ ')+esc(gv)}</td><td>${esc(rv)}</td></tr>`;}).join('')+`</table>
    <p style="text-align:center;margin-top:14px"><button type="button" class="btn sec" id="saveTxt">💾 Сохранить результаты (.txt)</button> <button type="button" class="btn violet" id="retry">🔄 Пройти контроль ещё раз</button></p>`;
  return h;
}
function bindTask(){
  const area=document.getElementById('taskArea');if(!area)return;

    if(t.kind==='choice'){if(s.sel===null){toast('Выбери вариант ответа');return;}given=s.sel;}
    else{given=inp.value;if(!given.trim()){toast('Впиши ответ');return;}}
    const ok=isCorrect(t,given);s.ans.push({given,ok});

      s.checked=true;const st=S.learnStats[S.mod]||(S.learnStats[S.mod]={c:0,n:0});st.n++;if(ok)st.c++;setDirty(true);
    }else{
      s.sel=null;if(s.idx+1<s.tasks.length)s.idx++;else{s.done=true;logCtrl(s);setDirty(true);render();sendResults('sendMsg');return;}
    }
    render();
  };
  const nxt=document.getElementById('nxt');
  if(nxt){nxt.onclick=()=>{s.checked=false;s.sel=null;if(s.idx+1<s.tasks.length)s.idx++;else{s.done=true;const c=s.ans.filter(a=>a.ok).length;S.learnSeries.push({mod:S.mod,c,n:s.tasks.length,time:new Date()});}render();};nxt.focus();}

  const sv=document.getElementById('saveTxt');if(sv)sv.onclick=exportTxt;
  const rt=document.getElementById('retry');if(rt)rt.onclick=()=>{const ns=newSession('final','control');ns.started=true;S.sess.final.control=ns;render();window.scrollTo({top:0,behavior:'smooth'});};
}
const TOPICS=['io','vars','cond','for','while'];
function logCtrl(s){
  if(s.logged)return;s.logged=true;
  const c=s.ans.filter(a=>a.ok).length,a=s.ans.filter(x=>!x.skip).length,topics={};
  TOPICS.forEach(id=>{const idx=s.tasks.map((t,i)=>i).filter(i=>s.tasks[i].mod===id),done=idx.filter(i=>!s.ans[i].skip);topics[id]=done.length?`${done.filter(i=>s.ans[i].ok).length}/${done.length} (всего ${idx.length})`:`не решались (всего ${idx.length})`;});
  S.ctrl.push({mod:S.mod,c,a,n:s.tasks.length,g:grade(c,a),time:new Date(),topics,id:Date.now()+'-'+Math.random().toString(36).slice(2,7),
    details:s.tasks.map((t,i)=>({q:t.text.replace(/<[^>]+>/g,''),code:t.code||'',given:s.ans[i].skip?'не решено':t.kind==='choice'?t.opts[s.ans[i].given]:s.ans[i].given,right:t.kind==='choice'?t.opts[t.ans]:t.ans,ok:s.ans[i].ok,skip:s.ans[i].skip}))});
}

function digsum(n){let s=0;while(n>0){s+=n%10;n=Math.floor(n/10);}return s;}
const PYT={
 '1':{name:'Задача 1',tag:'tagA',lvl:'for + if',
   make:()=>({A:R(100,999),B:R(3000,9999),K:pick([3,7,9,11,13])}),
   show:p=>`A = ${p.A}, B = ${p.B}, K = ${p.K}`,
   solve:p=>{let s=0;for(let i=p.A;i<=p.B;i++)if(i%p.K===0&&i%2!==0)s+=i;return s;}},
 '2':{name:'Задача 2',tag:'tagB',lvl:'while + if/else',
   make:()=>({N:R(30,999)}),
   show:p=>`N = ${p.N}`,
   solve:p=>{let n=p.N,k=0;while(n!==1){n=n%2===0?n/2:3*n+1;k++;}return k;}},
 '3':{name:'Задача 3',tag:'tagC',lvl:'for + while',
   make:()=>({A:R(100,999),B:R(3000,9999),S:R(10,25)}),
   show:p=>`A = ${p.A}, B = ${p.B}, S = ${p.S}`,
   solve:p=>{let k=0;for(let i=p.A;i<=p.B;i++)if(digsum(i)===p.S)k++;return k;}},
 'S':{name:'Задача ★',tag:'tagS',lvl:'факториал',
   make:()=>({N:R(20,40)}),
   show:p=>`N = ${p.N}`,
   solve:p=>{let f=1n;for(let i=2n;i<=BigInt(p.N);i++)f*=i;return String(f).split('').reduce((a,c)=>a+ +c,0);}}
};

async function sendResults(msgId,manual){
  const el=()=>document.getElementById(msgId);const say=t=>{const e=el();if(e)e.innerHTML=t;};
  if(!SHEET_URL){if(manual)say('Отправка не настроена — сохрани файл .txt.');else say('Не забудь сохранить результаты в файл .txt.');return;}

<div class="two"><div>${C(L('x = 5','y = 3','x = 1','d = x + y','print(d)'))}${OUTB('4')}</div><div><p>При новом присваивании старое значение <b>стирается</b>: после третьей строки x = 1, поэтому d = 1 + 3 = 4.</p><p>У каждой переменной своя «ячейка» памяти: после <code>b = a</code> в b лежит <b>копия</b> значения a, и последующее изменение a на b не влияет.</p><p>Неверно: <code>9 = x</code>, <code>2 * b = c</code> — слева может стоять только имя переменной.</p></div></div>
<h3>Имена переменных</h3>
<p>Можно: латинские буквы (большие и маленькие различаются: <code>Sum</code> и <code>sum</code> — разные переменные), цифры, знак <code>_</code>. Нельзя: начинать с цифры (<code>3n</code>), пробелы (<code>n 3</code>), знаки <code>- + / * ( )</code>, служебные слова (<code>if</code>, <code>for</code>, <code>while</code>…).</p>
<h3>Типы данных</h3>
<table><tr><th>Тип</th><th>Название</th><th>Примеры</th></tr>
<tr><td><code>int</code></td><td>целое число</td><td><code>25</code>, <code>-14</code>, <code>7 // 2</code></td></tr>
<tr><td><code>float</code></td><td>вещественное число</td><td><code>2.5</code>, <code>25.0</code>, <code>8 / 2</code> → <code>4.0</code></td></tr>
<tr><td><code>str</code></td><td>строка</td><td><code>'Привет'</code>, <code>'25'</code>, <code>'True'</code></td></tr>
<tr><td><code>bool</code></td><td>логический</td><td><code>True</code>, <code>False</code>, <code>3 &gt; 2</code></td></tr></table>
<p>Тип можно узнать функцией <code>type()</code>: <code>print(type(21))</code> → <code>&lt;class 'int'&gt;</code>.</p>
<p><b>Преобразование типов:</b> <code>int('7')</code> → 7; <code>str(7)</code> → '7'; <code>float(3)</code> → 3.0; <code>int(7.9)</code> → 7 (дробная часть отбрасывается, а не округляется).</p>
<h3>Арифметические операции и приоритет</h3>
<table><tr><th>Приоритет</th><th>Операция</th><th>Пример</th></tr>
<tr><td>1 (скобки — ещё раньше)</td><td><code>**</code> степень</td><td><code>2 ** 3</code> → 8</td></tr>
<tr><td>2</td><td><code>*</code> умножение, <code>/</code> деление, <code>//</code> целая часть, <code>%</code> остаток</td><td><code>17 / 5</code> → 3.4; <code>17 // 5</code> → 3; <code>17 % 5</code> → 2</td></tr>
<tr><td>3</td><td><code>+</code> сложение, <code>-</code> вычитание</td><td><code>2 + 3 * 4</code> → 14</td></tr></table>
<p>Действия одного приоритета выполняются слева направо.</p>
<h3>Запись математических выражений</h3>
<p>Выражение пишется <b>в одну строку</b>, знак умножения <code>*</code> не пропускают, степень — <code>**</code>.</p>
<table><tr><th>В математике</th><th>В Python</th><th>Ошибка</th></tr>
<tr><td><span class="math">${FR('a + b','c − d')}</span></td><td><code>(a + b) / (c - d)</code></td><td><code>a + b / c - d</code> — делится только b на c</td></tr>
<tr><td><span class="math">3x²</span></td><td><code>3 * x ** 2</code></td><td><code>3x ** 2</code>, <code>3 * x ^ 2</code></td></tr>
<tr><td><span class="math">(x + y)²</span></td><td><code>(x + y) ** 2</code></td><td><code>x + y ** 2</code> — в квадрат только y</td></tr>
<tr><td><span class="math">2(a + b)</span></td><td><code>2 * (a + b)</code></td><td><code>2(a + b)</code></td></tr>
<tr><td><span class="math">${FR('1','x · y')}</span></td><td><code>1 / (x * y)</code></td><td><code>1 / x * y</code> — это (1/x)·y</td></tr></table>
<h3>Стандартные функции</h3>
<table><tr><th>Функция</th><th>Что делает</th><th>Пример</th></tr>
<tr><td><code>int(x)</code></td><td>отбрасывает дробную часть</td><td><code>int(7.9)</code> → 7</td></tr>
<tr><td><code>round(x)</code></td><td>округляет до целого</td><td><code>round(7.6)</code> → 8</td></tr>
<tr><td><code>round(x, n)</code></td><td>оставляет n знаков после точки</td><td><code>round(3.456, 2)</code> → 3.46</td></tr>
<tr><td><code>abs(x)</code></td><td>модуль числа (всегда ≥ 0)</td><td><code>abs(-15)</code> → 15</td></tr></table>
<p class="cap">Особый случай: если дробная часть ровно .5, Python округляет к <b>чётному</b>: <code>round(2.5)</code> → 2, <code>round(3.5)</code> → 4.</p>
<div class="box rule"><b>Операция / всегда даёт float:</b> <code>8 / 2</code> → <code>4.0</code>. Целый результат даёт <code>8 // 2</code> → <code>4</code>.</div>
<div class="box link"><b>Цифры числа</b> (пригодится в задаче и в рекурсии!)<br><code>n % 10</code> — последняя цифра: 472 % 10 = 2<br><code>n // 10</code> — число без последней цифры: 472 // 10 = 47<br><code>n // 100</code> — первая цифра трёхзначного числа: 472 // 100 = 4</div>
<h3>Сокращённая запись и множественное присваивание</h3>
<table><tr><th>Сокращённо</th><th>Полностью</th></tr><tr><td><code>s += k</code></td><td><code>s = s + k</code></td></tr><tr><td><code>p *= t</code></td><td><code>p = p * t</code></td></tr><tr><td><code>n //= 10</code></td><td><code>n = n // 10</code></td></tr><tr><td><code>z %= y</code></td><td><code>z = z % y</code></td></tr></table>
<p><code>a, b = 19, 25</code> — то же, что <code>a = 19</code> и <code>b = 25</code>. <code>a = b = 5</code> — обе переменные получают 5. <code>a, b = b, a</code> — обмен значений.</p>
<details class="try"><summary>Проверь себя: чему равно d?</summary>${C(L('a = 3','b = 6','c = 5','b = 12','d = b / 2 + c * a'))}<p>b = 12 (перезаписана), d = 12 / 2 + 5·3 = 6.0 + 15 = <b>21.0</b> — тип float, потому что есть деление <code>/</code>.</p></details>
`,
cond:`
<h3>Условный оператор if</h3>
<p>Позволяет программе выбирать, какие действия выполнять, в зависимости от условия.</p>
<div class="two"><div><b>Неполная форма</b>${C(L('if условие:','    действия'))}<p class="cap">Действия выполняются, только если условие True.</p></div>
<div><b>Полная форма</b>${C(L('if условие:','    действия 1','else:','    действия 2'))}<p class="cap">Если условие True — действия 1, иначе (False) — действия 2.</p></div></div>
<div class="box rule">После условия и после <code>else</code> — <b>двоеточие</b>. Действия внутри — с <b>отступом в 4 пробела</b>. Отступ — часть кода: по нему Python понимает, какие команды входят в ветку.</div>
<h3>Операторы сравнения</h3>
<table><tr><td><code>==</code> равно</td><td><code>!=</code> не равно</td><td><code>&gt;</code> больше</td></tr><tr><td><code>&lt;</code> меньше</td><td><code>&gt;=</code> больше или равно</td><td><code>&lt;=</code> меньше или равно</td></tr></table>
<p>Не путай: <code>=</code> — присваивание, <code>==</code> — сравнение.</p>
<h3>Выбор из нескольких вариантов: if – elif – else</h3>
<div class="two"><div>${C(L("t = int(input('Температура: '))",'if t <= 0:',"    print('Вода замёрзла')",'elif t < 100:',"    print('Вода нагревается')",'else:',"    print('Вода закипела')"))}</div>
<div><p>Условия проверяются <b>по порядку сверху вниз</b>. Выполняется <b>только первая</b> ветка, условие которой True, остальные уже не проверяются. Если все условия False — выполняется <code>else</code>.</p><p>При t = 50: 50 &lt;= 0 — False, 50 &lt; 100 — True → «Вода нагревается».</p></div></div>
<h3>Составные условия: and, or, not</h3>
<table><tr><th>Операция</th><th>Смысл</th><th>Когда True</th><th>Пример</th></tr>
<tr><td><code>and</code></td><td>«и»<br>(логическое умножение)</td><td>оба условия True</td><td><code>1 &lt; 5 and 1 &gt; 0</code> → True</td></tr>
<tr><td><code>or</code></td><td>«или»<br>(логическое сложение)</td><td>хотя бы одно True</td><td><code>3 &gt; 2 or 3 &lt; 1</code> → True</td></tr>
<tr><td><code>not</code></td><td>«не»<br>(отрицание)</td><td>меняет на противоположное</td><td><code>not (5 &gt; 6)</code> → True</td></tr></table>
<p><b>Как вычислить составное условие:</b> замени True на 1, False на 0. <b>and</b> — умножение: результат 1, только если оба равны 1. <b>or</b> — сложение: результат 0, только если оба равны 0.</p>
<table><tr><th>Выражение</th><th>Значения</th><th>1 и 0</th><th>Итог</th></tr>
<tr><td><code>7 &gt; 8 and 4 != 3</code></td><td>False and True</td><td>0 · 1 = 0</td><td>False</td></tr>
<tr><td><code>3 &gt; 2 or 3 &lt; 1</code></td><td>True or False</td><td>1 + 0 = 1</td><td>True</td></tr>
<tr><td><code>not (9 &gt; 8)</code></td><td>not True</td><td>—</td><td>False</td></tr></table>
<p>В Python можно писать двойное неравенство: <code>10 &lt;= x &lt;= 50</code> — то же, что <code>x &gt;= 10 and x &lt;= 50</code>.</p>
<p><b>Полезные условия:</b> чётное — <code>x % 2 == 0</code>; оканчивается на 5 — <code>x % 10 == 5</code>; делится на 3 — <code>x % 3 == 0</code>; двузначное — <code>10 &lt;= x &lt;= 99</code>.</p>
<h3>Вложенное условие</h3>
<div class="two"><div>${C(L('if a > b:',"    print('a больше')",'else:','    if a == b:',"        print('равны')",'    else:',"        print('b больше')"))}</div><div><p>Внутри ветки можно записать ещё один if — со своим, <b>двойным</b> отступом (8 пробелов). Вложенное условие проверяется, только если выполнение дошло до его ветки.</p><p>Тот же результат короче: <code>if … elif … else</code>.</p></div></div>
<div class="box warn"><b>Частые ошибки</b><br>• Нет двоеточия: <code>if x &gt; 0</code><br>• Одно «равно» в условии: <code>if x = 0:</code><br>• Условие после else: <code>else x &lt; 0:</code> — после else условие не пишут.<br>• Нет отступа у действий внутри ветки.</div>
<details class="try"><summary>Проверь себя: время года по номеру месяца</summary>${C(L("m = int(input('Номер месяца: '))",'if m == 1 or m == 2 or m == 12:',"    print('Зима')",'elif 3 <= m <= 5:',"    print('Весна')",'elif 6 <= m <= 8:',"    print('Лето')",'elif 9 <= m <= 11:',"    print('Осень')",'else:',"    print('Некорректное значение')"))}<p>Что выведет программа при m = 12? при m = 13? <i>Ответ: Зима; Некорректное значение.</i></p></details>
`,
for:`
<h3>Цикл for</h3>
<p><b>Цикл</b> — алгоритм, в котором одно или несколько действий (<b>тело цикла</b>) повторяются несколько раз. Цикл <code>for</code> используют, когда <b>известно</b>, сколько раз повторять, — вместе с функцией <code>range()</code>.</p>
${C(L('for i in range(n, k, m):','    тело цикла  # 4 пробела!'))}
<p>Переменная цикла i принимает значения от n до k−1 с шагом m. <b>Конечное значение k не включается!</b></p>
<table><tr><th>Вызов</th><th>Значения i</th></tr>
<tr><td><code>range(5)</code></td><td>0, 1, 2, 3, 4 — один параметр: от 0, повторов 5</td></tr>
<tr><td><code>range(1, 10)</code></td><td>1, 2, …, 9</td></tr>
<tr><td><code>range(2, 15, 3)</code></td><td>2, 5, 8, 11, 14</td></tr>
<tr><td><code>range(9, 2, -1)</code></td><td>9, 8, 7, 6, 5, 4, 3 — отрицательный шаг: считаем вниз</td></tr>
<tr><td><code>range(7, 3)</code></td><td>пусто — тело не выполнится ни разу</td></tr>
<tr><td><code>range(3, 10, -2)</code></td><td>пусто</td></tr></table>
<p><b>Как подобрать range по ряду чисел:</b> начало — первое число, шаг — разность соседних, конец — <b>больше</b> последнего числа (последнее + 1). Ряд 3, 6, 9, 12 → <code>range(3, 13, 3)</code>. Для убывающего ряда шаг отрицательный, а конец <b>меньше</b> последнего: 10, 8, 6 → <code>range(10, 5, -2)</code>.</p>
<h3>Что в цикле, а что после него</h3>
<div class="two"><div>${C(L('for i in range(5, 51, 5):','    print(i)',"    print('-----')"))}<p class="cap">Черта печатается после <b>каждого</b> числа.</p></div><div>${C(L('for i in range(5, 51, 5):','    print(i)',"print('-----')"))}<p class="cap">Черта — без отступа, напечатается <b>один раз</b> после цикла.</p></div></div>
<h3>Накопление суммы, счётчик, произведение</h3>
<div class="two"><div>${C(L('s = 0','for i in range(1, 11):','    s = s + i','print(s)'))}${OUTB('55')}</div><div><p><b>Сумма:</b> до цикла <code>s = 0</code>, в цикле <code>s += …</code>.<br><b>Счётчик:</b> до цикла <code>k = 0</code>, в цикле <code>k += 1</code> (часто внутри if).<br><b>Произведение:</b> до цикла <code>f = 1</code> (не 0!), в цикле <code>f *= …</code>.</p></div></div>
<div class="box rule"><b>Факториал</b> числа n (обозначается <b>n!</b>, читается «эн факториал») — произведение всех натуральных чисел от 1 до n: 5! = 1·2·3·4·5 = 120. Считается циклом for: до цикла <code>f = 1</code>, в цикле <code>f *= i</code> для i от 1 до n. Скоро мы научимся вычислять факториал ещё и <b>рекурсией</b>.</div>
<h3>Трассировка</h3>
<p>Чтобы найти результат, выполни программу «на бумаге» — запиши, как меняются переменные на каждом шаге.</p>
<div class="two"><div>${C(L('a = 0','for i in range(5, 8):','    a += i','print(a)'))}</div><div><table><tr><th>i</th><th>a + i</th><th>a</th></tr><tr><td>—</td><td>—</td><td>0</td></tr><tr><td>5</td><td>0 + 5</td><td>5</td></tr><tr><td>6</td><td>5 + 6</td><td>11</td></tr><tr><td>7</td><td>11 + 7</td><td>18</td></tr></table><p>Ответ: 18.</p></div></div>
<div class="box link">🔗 Трассировка нам очень понадобится в теме «Рекурсия»: там мы будем так же по шагам следить, как вызывается функция.</div>
<p><b>Управление циклом:</b> <code>continue</code> — пропустить остаток тела и перейти к следующему повторению; <code>break</code> — досрочно выйти из цикла.</p>
<details class="try"><summary>Проверь себя: что выведет программа?</summary>${C(L('for i in range(3, -1, -1):',"    print(i, end='')"))}${OUTB('3210')}<p>Шаг −1: i = 3, 2, 1, 0 (−1 не включается). <code>end=''</code> — без пробелов и переходов.</p></details>
`,
while:`
<h3>Цикл while</h3>
<p><code>while</code> — «пока». Цикл с <b>предусловием</b>: тело повторяется, <b>пока условие истинно</b>. Используется, когда количество повторений <b>заранее неизвестно</b>.</p>
<div class="two"><div>${C(L('n = 1           # начальное значение','while n < 4:    # условие','    print(n)','    n += 1      # изменение!'))}${OUTB('1\n2\n3')}</div>
<div><p>Перед каждым повторением проверяется условие. Когда оно станет False, цикл закончится.</p><div class="box warn" style="margin:0">Переменная в условии должна <b>изменяться</b> в теле цикла, иначе цикл станет <b>бесконечным</b>.</div></div></div>
<h3>for и while</h3>
<p>Любой цикл for можно переписать через while. В while три обязательные части: ① начальное значение <b>до цикла</b>; ② условие продолжения; ③ изменение переменной <b>в теле</b> цикла.</p>
<table><tr><th>for</th><th>while</th></tr><tr><td>Знаем, сколько раз повторять</td><td>Повторяем, пока выполняется условие</td></tr>
<tr><td>${C(L('for i in range(1, 5):','    print(i)'))}</td><td>${C(L('i = 1','while i <= 4:','    print(i)','    i += 1'))}</td></tr></table>
<h3>Пример: сумма чисел от 1 до n</h3>
<div class="two"><div>${C(L("n = int(input('Введите число '))",'s = 0','i = 1','while i <= n:','    s += i','    i += 1',"print('Сумма =', s)"))}</div><div><p>При n = 4:</p><table><tr><th>i</th><th>i &lt;= 4?</th><th>s</th></tr><tr><td>1</td><td>да</td><td>1</td></tr><tr><td>2</td><td>да</td><td>3</td></tr><tr><td>3</td><td>да</td><td>6</td></tr><tr><td>4</td><td>да</td><td>10</td></tr><tr><td>5</td><td>нет — выход</td><td>10</td></tr></table></div></div>
<h3>Пример: сумма цифр числа</h3>
<div class="two"><div>${C(L('n = 472','s = 0','while n > 0:','    s += n % 10   # последняя цифра','    n //= 10      # отбросить её','print(s)'))}${OUTB('13')}</div><div><table><tr><th>n</th><th>n % 10</th><th>s</th></tr><tr><td>472</td><td>2</td><td>2</td></tr><tr><td>47</td><td>7</td><td>9</td></tr><tr><td>4</td><td>4</td><td>13</td></tr><tr><td>0</td><td colspan="2">условие False — выход</td></tr></table><p class="cap">Сколько цифр в числе — заранее неизвестно, поэтому здесь нужен while.</p></div></div>
<h3>break и continue</h3>
<p><code>break</code> — немедленно прекратить цикл. <code>continue</code> — сразу перейти к следующей проверке условия. Цикл <code>while True:</code> бесконечен сам по себе — выйти из него можно только через <code>break</code>.</p>
${C(L('s = 0','while True:',"    x = int(input('Число: '))",'    if x == 0:','        break','    s += x',"print('Сумма:', s)"))}
<p class="cap">Программа суммирует числа, пока пользователь не введёт 0.</p>
<details class="try"><summary>Проверь себя: сколько раз будет выведено «Привет!»?</summary>${C(L('i = 3','while i < 6:',"    print('Привет!')",'    i += 1'))}<p>i = 3, 4, 5 — условие True; при i = 6 — False. Ответ: <b>3 раза</b>.</p></details>
`
};
