<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пользовательские процедуры и функции — учебник-тренажёр</title>
<style>
:root{
  --teal:#129a86; --teal-d:#007b73; --turq:#33dcc4; --turq-l:#dcf7f2;
  --lav:#dcc2ef; --lav-l:#f4ecfa; --lav-m:#d9cae1; --cream:#fefad4; --gray:#e1e1e3; --sage:#a5bbb9;
  --text:#24423f; --muted:#5d7774; --amber:#e9a23b; --amber-l:#fff3df; --code-bg:#fafafb;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Times New Roman",Times,serif;font-size:21px;color:var(--text);background:#ffffff;line-height:1.45}
code,pre,.mono,input.mono,textarea.mono{font-family:"JetBrains Mono",Consolas,"Courier New",monospace}
header{background:var(--cream);border-bottom:5px solid var(--turq);padding:14px 22px;display:flex;flex-wrap:wrap;align-items:center;gap:14px;justify-content:space-between}
header h1{margin:0;font-size:30px;color:var(--teal-d)}
header .sub{color:var(--muted);font-size:18px}
.modes{display:flex;border:2px solid var(--teal);border-radius:12px;overflow:hidden;background:#fff}
.modes button{border:0;background:#fff;color:var(--teal-d);font:inherit;font-weight:bold;padding:8px 18px;cursor:pointer}
.modes button.on{background:var(--teal);color:#fff}
nav{display:flex;flex-wrap:wrap;gap:6px;padding:10px 22px;background:#fff;border-bottom:2px solid var(--gray);position:sticky;top:0;z-index:5}
nav button{font:inherit;font-size:19px;border:2px solid var(--sage);background:#fff;color:var(--text);border-radius:10px;padding:5px 13px;cursor:pointer}
nav button:hover{background:var(--turq-l)}
nav button.on{border-color:var(--teal);background:var(--teal);color:#fff}
nav .cnt{display:inline-block;font-size:15px;background:var(--lav);color:#3c2a50;border-radius:8px;padding:0 7px;margin-left:4px}
nav button.on .cnt{background:#fff;color:var(--teal-d)}
main{max-width:1100px;margin:0 auto;padding:18px 18px 60px}
.card{background:#fff;border:2px solid var(--gray);border-radius:16px;padding:18px 22px;margin-bottom:16px;box-shadow:0 2px 0 var(--lav-m)}
.student{display:flex;flex-wrap:wrap;gap:14px;align-items:center;background:var(--lav-l);border:2px solid var(--lav);border-radius:12px;padding:10px 16px;margin-bottom:14px}
.student input,.student select{font:inherit;padding:5px 10px;border:2px solid var(--sage);border-radius:8px;background:#fff}
.student input{width:280px}
.modelab{color:var(--muted)}
h2{color:var(--teal-d);margin:4px 0 8px;font-size:27px}
h3{color:var(--teal-d);margin:18px 0 8px;font-size:23px}
.descr{color:var(--muted);margin-bottom:8px}
pre.code{background:var(--code-bg);border:2px solid var(--gray);border-left:6px solid var(--turq);border-radius:10px;padding:12px 16px;font-size:20px;line-height:1.55;overflow-x:auto;margin:10px 0}
.kw{color:#e07b00;font-weight:bold}.bi{color:#8a4fc0}.fn{color:#0b7d8f;font-weight:bold}.st{color:#1d9a50}.nu{color:#c0507a}.cm{color:#8a9aab;font-style:italic}
.out{background:var(--turq-l);border:2px dashed var(--teal);border-radius:10px;padding:8px 14px;font-size:20px;white-space:pre;margin:8px 0;overflow-x:auto}
.note{background:var(--lav-l);border-left:6px solid var(--lav);border-radius:8px;padding:10px 14px;margin:10px 0}
.warn{background:var(--cream);border-left:6px solid var(--sage);border-radius:8px;padding:10px 14px;margin:10px 0}
table.cmp{border-collapse:collapse;width:100%;margin:10px 0;table-layout:fixed}
table.cmp td,table.cmp th{border:2px solid var(--gray);padding:8px 10px;vertical-align:top}
table.cmp th{background:var(--turq-l);color:var(--teal-d)}
table.err td.mono{font-size:17px;white-space:pre-wrap}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{font:inherit;font-weight:bold;border:0;border-radius:10px;padding:9px 20px;cursor:pointer;background:var(--teal);color:#fff}
.btn:hover{background:var(--teal-d)}
.btn.sec{background:#fff;color:var(--teal-d);border:2px solid var(--teal)}
.btn.sec:hover{background:var(--turq-l)}
.btn.lav{background:var(--lav);color:#3c2a50}
.btn:disabled{opacity:.4;cursor:default}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.pill{font:inherit;font-weight:bold;min-width:46px;height:42px;border:2px solid var(--sage);border-radius:10px;background:#fff;color:var(--text);cursor:pointer}
.pill:hover{background:var(--turq-l)}
.pill.cur{outline:3px solid var(--turq);outline-offset:1px;border-color:var(--teal)}
.pill.ok{background:var(--teal);border-color:var(--teal);color:#fff}
.pill.no{background:var(--amber-l);border-color:var(--amber)}
.pill.done{background:var(--lav);border-color:var(--lav)}
.pillgroups{display:flex;flex-wrap:wrap;gap:6px 22px;margin:6px 0 4px}
.pgname{font-size:17px;color:var(--muted);font-weight:bold}
.pg .pills{margin:2px 0 6px}
.taskbox{border-top:2px solid var(--gray);padding-top:10px}
.opts{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.opt{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--gray);border-radius:10px;padding:8px 12px;cursor:pointer;background:#fff}
.opt:hover{border-color:var(--turq)}
.opt.sel{border-color:var(--teal);background:var(--turq-l)}
.opt.good{border-color:var(--teal);background:var(--turq-l);box-shadow:inset 6px 0 0 var(--teal)}
.opt.wrong{border-color:var(--amber);background:var(--amber-l)}
.q{font-size:22px;font-weight:bold;margin:6px 0}
.fb{border-radius:10px;padding:10px 14px;margin:10px 0}
.fb.ok{background:var(--turq-l);border:2px solid var(--teal)}
.fb.no{background:var(--amber-l);border:2px solid var(--amber)}
.fb.neutral{background:var(--lav-l);border:2px solid var(--lav)}
textarea.ans{width:100%;min-height:110px;font-size:20px;padding:8px 12px;border:2px solid var(--sage);border-radius:10px}
input.blank{font-size:19px;width:7.5em;padding:1px 6px;border:2px solid var(--teal);border-radius:6px;background:var(--cream);color:var(--text)}
input.blank.good{border-color:var(--teal);background:var(--turq-l)}
input.blank.wrong{border-color:var(--amber);background:var(--amber-l)}
.lines{background:var(--code-bg);border:2px solid var(--gray);border-radius:10px;padding:8px 0;font-size:20px;margin:10px 0;overflow-x:auto}
.ln{display:flex;cursor:pointer;padding:1px 12px;white-space:pre}
.ln:hover{background:var(--turq-l)}
.ln .no{color:#8aa0a0;width:2.4em;flex:none;user-select:none}
.ln.sel{background:var(--lav-l);outline:2px solid var(--lav)}
.ln.good{background:var(--turq-l);outline:2px solid var(--teal)}
.ln.wrong{background:var(--amber-l);outline:2px solid var(--amber)}
.stat{display:flex;flex-wrap:wrap;gap:6px 20px;margin:6px 0;font-size:19px;color:var(--muted)}
.stat b{color:var(--text)}
.grade{font-size:46px;font-weight:bold;color:var(--teal-d)}
.inp{background:var(--cream);border:2px solid #e8dc8a;border-radius:10px;padding:8px 14px;font-size:20px;white-space:pre;display:inline-block;min-width:160px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grouptag{display:inline-block;background:var(--lav);color:#3c2a50;border-radius:8px;padding:1px 10px;font-size:17px;font-weight:bold}
h3.tt{margin-top:6px}
.sampleHead{margin:12px 0 4px;font-weight:bold;color:var(--teal-d)}
.tag{display:inline-block;background:var(--turq);border-radius:6px;padding:0 8px;font-size:17px;font-weight:bold;color:#0b3d38;margin-right:8px}
.tag.tag2{background:var(--lav);color:#3c2a50}
.toc{display:flex;flex-wrap:wrap;gap:4px 18px}
.toc b{width:100%}
.toc a{color:var(--teal-d);text-decoration:none}
.toc a:hover{text-decoration:underline}
.hidden{display:none}
@media(max-width:800px){.two{grid-template-columns:1fr}body{font-size:19px}pre.code{font-size:16px}.student input{width:100%}table.err td.mono{font-size:14px}}
.summary{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;margin-bottom:14px}
.sumbox{border:2px solid var(--gray);border-radius:12px;padding:10px 14px;background:#fff}
.sumbox.act{border-color:var(--teal);background:var(--turq-l)}
.sumt{font-weight:bold;color:var(--teal-d)}
.sg small{font-size:15px;font-weight:normal;opacity:.9}
.sg{display:inline-block;min-width:44px;text-align:center;font-size:26px;font-weight:bold;color:#fff;background:var(--teal);border-radius:10px;padding:0 8px;vertical-align:middle}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.chip{font-size:16px;background:var(--lav-l);border:1px solid var(--lav);border-radius:8px;padding:0 8px}
.chip.full{background:var(--teal);border-color:var(--teal);color:#fff}
.sumhint{font-size:16px;color:var(--muted)}
@media(max-width:800px){.summary{grid-template-columns:1fr}}
.sendbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;border:2px dashed var(--sage);border-radius:12px;padding:6px 12px;margin:0 0 14px;background:#fff}
.sendbar .btn{margin:0}
.send{font-weight:bold}
.send.ok{color:var(--teal-d)}
.send.no{color:#b06a00}
.send.wait{color:var(--muted)}
.editor{width:100%;min-height:260px;font-size:19px;line-height:1.5;padding:10px 12px;border:2px solid var(--teal);border-radius:10px;background:var(--code-bg);color:var(--text);tab-size:4;white-space:pre;overflow:auto}
.editor:disabled{opacity:.85}
.edhead{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between;margin:12px 0 4px}
.inp.small{padding:1px 8px;font-size:18px;min-width:0}
.runrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:6px 0}
.runrow .btn{margin:0}
.pystat{font-size:17px}
.pystat.ok{color:var(--teal-d)}.pystat.no{color:#b06a00;font-weight:bold}.pystat.wait{color:var(--muted)}
.errbox{background:var(--amber-l);border:2px solid var(--amber);border-radius:10px;padding:6px 12px;margin:6px 0;white-space:pre-wrap;font-size:18px}
b.idf{font-family:"JetBrains Mono",Consolas,"Courier New",monospace;font-size:.95em;color:var(--teal-d)}
</style>
</head>
<body>
<header>
  <div>
    <h1>Пользовательские процедуры и функции</h1>
    <div class="sub">Учебник-тренажёр · Python</div>
  </div>
  <div class="modes" id="modes">
    <button data-m="learn" class="on">Обучение</button>
    <button data-m="test">Контроль</button>
  </div>
</header>
<nav id="nav"></nav>
<main id="main"></main>

<script>
/* ===================== ВСПОМОГАТЕЛЬНОЕ ===================== */
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const pyNum=x=>{ if(Number.isInteger(x)) return String(x); let s=String(x); return s; };
const pyFloat=x=>Number.isInteger(x)? x.toFixed(1) : String(x);

const KW=new Set(['def','return','for','in','if','else','elif','while','global','import','and','or','not','True','False','None','break','continue']);
const BI=new Set(['print','input','int','float','str','range','len','abs','max','min','sum','round','bin']);
function hlSeg(code,fns){
  const re=/('[^'\n]*'?|"[^"\n]*"?)|(#.*)|(\b\d+(?:\.\d+)?\b)|([A-Za-zА-Яа-яЁё_]\w*)|([\s\S])/g;
  let out='',m,prevDef=false;
  while((m=re.exec(code))){
    if(m[1]) out+='<span class="st">'+esc(m[1])+'</span>';
    else if(m[2]) out+='<span class="cm">'+esc(m[2])+'</span>';
    else if(m[3]) out+='<span class="nu">'+m[3]+'</span>';
    else if(m[4]){
      const w=m[4];
      if(KW.has(w)) out+='<span class="kw">'+w+'</span>';
      else if(prevDef||fns.has(w)) out+='<span class="fn">'+esc(w)+'</span>';
      else if(BI.has(w)) out+='<span class="bi">'+w+'</span>';
      else out+=esc(w);
      prevDef=(w==='def'); continue;
    } else out+=esc(m[5]);
    if(m[5]&&!/\s/.test(m[5])) prevDef=false;
  }
  return out;
}
const fnNames=code=>new Set([...code.matchAll(/def\s+(\w+)/g)].map(x=>x[1]));
const hl=code=>hlSeg(code,fnNames(code));
const pre=code=>'<pre class="code">'+hl(code)+'</pre>';

function normLine(s){return s.replace(/\u00a0/g,' ').trim().replace(/\s+/g,' ').toLowerCase().replace(/ё/g,'е')}
function normLines(s){let a=String(s).split('\n').map(normLine);while(a.length&&a[a.length-1]==='')a.pop();while(a.length&&a[0]==='')a.shift();return a}
function sameOutput(user,expected){
  const u=normLines(user), e=normLines(expected);
  if(u.length!==e.length) return false;
  for(let i=0;i<e.length;i++){
    if(u[i]===e[i]) continue;
    const un=u[i].replace(',','.'), en=e[i];
    if(un!==''&&!isNaN(un)&&en!==''&&!isNaN(en)&&Math.abs(parseFloat(un)-parseFloat(en))<1e-6) continue;
    return false;
  }
  return true;
}

/* ===================== ГЕНЕРАТОРЫ ===================== */
const FN=['calc','summa','mix','f','count','work','get_sum','compute','magic','solve'];
const PAR=[['a','b'],['x','y'],['m','n'],['p','q'],['k','t']];

/* ---------- Модуль 1. Строение ---------- */
const DEF_Q=[
  {q:'Функция — это…',c:'Подпрограмма, которая принимает данные, выполняет с ними действия и возвращает результат',w:['Подпрограмма, которая выполняет действия, но ничего не возвращает','Переменная, в которой хранятся вычисленные данные','Основная программа, которая управляет всеми действиями в коде'],e:'Функция обязательно возвращает результат с помощью return.'},
  {q:'Процедура — это…',c:'Подпрограмма, которая выполняет действия (например, выводит на экран), но не возвращает результат',w:['Подпрограмма, которая обязательно возвращает результат','Встроенная команда Python, например print','Основная часть программы после описания функций'],e:'В процедуре нет return: она что-то делает, но значение в программу не возвращает.'},
  {q:'Параметр — это…',c:'Переменная в заголовке подпрограммы, от значения которой зависит её работа',w:['Значение, которое передаётся подпрограмме при вызове','Имя подпрограммы','Результат, который возвращает функция'],e:'Параметры записываются в скобках после имени в строке def.'},
  {q:'Аргумент — это…',c:'Значение, которое передаётся подпрограмме при её вызове',w:['Переменная в заголовке подпрограммы','Ключевое слово для создания функции','Результат работы функции'],e:'Аргументы записываются в скобках при вызове: f(3, 5) — 3 и 5 аргументы.'},
  {q:'С помощью какого ключевого слова создают (описывают) функцию?',c:'def',w:['function','return','import'],e:'Описание подпрограммы начинается со слова def.'},
  {q:'С помощью какого ключевого слова функция возвращает значение в основную программу?',c:'return',w:['print','break','continue'],e:'return передаёт значение в место вызова.'},
  {q:'Сколько параметров может быть у подпрограммы?',c:'Любое количество, в том числе ни одного',w:['Только один','Не больше двух','Хотя бы один обязательно'],e:'Бывают подпрограммы без параметров: def hello():'},
  {q:'Что вернёт подпрограмма, в которой нет return?',c:'None (ничего)',w:['0','Пустую строку','Последнее выведенное значение'],e:'Если return нет, Python возвращает специальное значение None.'},
  {q:'Где в программе должна быть описана функция?',c:'До её первого вызова',w:['В любом месте, даже после вызова','Только в самом конце программы','Только внутри print()'],e:'Python выполняет программу сверху вниз: при вызове функция уже должна быть описана.'},
  {q:'Чем выделяется тело функции?',c:'Отступом (4 пробела) после строки с двоеточием',w:['Фигурными скобками { }','Словом end в конце','Точкой с запятой'],e:'Всё, что записано с отступом после def …:, — тело функции.'},
  {q:'Что происходит, когда выполняется return?',c:'Функция возвращает значение и сразу завершает работу',w:['Функция выводит значение на экран','Функция возвращает значение и продолжает выполнять следующие строки','Программа полностью останавливается'],e:'Строки тела функции после return не выполняются.'},
  {q:'Чем return отличается от print?',c:'print показывает значение на экране, return передаёт его в программу',w:['Ничем, это одно и то же','return показывает значение на экране, print передаёт его в программу','print можно писать только в функции, а return — только в основной программе'],e:'Значение, выведенное print, нельзя сохранить в переменную или использовать в вычислениях.'},
];
function genStructure(kind){
  kind=kind||pick(['def','def','par','arg','type','role','calls']);
  if(kind==='def'||typeof kind==='object'){const d=typeof kind==='object'?kind:pick(DEF_Q);return {type:'mc',q:d.q,code:null,options:shuffle([d.c,...d.w]),correct:d.c,expl:d.e,brief:d.q};}
  const name=pick(FN), [p1,p2]=pick(PAR), v1=ri(2,9), v2=ri(2,9);
  const isFunc=Math.random()<.5;
  const body=isFunc?`    return ${p1} * ${p2}`:`    print(${p1} * ${p2})`;
  const call=isFunc?`print(${name}(${v1}, ${v2}))`:`${name}(${v1}, ${v2})`;
  const code=`def ${name}(${p1}, ${p2}):\n${body}\n\n${call}`;
  if(kind==='par') return {type:'mc',q:'Что в этой программе является параметрами?',code,options:shuffle([`${p1}, ${p2}`,`${v1}, ${v2}`,name,isFunc?'return':'print']),correct:`${p1}, ${p2}`,expl:`Параметры записаны в заголовке: def ${name}(${p1}, ${p2}).`,brief:'параметры'};
  if(kind==='arg') return {type:'mc',q:'Что в этой программе является аргументами?',code,options:shuffle([`${p1}, ${p2}`,`${v1}, ${v2}`,name,`${p1} * ${p2}`]),correct:`${v1}, ${v2}`,expl:`Аргументы — значения при вызове: ${name}(${v1}, ${v2}).`,brief:'аргументы'};
  if(kind==='type') return {type:'mc',q:'Это процедура или функция?',code,options:['Процедура','Функция'],correct:isFunc?'Функция':'Процедура',expl:isFunc?'Есть return — подпрограмма возвращает результат, значит, это функция.':'Нет return — подпрограмма только выводит результат, значит, это процедура.',brief:'процедура/функция'};
  if(kind==='calls'){
    const n=ri(1,4); const calls=[];const vals=[];
    for(let i=0;i<n;i++){vals.push(ri(1,9));}
    let code2=`def ${name}(${p1}):\n    return ${p1} + 10\n\n`;
    if(n===1) code2+=`print(${name}(${vals[0]}))`;
    else if(n===2) code2+=`x = ${name}(${vals[0]})\nprint(x + ${name}(${vals[1]}))`;
    else if(n===3) code2+=`print(${name}(${vals[0]}))\nprint(${name}(${vals[1]}) * 2)\ny = ${name}(${vals[2]})`;
    else code2+=`for i in range(4):\n    print(${name}(i))`;
    const ans=String(n);
    return {type:'mc',q:`Сколько раз вызывается функция ${name}?`,code:code2,options:['1','2','3','4'],correct:ans,expl:n===4?'Вызов стоит в цикле, который повторяется 4 раза.':`Считаем, сколько раз встречается ${name}(…) вне строки def.`,brief:'количество вызовов'};
  }
  // role
  const fn=pick(['convert','to_miles','double','triple','half']);
  const k=pick(['0.6214','2','3','0.5']);

/* ===================== PYTHON В БРАУЗЕРЕ (Pyodide) ===================== */
const PYODIDE_URL='https://cdn.jsdelivr.net/pyodide/v0.26.4/full/';
const PY_DRIVER=`
def __run(code, inp):
    import sys, io, builtins, traceback
    out = io.StringIO()
    old = (sys.stdout, sys.stdin, builtins.input)
    sys.stdout = out
    sys.stdin = io.StringIO(inp + '\\n')
    def _inp(prompt=''):
        l = sys.stdin.readline()
        if l == '':
            raise EOFError('программе не хватило входных данных')
        return l.rstrip('\\n')
    builtins.input = _inp
    err = ''
    try:
        exec(compile(code, 'program', 'exec'), {'__name__': '__main__'})
    except SyntaxError as e:
        err = 'Строка ' + str(e.lineno) + ': ' + type(e).__name__ + ': ' + str(e.msg)
    except BaseException as e:
        ln = None
        for fr in traceback.extract_tb(e.__traceback__):
            if fr.filename == 'program':
                ln = fr.lineno
        err = ('Строка ' + str(ln) + ': ' if ln else '') + type(e).__name__ + ': ' + str(e)
    finally:
        sys.stdout, sys.stdin, builtins.input = old
    return [out.getvalue(), err]
`;
const py={state:'off',worker:null,waiters:[],jobs:{},seq:0};
function pyWorkerCode(){
  return "importScripts("+JSON.stringify(PYODIDE_URL+'pyodide.js')+");\n"+
  "let P=null;\n"+
  "loadPyodide({indexURL:"+JSON.stringify(PYODIDE_URL)+"}).then(p=>{P=p;P.runPython("+JSON.stringify(PY_DRIVER)+");postMessage({type:'ready'})}).catch(e=>postMessage({type:'fail',msg:String(e)}));\n"+
  "onmessage=e=>{const d=e.data;try{const f=P.globals.get('__run');const r=f(d.code,d.inp);const a=r.toJs();r.destroy();f.destroy();postMessage({type:'res',id:d.id,out:a[0],err:a[1]})}catch(x){postMessage({type:'res',id:d.id,out:'',err:String(x)})}};";
}
function pyStart(){
  if(py.state==='ready') return Promise.resolve(true);
  if(py.state==='fail') return Promise.resolve(false);
  const p=new Promise(res=>py.waiters.push(res));
  if(py.state==='loading') return p;
  py.state='loading';pyStatusUpdate();
  try{
    py.worker=new Worker(URL.createObjectURL(new Blob([pyWorkerCode()],{type:'text/javascript'})));
  }catch(e){pyDone(false);return p}
  const t=setTimeout(()=>{if(py.state==='loading'){try{py.worker.terminate()}catch(e){}pyDone(false)}},90000);
  py.worker.onmessage=e=>{const d=e.data;
    if(d.type==='ready'){clearTimeout(t);pyDone(true)}
    else if(d.type==='fail'){clearTimeout(t);pyDone(false)}
    else if(d.type==='res'&&py.jobs[d.id]){py.jobs[d.id](d);delete py.jobs[d.id]}};
  py.worker.onerror=()=>{clearTimeout(t);if(py.state==='loading')pyDone(false)};
  return p;
}
function pyDone(ok){py.state=ok?'ready':'fail';py.waiters.splice(0).forEach(f=>f(ok));pyStatusUpdate()}
function runPy(code,inp){
  return new Promise(res=>{
    const id=++py.seq;
    const timer=setTimeout(()=>{ // бесконечный цикл: перезапускаем Python
      delete py.jobs[id];try{py.worker.terminate()}catch(e){}
      py.state='off';pyStart();
      res({out:'',err:'Программа работает слишком долго — возможно, бесконечный цикл.'});
    },6000);
    py.jobs[id]=d=>{clearTimeout(timer);res(d)};
    py.worker.postMessage({id,code,inp});
  });
}
function pyStatusUpdate(){
  const el=document.getElementById('pyStatus');if(!el)return;
  const man=document.getElementById('manualBox');
  if(py.state==='loading'){el.className='pystat wait';el.textContent='⏳ Загружаю Python… (в первый раз до 20–30 секунд, нужен интернет)'}
  else if(py.state==='ready'){el.className='pystat ok';el.textContent='✓ Python готов. Напиши программу, нажми «▶ Запустить», затем «Проверить».'}
  else if(py.state==='fail'){el.className='pystat no';el.textContent='Python не загрузился (нет интернета?). Запусти программу в IDLE на данных выше и впиши, что она вывела.'}
  else {el.className='pystat wait';el.textContent=''}
  if(man) man.classList.toggle('hidden',py.state!=='fail');
}
async function testProgram(t,code){ // все тесты задачи
  for(let k=0;k<t.tests.length;k++){

    if(r.err) return {ok:false,k,input:T.input,exp:T.ans,got:r.out,err:r.err};
    if(!sameOutput(r.out,T.ans)) return {ok:false,k,input:T.input,exp:T.ans,got:r.out};
  }
  return {ok:true,n:t.tests.length};
}

function editorKeys(ta){
  ta.addEventListener('keydown',e=>{
    const s=ta.selectionStart,v=ta.value;
    if(e.key==='Tab'){e.preventDefault();ta.setRangeText('    ',s,ta.selectionEnd,'end');ta.dispatchEvent(new Event('input'))}
    else if(e.key==='Enter'){
      const ls=v.lastIndexOf('\n',s-1)+1,line=v.slice(ls,s),ind=(line.match(/^ */)||[''])[0]+(/:\s*$/.test(line)?'    ':'');
      e.preventDefault();ta.setRangeText('\n'+ind,s,ta.selectionEnd,'end');ta.dispatchEvent(new Event('input'))}
  });
}

    return `<div class="stat"><span>Попытка: <b>${att}</b></span><span>Заданий: <b>${n}</b></span><span>Решено: <b>${done}</b></span><span>Верно: <b>${right}</b></span><span>${cur==='m5'?`Засчитано (лучшая попытка): <b>${hwSummary().r} из ${HW_MAX}</b>`:`Лучший результат модуля: <b>${b?b.right:0} из ${n}</b>`}</span></div>`;}
  return `<div class="stat"><span>Заданий: <b>${n}</b></span><span>Отвечено: <b>${done}</b></span></div>`;
}
function pillsHTML(s){
  const pill=(t,i)=>{const a=s.answers[i];let c='pill';if(i===s.i)c+=' cur';
    if(a) c+= mode==='learn'?(a.ok?' ok':' no'):' done';
    return `<button class="${c}" data-p="${i}" title="${esc(t.brief)}">${i+1}</button>`};
  if(cur==='m5'&&mode==='learn'){
    let i=0;return `<div class="pillgroups">`+IDLE_GROUPS.map(g=>`<div class="pg"><div class="pgname">${g[0]} · верно ${s.tasks.map((t,k)=>s.answers[k]&&s.answers[k].ok&&t.group===g[0]).filter(Boolean).length}, нужно ${HW_N}</div><div class="pills">`+g[1].map(()=>{const r=pill(s.tasks[i],i);i++;return r}).join('')+`</div></div>`).join('')+`</div>`;
  }
  return `<div class="pills">`+s.tasks.map(pill).join('')+`</div>`;
}
function buttonsHTML(s){
  const a=s.answers[s.i],n=s.tasks.length;
  let h=`<div class="btns">`;
  const t0=s.tasks[s.i],retry=(t0.type==='idle'&&mode==='learn'&&a&&!a.ok);
  h+=`<button class="btn" id="checkBtn" ${a&&!retry?'disabled':''}>${mode==='learn'?'Проверить':'Ответить'}</button>`;
  h+=`<button class="btn sec" id="prevBtn" ${s.i===0?'disabled':''}>← Предыдущее</button>`;
  h+=`<button class="btn sec" id="nextBtn" ${s.i===n-1?'disabled':''}>Следующее →</button>`;
  if(mode==='learn') h+=`<button class="btn lav" id="newSet">Новый набор заданий</button>`;
  else h+=`<button class="btn lav" id="finishBtn">Завершить контроль</button>`;
  return h+`</div>`;
}
function renderFinished(s){
  const right=s.answers.filter(x=>x&&x.ok).length,tot=s.tasks.length;
  return `<div class="fb neutral" style="text-align:center"><div>Контроль завершён</div><div class="grade">${grade(right,tot)} / 10</div><div>Верно ${right} из ${tot}</div></div>
    <h3>Разбор</h3>`+s.tasks.map((t,i)=>{const a=s.answers[i];return `<div class="fb ${a&&a.ok?'ok':'no'}"><b>${i+1}.</b> ${esc(t.brief)} — ${a?(a.ok?'верно':'неверно'):'нет ответа'}${!(a&&a.ok)?`; правильный ответ: <span class="mono">${esc(t.correct).replace(/\n/g,' ⏎ ')}</span>`:''}</div>`}).join('')+
    `<div class="btns"><button class="btn" id="againBtn">Пройти заново (новые задания)</button><button class="btn lav" id="toRes">Сохранить результаты в файл</button></div>`;
}

/* ---------- отрисовка задания ---------- */
function taskHTML(t){
  let h=`<div class="q">${t.type==='mc'?idf(t.q):esc(t.q)}</div>`;
  if(t.type==='mc'){
    if(t.code) h+=pre(t.code);
    h+=`<div class="opts">`+t.options.map((o,i)=>`<div class="opt" data-i="${i}"><span>${String.fromCharCode(1040+i)})</span><span class="${!/[А-Яа-яЁё]/.test(o)?'mono':''}">${esc(o)}</span></div>`).join('')+`</div>`;
  }
  if(t.type==='out') h+=pre(t.code)+`<textarea class="ans mono" id="ansText" placeholder="Вывод программы" spellcheck="false"></textarea>`;
  if(t.type==='fill'){
    const html=t.code.split(/(\{\{\d\}\})/).map(seg=>{const m=seg.match(/\{\{(\d)\}\}/);if(m)return `<input class="blank mono" data-b="${m[1]}" autocomplete="off" spellcheck="false">`;return hlSeg(seg,fnNames(t.code))}).join('');
    h+=`<pre class="code">${html}</pre><div>Программа должна вывести:</div><div class="out mono">${esc(t.out)}</div>`;
  }
  if(t.type==='bug') h+=`<div class="lines mono">`+t.lines.map((l,i)=>`<div class="ln" data-l="${i}"><span class="no">${i+1}</span><span>${hlSeg(l,fnNames(t.lines.join('\n')))||' '}</span></div>`).join('')+`</div>`;
  if(t.type==='idle'){
    h=`<div class="grouptag">${esc(t.group)}</div><h3 class="tt">${esc(t.title)}</h3>`;
    h+=`<div class="sampleHead"><span class="tag">Образец</span>${idf(t.sampleText)}</div>`+pre(t.sample);
    h+=`<div class="sampleHead"><span class="tag tag2">Твоя задача</span></div><div class="note">${idf(t.task)}</div>`;
    if(t.fmt) h+=`<div class="out mono">${esc(t.fmt)}</div>`;
    h+=`<div class="edhead"><b>Твоя программа:</b><span>Входные данные для запуска: <span class="inp mono small">${esc(t.input).replace(/\n/g,'  ⏎  ')}</span></span></div>
      <textarea class="editor mono" id="code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="def ...:"></textarea>
      <div class="runrow"><button class="btn sec" id="runBtn">▶ Запустить</button><span id="pyStatus" class="pystat"></span></div>
      <div id="runOut"></div>
      <div id="manualBox" class="hidden"><b>Что вывела программа в IDLE?</b><textarea class="ans mono" id="ansText" placeholder="Вывод программы" spellcheck="false"></textarea></div>`;
  }
  return h;
}
function readAnswer(t){
  if(t.type==='mc'){const s=document.querySelector('.opt.sel');return s?t.options[+s.dataset.i]:null}
  if(t.type==='out'){const v=document.getElementById('ansText').value;return v.trim()?v:null}
  if(t.type==='idle'){const c=document.getElementById('code').value;if(!c.trim())return null;
    if(py.state==='fail'){const m=document.getElementById('ansText').value;if(!m.trim())return null;return {code:c,manual:m}}
    return {code:c}}
  if(t.type==='fill'){const v=[...document.querySelectorAll('input.blank')].map(i=>i.value.trim());return v.some(x=>x==='')?null:v}
  if(t.type==='bug'){const s=document.querySelector('.ln.sel');return s?+s.dataset.l:null}
}
function check(t,a){
  if(a===null) return false;
  if(t.type==='mc') return a===t.correct;
  if(t.type==='out') return sameOutput(a,t.correct);
  if(t.type==='fill') return a.every((v,i)=>t.answers[i].some(x=>x.replace(/\s/g,'')===v.replace(/\s/g,'')));
  if(t.type==='bug') return a===t.errLine;
}
function applyAnswer(t,a){ // показать ранее данный ответ
  if(t.type==='mc') document.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',t.options[+o.dataset.i]===a));
  if(t.type==='out') document.getElementById('ansText').value=a;
  if(t.type==='idle'){document.getElementById('code').value=a.code;if(a.manual)document.getElementById('ansText').value=a.manual}
  if(t.type==='fill') document.querySelectorAll('input.blank').forEach((inp,i)=>inp.value=a[+inp.dataset.b]);
  if(t.type==='bug') document.querySelectorAll('.ln').forEach(l=>l.classList.toggle('sel',+l.dataset.l===a));
}
function lockTask(){
  document.querySelector('.taskbox').classList.add('done');
  document.querySelectorAll('#ansText,input.blank,#code').forEach(x=>x.disabled=true);
}
function showCheck(t,a){
  if(t.type==='mc') document.querySelectorAll('.opt').forEach(o=>{const v=t.options[+o.dataset.i];if(v===t.correct)o.classList.add('good');else if(v===a)o.classList.add('wrong')});
  if(t.type==='fill') document.querySelectorAll('input.blank').forEach(i=>{const k=+i.dataset.b;i.classList.add(t.answers[k].some(x=>x.replace(/\s/g,'')===i.value.replace(/\s/g,''))?'good':'wrong')});
  if(t.type==='bug') document.querySelectorAll('.ln').forEach(l=>{const k=+l.dataset.l;if(k===t.errLine)l.classList.add('good');else if(k===a)l.classList.add('wrong')});
}
function explainHTML(t,ok){
  let h=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'Верно!':'Неверно.'}</b> `;
  if(t.type==='out') h+=(ok?'':`Правильный вывод:<div class="out mono">${esc(t.correct)}</div>`)+esc(t.expl);
  else if(t.type==='fill') h+=(ok?'':`Правильно: <b class="mono">${esc(t.correct)}</b>. `)+esc(t.expl)+`<div style="margin-top:8px">Готовая программа — проверь её в IDLE:</div>`+pre(t.full);
  else if(t.type==='bug') h+=`Ошибка в строке ${t.errLine+1}. ${esc(t.expl)}<div style="margin-top:6px">Исправление: <span class="mono">${esc(t.fix)}</span></div>`;
  else if(t.type==='idle'){const R=t.res||{};
    if(ok) h+=(R.manual?'Вывод совпал с правильным.':`Программа прошла все проверки (${t.tests.length} набора данных).`)+`<div style="margin-top:6px"><button class="btn sec" id="showSol">Сравнить с решением учителя</button></div><div id="sol" class="hidden">${pre(t.sol)}</div>`;
    else if(R.manual) h+=`Вывод не совпал. Правильный вывод для этих данных:<div class="out mono">${esc(t.correct)}</div>`;
    else h+=`Проверка ${R.k+1} из ${t.tests.length} не пройдена.<div>Входные данные:</div><div class="inp mono">${esc(R.input)}</div>`+
      (R.err?`<div>Ошибка:</div><div class="errbox mono">${esc(R.err)}</div>`:`<div class="two"><div>Ожидалось:<div class="out mono">${esc(R.exp)}</div></div><div>Твоя программа вывела:<div class="out mono">${esc(R.got)||' '}</div></div></div>`)+
      (mode==='learn'?'<div>Исправь программу и нажми «Проверить» ещё раз.</div>':'');}
  else h+=esc(t.expl);
  return h+'</div>';
}
function restoreState(s){
  const t=s.tasks[s.i],a=s.answers[s.i];
  if(!a) return;
  applyAnswer(t,a.a);
  if(t.type==='idle') t.res=a.res;
  const retry=(t.type==='idle'&&mode==='learn'&&!a.ok);
  if(!retry) lockTask();
  if(mode==='learn'){showCheck(t,a.a);document.getElementById('fbox').innerHTML=explainHTML(t,a.ok);
    const sb=document.getElementById('showSol');if(sb)sb.onclick=()=>document.getElementById('sol').classList.toggle('hidden');}
  else document.getElementById('fbox').innerHTML=`<div class="fb neutral">Ответ принят. Правильность будет видна после завершения контроля.</div>`;
}
function grade(r,t){return Math.round(10*r/t)}

function bindTask(){
  document.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{if(o.closest('.done'))return;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));o.classList.add('sel')});
  document.querySelectorAll('.ln').forEach(o=>o.onclick=()=>{if(o.closest('.done'))return;document.querySelectorAll('.ln').forEach(x=>x.classList.remove('sel'));o.classList.add('sel')});
  const s=sessions[mode][cur];
  const go=i=>{s.i=i;render()};
  document.querySelectorAll('.pill').forEach(p=>p.onclick=()=>go(+p.dataset.p));
  const $=id=>document.getElementById(id);
  if($('prevBtn')) $('prevBtn').onclick=()=>go(s.i-1);
  if($('nextBtn')) $('nextBtn').onclick=()=>go(s.i+1);
  if($('newSet')) $('newSet').onclick=()=>{if(confirm('Пройти модуль ещё раз с новыми заданиями? В итоговую оценку пойдёт ЛУЧШИЙ результат.')){newSession(cur);renderNav();render()}};
  if($('againBtn')) $('againBtn').onclick=()=>{newSession(cur);renderNav();render()};
  if($('toRes')) $('toRes').onclick=()=>enter('res');
  if($('finishBtn')) $('finishBtn').onclick=()=>{const left=s.tasks.length-s.answers.filter(Boolean).length;
    if(confirm(left?`Без ответа осталось заданий: ${left}. Они будут засчитаны как неверные. Завершить контроль?`:'Завершить контроль?'))finishTest()};
  if($('code')){const ta=$('code');editorKeys(ta);
    if(s.drafts&&s.drafts[s.i]!==undefined&&!s.answers[s.i]) ta.value=s.drafts[s.i];
    ta.addEventListener('input',()=>{(s.drafts||(s.drafts={}))[s.i]=ta.value});
    pyStart();pyStatusUpdate();
    $('runBtn').onclick=async()=>{const t=s.tasks[s.i],c=ta.value;if(!c.trim()){flash('Сначала напиши программу.');return}
      const ok=await pyStart();if(!ok){flash('Python недоступен — запусти программу в IDLE.');return}
      $('runOut').innerHTML='<div class="pystat wait">Выполняю…</div>';
      const r=await runPy(c,t.input);
      $('runOut').innerHTML=`<div>Результат запуска:</div><div class="out mono">${esc(r.out)||' '}</div>`+(r.err?`<div class="errbox mono">${esc(r.err)}</div>`:'');};
  }
  if($('checkBtn')) $('checkBtn').onclick=async()=>{
    if(!needName()) return;
    const t=s.tasks[s.i],a=readAnswer(t);
    if(a===null){flash(t.type==='idle'?(py.state==='fail'?'Напиши программу и впиши её вывод.':'Сначала напиши программу.'):'Сначала дай ответ.');return}
    let ok;
    if(t.type==='idle'){
      if(a.manual!==undefined){ok=sameOutput(a.manual,t.correct);a.res={manual:true}}
      else{if(py.state!=='ready'){flash('Подожди, Python ещё загружается…');const r=await pyStart();if(!r){render();return}}
        $('checkBtn').disabled=true;flash('Проверяю программу…');
        a.res=await testProgram(t,a.code);ok=a.res.ok;}
      a.comments=countComments(a.code);a.lines=codeLines(a.code);
    } else ok=check(t,a);
    s.answers[s.i]={a,ok,user:fmtUser(t,a),res:a.res};
    markDirty();if(mode==='learn'){const L=results.learn[cur]||(results.learn[cur]={log:[]});L.log.push({q:t.brief,ok,user:fmtUser(t,a)})}
    renderNav();
    if(mode==='test'){
      const next=s.tasks.findIndex((x,i)=>i>s.i&&!s.answers[i]),any=s.tasks.findIndex((x,i)=>!s.answers[i]);
      if(any<0){finishTest();return}
      s.i=next>=0?next:any;
    }
    render();
  };
}
function fmtUser(t,a){if(a===null)return '—';if(t.type==='idle')return 'программа, строк: '+codeLines(a.code)+(a.manual?' (вывод введён вручную)':'');if(t.type==='mc')return a;if(t.type==='bug')return 'строка '+(a+1);if(t.type==='fill')return a.join(' | ');return String(a).trim()}
function finishTest(){
  markDirty();
  const s=sessions.test[cur];s.finished=true;
  const right=s.answers.filter(x=>x&&x.ok).length,tot=s.tasks.length;
  const r=results.test[cur]||(results.test[cur]={attempts:[]});
  r.attempts.push({right,total:tot,grade:grade(right,tot),items:s.tasks.map((t,i)=>({q:t.brief,g:t.group||'',ok:!!(s.answers[i]&&s.answers[i].ok),user:s.answers[i]?s.answers[i].user:'нет ответа',code:s.answers[i]&&s.answers[i].a&&s.answers[i].a.code||'',manual:!!(s.answers[i]&&s.answers[i].a&&s.answers[i].a.manual)}))});
  renderNav();render();window.scrollTo(0,0);
}
function needName(){
  if(!studentName.trim()||!studentClass){flash('Заполни фамилию, имя и выбери класс вверху.');document.getElementById('fio').focus();return false}
  return true;
}
function flash(msg){const b=document.getElementById('fbox');if(b)b.innerHTML=`<div class="fb neutral">${esc(msg)}</div>`}

/* ---------- результаты, отправка и экспорт ---------- */
// >>> Вставьте сюда адрес веб-приложения Google Apps Script (между кавычками):
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby8i5TGyq6dQJO6H5Jjr6d-hKGeTW6GwjRpPITiEg4As6o-XlOjKcv60diKF-pDqryf/exec';

const CW=['m1','m2','m3','m4'];                 // классная работа
const HW_N=2;                                   // ДЗ: сколько задач засчитывается в каждой группе
const HW_MAX=HW_N*IDLE_GROUPS.length;           // 12
function setResult(se){
  const items=se.tasks.map((t,i)=>({q:t.brief,g:t.group||'',ok:!!(se.answers[i]&&se.answers[i].ok),st:se.answers[i]?(se.answers[i].ok?'верно':'неверно'):'не решено',code:se.answers[i]&&se.answers[i].a&&se.answers[i].a.code||'',manual:!!(se.answers[i]&&se.answers[i].a&&se.answers[i].a.manual)}));
  return {right:items.filter(x=>x.ok).length,total:se.tasks.length,items};
}
function hwGroups(res){return IDLE_GROUPS.map(g=>{const k=res?res.items.filter(x=>x.g===g[0]&&x.ok).length:0;return {name:g[0],solved:k,counted:Math.min(k,HW_N)}})}
function score(id,res){return id==='m5'?hwGroups(res).reduce((a,g)=>a+g.counted,0):res.right}
function learnBest(id){
  const L=results.learn[id],c=(L&&L.hist?L.hist.slice():[]),se=sessions.learn[id];
  if(se&&se.answers.some(Boolean)) c.push(setResult(se));
  if(!c.length) return null;
  return c.reduce((b,x)=>score(id,x)>score(id,b)?x:b);
}
function attempts(id){const L=results.learn[id],se=sessions.learn[id];return (L&&L.hist?L.hist.length:0)+(se&&se.answers.some(Boolean)?1:0)}
function cwSummary(){let r=0,t=0,any=false;CW.forEach(id=>{const b=learnBest(id);if(b){r+=b.right;any=true}t+=modById(id).learnN});return {r,t,g:grade(r,t),any}}
function hwSummary(){const b=learnBest('m5'),gs=hwGroups(b),r=gs.reduce((a,g)=>a+g.counted,0);return {r,t:HW_MAX,g:grade(r,HW_MAX),any:!!b,groups:gs,best:b}}
function ctSummary(){ // контроль: последняя попытка каждого модуля
  let r=0,t=0;const per={};
  MODULES.filter(x=>x.make).forEach(x=>{const R=results.test[x.id];if(R&&R.attempts.length){const a=R.attempts[R.attempts.length-1];per[x.id]=a;r+=a.right;t+=a.total}});
  return {r,t,g:t?grade(r,t):null,per};
}

/* --- состояние отправки --- */
let dirty=false, lastSent=null, sending=false;
function markDirty(){dirty=true}
function sendStatusHTML(){
  if(sending) return `<div class="send wait">Отправка…</div>`;
  if(lastSent&&!dirty) return `<div class="send ok">✓ Результаты отправлены учителю в ${lastSent.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}</div>`;
  if(lastSent&&dirty) return `<div class="send no">Есть новые результаты — отправь их учителю ещё раз</div>`;
  return `<div class="send no">Результаты ещё не отправлены учителю</div>`;
}
function sendBlock(){return `<div class="sendbar">${sendStatusHTML()}<button class="btn" id="sendBtn">📤 Отправить результат учителю</button></div>`}
function bindSend(){const b=document.getElementById('sendBtn');if(b)b.onclick=sendResults}
function sendResults(){
  if(!studentName.trim()||!studentClass){alert('Заполни фамилию, имя и выбери класс вверху.');const f=document.getElementById('fio');if(f)f.focus();return}
  if(SCRIPT_URL.indexOf('PASTE_')===0){alert('Адрес Google-таблицы не указан. Сохрани результаты в файл и скажи учителю.');return}
  const cw=cwSummary(),hw=hwSummary(),ct=ctSummary();
  const payload={
    name:studentName.trim().replace(/\s+/g,' '),cls:studentClass,
    m1:(learnBest('m1')||{right:0}).right,m2:(learnBest('m2')||{right:0}).right,m3:(learnBest('m3')||{right:0}).right,m4:(learnBest('m4')||{right:0}).right,
    cw_right:cw.r,cw_total:cw.t,cw_grade:cw.any?cw.g:'',
    hw_groups:hw.groups.map(g=>g.counted+'/'+HW_N).join('; '),hw_right:hw.r,hw_total:hw.t,hw_grade:hw.any?hw.g:'',
    ct_m1:ct.per.m1?ct.per.m1.grade:'',ct_m2:ct.per.m2?ct.per.m2.grade:'',ct_m3:ct.per.m3?ct.per.m3.grade:'',ct_m4:ct.per.m4?ct.per.m4.grade:'',ct_m5:ct.per.m5?ct.per.m5.grade:'',
    ct_right:ct.t?ct.r:'',ct_total:ct.t||'',ct_grade:ct.g===null?'':ct.g,
    programs:[]
  };
  const prog=(md,it)=>{if(it.code)payload.programs.push({mode:md,task:it.q,group:it.g,ok:it.ok?'верно':'неверно',code:it.code,lines:codeLines(it.code),comments:countComments(it.code),manual:it.manual?'да':''})};
  if(hw.best) hw.best.items.forEach(it=>prog('ДЗ',it));
  if(ct.per.m5) ct.per.m5.items.forEach(it=>prog('Контроль',it));
  sending=true;refreshSend();
  fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})
    .then(()=>{sending=false;dirty=false;lastSent=new Date();refreshSend();alert('Результаты отправлены учителю.')})
    .catch(()=>{sending=false;refreshSend();alert('Не удалось отправить: проверь интернет и попробуй ещё раз. На всякий случай сохрани результаты в файл.')});
}
function refreshSend(){document.querySelectorAll('.sendbar .send').forEach(x=>x.outerHTML=sendStatusHTML());}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='Результаты не отправлены учителю!';return e.returnValue}});

/* --- плашки с итогами --- */
function summaryHTML(){
  const cw=cwSummary(),hw=hwSummary();
  const chips=CW.map(id=>{const b=learnBest(id),n=modById(id).learnN;return `<span class="chip ${b&&b.right===n?'full':''}">${modById(id).name.split(' ')[0]} ${b?b.right:0}/${n}</span>`}).join('');
  const hchips=hw.groups.map(g=>`<span class="chip ${g.counted===HW_N?'full':''}">${g.name} ${g.counted}/${HW_N}</span>`).join('');
  return `<div class="summary">
    <div class="sumbox ${CW.includes(cur)?'act':''}"><div class="sumt">Классная работа · модули 1–4</div>
      <div class="chips">${chips}</div>
      <div>Заработано <b>${cw.r}</b> из <b>${cw.t}</b> → оценка <span class="sg">${cw.any?cw.g+'<small>/10</small>':'—'}</span></div>
      <div class="sumhint">Считается лучшая попытка каждого модуля, нерешённые задания — неверные. Модуль можно пройти ещё раз.</div></div>
    <div class="sumbox ${cur==='m5'?'act':''}"><div class="sumt">Домашнее задание · задачи в IDLE</div>
      <div class="chips">${hchips}</div>
      <div>Заработано <b>${hw.r}</b> из <b>${hw.t}</b> → оценка <span class="sg">${hw.any?hw.g+'<small>/10</small>':'—'}</span></div>
      <div class="sumhint">Задачи на выбор: по ${HW_N} из каждой группы.</div></div>
  </div>`+sendBlock();
}
function renderResults(){
  const cw=cwSummary(),hw=hwSummary(),ct=ctSummary();
  let h=`<div class="card"><h2>Результаты</h2>${sendBlock()}
  <h3>Классная работа (модули 1–4)</h3><table class="cmp"><tr><th>Модуль</th><th>Лучшая попытка</th><th>Попыток</th></tr>`;
  CW.forEach(id=>{const b=learnBest(id),n=modById(id).learnN;h+=`<tr><td>${modById(id).name}</td><td>${b?b.right:0} из ${n}</td><td>${attempts(id)}</td></tr>`});
  h+=`<tr><th>Итого</th><th>${cw.r} из ${cw.t}</th><th>Оценка: ${cw.any?cw.g+' / 10':'—'}</th></tr></table>
  <h3>Домашнее задание (задачи в IDLE, на выбор)</h3><table class="cmp"><tr><th>Группа</th><th>Решено верно</th><th>Засчитано</th></tr>`;
  hw.groups.forEach(g=>h+=`<tr><td>${g.name}</td><td>${g.solved}</td><td>${g.counted} из ${HW_N}</td></tr>`);
  h+=`<tr><th>Итого</th><th></th><th>${hw.r} из ${hw.t} · оценка ${hw.any?hw.g+' / 10':'—'}</th></tr></table>
  <h3>Контроль</h3><table class="cmp"><tr><th>Раздел</th><th>Верно / всего</th><th>Оценка (из 10)</th></tr>`;
  MODULES.filter(x=>x.make).forEach(x=>{const r=results.test[x.id],at=r&&r.attempts.length?r.attempts:null;
    h+=`<tr><td>${x.name}</td><td>${at?at.map(a=>a.right+'/'+a.total).join(', '):'—'}</td><td>${at?at.map(a=>a.grade).join(', '):'—'}</td></tr>`});
  if(ct.t) h+=`<tr><th>Итого (последние попытки)</th><th>${ct.r} из ${ct.t}</th><th>Оценка: ${ct.g} / 10</th></tr>`;
  return h+`</table><button class="btn lav" id="saveBtn">Сохранить результаты в файл (.txt)</button></div>`;
}
function bindResults(){document.getElementById('saveBtn').onclick=exportTxt;bindSend()}
function exportTxt(){
  if(!studentName.trim()||!studentClass){alert('Заполни фамилию, имя и класс.');return}
  const ds=new Date().toLocaleString('ru-RU'),cw=cwSummary(),hw=hwSummary(),ct=ctSummary();
  let t=`Учебник-тренажёр «Пользовательские процедуры и функции»\nУченик: ${studentName.trim()}\nКласс: ${studentClass}\nДата: ${ds}\n`;
  t+=`\n=== КЛАССНАЯ РАБОТА (модули 1–4) ===\n`;
  CW.forEach(id=>{const b=learnBest(id),n=modById(id).learnN;t+=`${modById(id).name}: лучшая попытка ${b?b.right:0} из ${n} (попыток: ${attempts(id)})\n`});
  t+=`ИТОГО: ${cw.r} из ${cw.t}, оценка ${cw.any?cw.g+'/10':'—'}\n`;
  t+=`\n=== ДОМАШНЕЕ ЗАДАНИЕ (задачи на выбор, по ${HW_N} из группы) ===\n`;
  hw.groups.forEach(g=>t+=`${g.name}: решено верно ${g.solved}, засчитано ${g.counted} из ${HW_N}\n`);
  t+=`ИТОГО: ${hw.r} из ${hw.t}, оценка ${hw.any?hw.g+'/10':'—'}\n`;
  if(hw.best) hw.best.items.forEach((it,i)=>{t+=`   ${i+1}. ${it.q} (${it.g}): ${it.st}\n`;if(it.code)t+=it.code.split('\n').map(l=>'        | '+l).join('\n')+'\n'});
  t+=`\n=== КОНТРОЛЬ ===\n`;
  MODULES.filter(x=>x.make).forEach(x=>{
    const r=results.test[x.id];
    if(!r||!r.attempts.length){t+=`${x.name}: не выполнялся\n`;return}
    r.attempts.forEach((a,k)=>{
      t+=`${x.name} — попытка ${k+1}: верно ${a.right} из ${a.total}, оценка ${a.grade}/10\n`;
      a.items.forEach((it,i)=>t+=`   ${i+1}. ${it.q}: ${it.ok?'верно':'неверно'} (ответ: ${String(it.user).replace(/\n/g,' / ')})\n`);
    });
  });
  if(ct.t) t+=`ИТОГО по контролю: ${ct.r} из ${ct.t}, оценка ${ct.g}/10\n`;
  t+=`\nОтправлено учителю: ${lastSent&&!dirty?'да, '+lastSent.toLocaleTimeString('ru-RU'):'нет'}\n`;
  const blob=new Blob(['﻿'+t],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`Функции_${studentName.trim().replace(/\s+/g,'_')}_${studentClass}.txt`;
  document.body.appendChild(a);a.click();a.remove();
}

/* ===================== УЧЕБНИК ===================== */
const HELP=`
<div class="card toc"><b>Содержание:</b>
<a href="#h1">1. Зачем нужны подпрограммы</a><a href="#h2">2. Как описать подпрограмму</a><a href="#h3">3. Параметры и аргументы</a><a href="#h4">4. Процедура</a><a href="#h5">5. Функция и return</a><a href="#h6">6. return и print</a><a href="#h7">7. Частые ошибки</a><a href="#h8">8. Как проверять в IDLE</a></div>

<div class="card" id="h1"><h2>1. Зачем нужны подпрограммы</h2>
<p>В тексте песни припев поют несколько раз, а печатают его один раз и пишут: «Припев». Так же и в программе: повторяющийся фрагмент оформляют один раз как <b>подпрограмму</b>, а потом просто <b>вызывают</b> её по имени сколько угодно раз.</p>
<p>Подпрограммы сокращают код и делают его понятнее. В Python бывают <b>встроенные</b> подпрограммы (print, input, len, max…) и <b>пользовательские</b> — те, которые программист пишет сам.</p>
<div class="note"><b>Процедура</b> — подпрограмма, которая принимает данные (аргументы) и выполняет с ними действия.<br><b>Функция</b> — подпрограмма, которая принимает данные, выполняет с ними действия и <b>возвращает результат</b>.</div></div>

<div class="card" id="h2"><h2>2. Как описать подпрограмму</h2>
${pre("def имя(параметр1, параметр2):\n    тело подпрограммы")}
<ul><li>Описание начинается со служебного слова <b class="mono">def</b>;</li>
<li>после имени — круглые скобки с параметрами (скобки нужны, даже если параметров нет);</li>
<li>строка заканчивается <b>двоеточием</b>;</li>
<li>тело подпрограммы записывается с <b>отступом 4 пробела</b>;</li>
<li>подпрограмма должна быть описана <b>до</b> первого вызова.</li></ul>
<p><b>Вызов</b> — имя подпрограммы и аргументы в скобках:</p>${pre("имя(аргумент1, аргумент2)")}
</div>

<div class="card" id="h3"><h2>3. Параметры и аргументы</h2>
<div class="two"><div class="note"><b>Параметр</b> — переменная в заголовке подпрограммы, от значения которой зависит её работа. Параметров может быть сколько угодно (или ни одного).</div>
<div class="note"><b>Аргумент</b> — значение, которое передаётся подпрограмме при вызове.</div></div>
${pre("def multiply(a, b):     # a, b — параметры\n    print(a * b)\n\nmultiply(3, 4)          # 3, 4 — аргументы")}
<p>Аргументы передаются <b>по порядку</b>: первый — в первый параметр, второй — во второй. Количество аргументов должно совпадать с количеством параметров.</p>
<div class="warn">Параметры — локальные переменные: они существуют только внутри подпрограммы.</div></div>

<div class="card" id="h4"><h2>4. Процедура (без return)</h2>
<div class="two"><div><p><b>Без параметров</b></p>${pre("def user():\n    print('Пользовательские')\n    print('процедуры')\n\nuser()\nuser()")}</div>
<div><p><b>С параметром</b></p>${pre("def square(x):\n    print('Квадрат числа', x, '=', x ** 2)\n\nsquare(5)")}<div class="out mono">Квадрат числа 5 = 25</div></div></div>
<p><b>Процедура без параметров может сама запрашивать данные</b></p>${pre("def vivod():\n    m = input()\n    n = int(input())\n    print(m * n)\n\nvivod()")}
<p>Процедура <b>сама выводит</b> результат на экран. Использовать этот результат дальше в программе нельзя.</p></div>

<div class="card" id="h5"><h2>5. Функция и return</h2>
${pre("def area(a, b):\n    return a * b\n\ns1 = area(3, 4)\ns2 = area(5, 2)\nprint(s1 + s2)")}<div class="out mono">22</div>
<p><b class="mono">return</b> возвращает значение в то место, где функцию вызвали. Его можно сохранить в переменную, вывести на экран или использовать в выражении: <span class="mono">print(area(3, 4) + 1)</span>.</p>
<div class="warn"><b>return сразу завершает работу функции.</b> Строки, записанные после него в теле функции, не выполнятся.</div>
${pre("def get_sum(x, y, z):\n    return x + y + z\n    print('Сумма равна', x + y + z)   # не выполнится!\n\nprint(get_sum(1, 2, 3))")}<div class="out mono">6</div></div>

<div class="card" id="h6"><h2>6. return и print — в чём разница</h2>
<table class="cmp"><tr><th>print</th><th>return</th></tr>
<tr><td>Показывает значение <b>на экране</b></td><td>Передаёт значение <b>в программу</b>, в место вызова</td></tr>
<tr><td>Можно использовать где угодно</td><td>Используется только внутри функции</td></tr>
<tr><td>После print подпрограмма продолжает работу</td><td>После return функция заканчивает работу</td></tr>
<tr><td>Результат нельзя сохранить в переменную</td><td>Результат можно сохранить, сравнить, сложить…</td></tr></table>
<div class="two"><div>${pre("def sq_p(x):\n    print(x ** 2)\n\ny = sq_p(5)\nprint(y)")}<div class="out mono">25\nNone</div></div>
<div>${pre("def sq_f(x):\n    return x ** 2\n\ny = sq_f(5)\nprint(y + 1)")}<div class="out mono">26</div></div></div>
<div class="note">Если в подпрограмме нет return, она возвращает специальное значение <b class="mono">None</b> — «ничего».</div></div>

<div class="card" id="h7"><h2>7. Частые ошибки</h2>
<table class="cmp err"><colgroup><col style="width:26%"><col style="width:37%"><col style="width:37%"></colgroup><tr><th>Ошибка</th><th>Неправильно</th><th>Правильно</th></tr>
<tr><td>Нет двоеточия</td><td class="mono">def f(a, b)</td><td class="mono">def f(a, b):</td></tr>
<tr><td>Нет отступа в теле</td><td class="mono">def f(x):<br>return x * 2</td><td class="mono">def f(x):<br>    return x * 2</td></tr>
<tr><td>Точка с запятой между параметрами</td><td class="mono">def f(a, b; c):</td><td class="mono">def f(a, b, c):</td></tr>
<tr><td>Вызов до описания</td><td class="mono">print(f(5))<br>def f(x):<br>    return x * 2</td><td>Сначала def, потом вызов</td></tr>
<tr><td>Не хватает аргументов</td><td class="mono">def f(a, b, c): …<br>f(2, 3)</td><td class="mono">f(2, 3, 4)</td></tr>
<tr><td>Безымянный аргумент после именованного</td><td class="mono">f(a = 9, c = 5, 3)</td><td class="mono">f(9, 3, 5)</td></tr>
<tr><td>Разный регистр имени</td><td class="mono">def Summa(a, b): …<br>summa(2, 3)</td><td>Имя пишется одинаково</td></tr>
<tr><td>print вместо return, а результат нужен дальше</td><td class="mono">def f(x):<br>    print(x * 2)<br>y = f(3) + 1</td><td class="mono">def f(x):<br>    return x * 2</td></tr></table></div>

<div class="card" id="h8"><h2>8. Как проверять программы в IDLE</h2>
<ol><li>Открой IDLE, выбери <b>File → New File</b>.</li>
<li>Напиши программу: сначала <b>описание</b> подпрограммы (def…), ниже — основная программа с вызовом.</li>
<li>Сохрани файл (Ctrl+S) и запусти — <b>F5</b>.</li>
<li>Если программа ждёт ввода, введи данные в окне Shell, каждое значение — и нажми Enter.</li>
<li>Сравни вывод с тем, что требуется в задании.</li></ol>
<div class="note">В модулях 2–4 сомнения тоже можно проверить в IDLE: перепиши код и запусти.</div></div>
`;
