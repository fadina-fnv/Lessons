paste<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Арифметика в 2 и 8 СС — тренажёр</title>
<style>
:root{
  --ink:#0b1f3a; --bg:#eef3fb; --card:#ffffff; --muted:#42526b;
  --blue:#1546c0; --blue-soft:#dbe6ff;
  --green:#0f6b36; --green-soft:#d3f2de;
  --bad:#7a3fb5; --bad-soft:#efe4fb;
  --orange:#c2410c; --orange-soft:#ffe6d0;
  --yellow-soft:#fff1b8; --dec:#0f766e; --dec-soft:#ccfbf1; --border:#9fb0cc;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Times New Roman",Times,serif;font-size:21px;line-height:1.35;color:var(--ink);background:var(--bg)}
.mono{font-family:"JetBrains Mono",Consolas,"Courier New",monospace}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}

header.top{background:linear-gradient(135deg,#dfe9ff,#eef4ff);border:3px solid var(--blue);border-radius:14px;padding:14px 20px;display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between}
header.top h1{margin:0;font-size:28px;line-height:1.15;color:var(--blue)}
header.top .sub{font-size:18px;color:var(--muted)}
.who{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.who label{display:flex;flex-direction:column;font-size:16px;gap:3px;color:var(--muted)}
.who input{font-size:21px;padding:6px 10px;border:2px solid var(--border);border-radius:8px;background:#fff;color:var(--ink)}
.who input.need{border-color:#e0a800;background:var(--yellow-soft)}
#fio{width:250px} #cls{width:90px}
.btn{border:2px solid var(--blue);background:#fff;border-radius:10px;padding:8px 16px;font-weight:bold;color:var(--blue)}
.btn:hover{background:var(--blue-soft)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#0f37a0}
.btn.ghost{border-color:var(--border);font-weight:normal;color:var(--ink)}
.btn.save{background:#ffd34d;border-color:#e0b020;color:var(--ink)}
.btn.send{background:var(--green);border-color:var(--green);color:#fff}
.btn.send:hover{background:#0a5229}
.btn:disabled{opacity:.4;cursor:default}

.modes{display:flex;gap:10px;margin:16px 0 10px}
.modes button{flex:1;font-size:25px;font-weight:bold;padding:12px;border:3px solid var(--blue);border-radius:12px;background:#fff;color:var(--blue)}
.modes button.on{background:var(--blue);color:#fff}
.levels{display:grid;gap:8px}
.levels button{text-align:left;border:2px solid var(--border);background:#fff;border-radius:10px;padding:8px 10px;font-size:19px;line-height:1.2;position:relative;min-height:66px}
.levels button b{display:block;font-size:19px}
.levels button small{display:block;font-size:15px;color:var(--muted)}
.levels button.on{border-color:var(--blue);background:var(--blue-soft);box-shadow:inset 0 0 0 2px var(--blue)}
.levels .badge{position:absolute;top:6px;right:8px;font-size:15px;font-weight:bold;border-radius:20px;padding:1px 8px;background:var(--green-soft);color:var(--green)}
.levels .badge.run{background:var(--yellow-soft);color:#7a5200}

details.help{margin:10px 0;background:#fff;border:2px solid var(--border);border-radius:10px;padding:8px 14px}
details.help summary{cursor:pointer;font-weight:bold}
details.help table{border-collapse:collapse;margin:8px 0}
details.help td{border:1px solid var(--border);padding:3px 12px;text-align:center}
details.help p{margin:6px 0}

.work{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.work.watch{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)}
.card{background:var(--card);border-radius:14px;padding:18px;border:2px solid var(--border)}
.card h2{margin:0 0 10px;font-size:23px}
.card h3{margin:16px 0 6px;font-size:20px;border-top:2px dashed var(--border);padding-top:12px}
.gridbox{overflow-x:auto;padding:4px 0 8px}
.grid{display:grid;gap:4px;justify-content:center;align-items:center}
.cell{height:64px;display:flex;align-items:center;justify-content:center;font-family:"JetBrains Mono",Consolas,"Courier New",monospace;font-size:42px;font-weight:bold;border-radius:8px}
.cell.act{background:var(--yellow-soft);outline:3px solid #e0a800}
.cell.lend{background:var(--orange-soft);outline:3px dashed var(--orange)}
.cell.strike{color:#9aa6ba;text-decoration:line-through;text-decoration-thickness:4px;text-decoration-color:#6b7a93}
.cell.res{background:#f1f4fa}
.cell.res.shown{background:var(--green-soft);color:var(--green)}
.cell.res.lead{color:#8a97ad;background:#f1f4fa}
.cell.op{font-size:44px}
.cell.base{justify-content:flex-start;align-items:flex-end;font-size:22px;font-weight:normal;color:var(--muted);padding-bottom:6px}
.markc{height:38px;display:flex;align-items:center;justify-content:center;font-family:"JetBrains Mono",Consolas,monospace;font-size:26px;font-weight:bold;color:var(--orange);border-radius:8px}
.markc.new{background:var(--orange-soft)}
/* запись заёма над уменьшаемым */
.bm{height:36px;display:flex;align-items:center;justify-content:center;font-family:"JetBrains Mono",Consolas,monospace;font-size:27px;font-weight:bold;border-radius:8px}
.bm.give{color:var(--orange)}
.bm.recv{color:var(--blue)}
.bm.x{opacity:.55;text-decoration:line-through;text-decoration-thickness:3px}
.bm.new.give{background:var(--orange-soft)}
.bm.new.recv{background:var(--blue-soft)}
.recv{color:var(--blue)}
.carry{color:var(--orange)}
.rule{grid-column:1/-1;height:4px;background:var(--blue);border-radius:2px;margin:2px 0}
input.inp{width:100%;height:64px;text-align:center;font-family:"JetBrains Mono",Consolas,"Courier New",monospace;font-size:42px;font-weight:bold;border:3px solid var(--blue);border-radius:8px;background:#fff;padding:0}
input.inp:focus{outline:4px solid #ffcf33;outline-offset:1px}
input.inp.ok{border-color:var(--green);background:var(--green-soft);color:var(--green)}
input.inp.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
input.inp:disabled{opacity:1}
button.mark{height:38px;width:100%;border:2px dashed var(--border);border-radius:8px;background:#fff;font-family:"JetBrains Mono",Consolas,monospace;font-size:26px;font-weight:bold;color:var(--orange);padding:0;line-height:1}
button.mark.on{border-style:solid;border-color:var(--orange);background:var(--orange-soft)}
input.markin{width:100%;height:38px;border:2px dashed var(--border);border-radius:8px;background:#fff;text-align:center;font-family:"JetBrains Mono",Consolas,monospace;font-size:24px;font-weight:bold;color:var(--blue);padding:0}
input.markin:focus{outline:3px solid #ffcf33;border-style:solid}
.cell.right{background:var(--green-soft);color:var(--green)}
.rowlabel{font-size:16px;color:var(--muted);text-align:right;padding-right:4px;line-height:1.1}

.rules .rt{font-weight:bold;font-size:20px;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.chips span{border:2px solid var(--blue);border-radius:8px;padding:2px 10px;background:var(--blue-soft);font-size:21px}
.stepno{font-size:17px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.card h3 .stepno{font-weight:normal;margin:0}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.log{display:flex;flex-direction:column;gap:4px}
.logrow{display:grid;grid-template-columns:96px 1fr;gap:6px;padding:5px 10px;border-radius:8px;font-size:21px;background:#f1f4fa}
.logrow .lg{color:var(--muted);font-size:18px;padding-top:3px}
.logrow .lines div+div{margin-top:3px;padding-top:3px;border-top:1px dotted var(--border)}
.logrow.cur{background:var(--yellow-soft);outline:2px solid #e0a800}
.logrow.ans{background:var(--green-soft);color:var(--green);font-weight:bold}
.logrow.ans .lg{color:var(--green)}
.msg{margin-top:10px;padding:10px 14px;border-radius:10px;font-size:22px;font-weight:bold}
.msg.ok{background:var(--green-soft);color:var(--green)}
.msg.bad{background:var(--bad-soft);color:var(--bad)}
.msg.warn{background:var(--yellow-soft);color:#6b4700}
.msg.info{background:var(--blue-soft);color:var(--blue);font-weight:normal}
.note{font-size:17px;color:var(--muted);margin-top:8px}

.prog{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.dot{width:38px;height:38px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:bold;background:#fff;color:var(--muted)}
.dot.cur{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft);color:var(--blue)}
.dot.p1{background:var(--green);border-color:var(--green);color:#fff}
.dot.p05{background:#e0a800;border-color:#e0a800;color:#fff}
.dot.p0{background:var(--bad);border-color:var(--bad);color:#fff}
.score{font-size:22px}
.score b{font-size:28px}
.final{text-align:center}
.final .prog{justify-content:center}
.final .grade{font-size:84px;font-weight:bold;line-height:1;color:var(--blue)}
.final ol{text-align:left;font-size:20px;margin:12px auto;max-width:640px}
.final li.p1{color:var(--green)} .final li.p05{color:#8a6100} .final li.p0{color:var(--bad)}
.task{font-size:26px;margin-bottom:6px}

.overlay{position:fixed;inset:0;background:rgba(21,70,192,.35);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.overlay[hidden]{display:none}
.modal{background:#fff;border-radius:16px;padding:22px 26px;max-width:680px;width:100%;max-height:96vh;overflow:auto;border:4px solid var(--blue)}
.modal h2{margin:0 0 4px;font-size:27px}
.modal .whoami{font-size:21px;color:var(--muted);margin-bottom:10px}
.modal table{width:100%;border-collapse:collapse;font-size:22px}
.modal td{padding:7px 8px;border-bottom:1px solid var(--border)}
.modal td.pts{text-align:right;white-space:nowrap;font-weight:bold}
.modal tr.sum td{border-bottom:none;border-top:3px solid var(--blue);font-weight:bold;font-size:24px}
.modal .big{text-align:center;margin:14px 0 4px}
.modal .big .n{font-size:110px;font-weight:bold;line-height:1;color:var(--blue)}
.modal .big .of{font-size:26px}
.cmpwrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:10px}
.cpan{background:#fff;border:3px solid var(--blue);border-radius:14px;padding:12px 14px;min-width:0}
.cpan h2{margin:0 0 4px;font-size:23px;color:var(--blue)}
.cpan.dec{border-color:var(--dec);background:#f3fdfb}
.cpan.dec h2{color:var(--dec)}
.cmpwrap .cell{height:54px;font-size:36px}
.cmpwrap .cell.op{font-size:38px}
.cmpwrap .cell.base{font-size:20px}
.cmpwrap .bm{height:30px;font-size:23px}
.cmpwrap .markc{height:32px;font-size:23px}
.grid.dec .cell.res.shown{background:var(--dec-soft);color:var(--dec)}
.grid.dec .cell.res.lead{color:#8a97ad;background:#f1f4fa}
.grid.dec .rule{background:var(--dec)}
.grid.dec .cell.base{color:var(--dec)}
.side{font-family:"JetBrains Mono",Consolas,monospace;font-size:22px;color:var(--blue);white-space:nowrap;padding:1px 8px;margin-left:4px;background:var(--blue-soft);border-radius:8px}
.notebar{background:#fff;border:2px solid var(--border);border-radius:12px;padding:6px 14px;margin-bottom:14px}
.notebar .note{margin-top:0}
@media (max-width:900px){.cmpwrap{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:92vw;padding:12px 20px;border-radius:12px;font-size:21px;font-weight:bold;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.toast[hidden]{display:none}
.toast.ok{background:var(--green-soft);color:var(--green);border:2px solid var(--green)}
.toast.bad{background:var(--yellow-soft);color:#6b4700;border:2px solid #e0a800}
.toast.info{background:var(--blue-soft);color:var(--blue);border:2px solid var(--blue)}

@media (max-width:900px){.work,.work.watch{grid-template-columns:1fr}.levels{grid-template-columns:repeat(2,1fr)!important}}
@media (max-width:520px){.cell,input.inp{height:48px;font-size:30px}.bm{font-size:21px}.modes button{font-size:20px}.logrow{grid-template-columns:1fr;font-size:19px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Арифметика в двоичной и восьмеричной системах</h1>
      <div class="sub">Сложение и вычитание в столбик · 2 и 8 СС</div>
    </div>
    <div class="who">
      <label>Фамилия, имя<input id="fio" type="text" autocomplete="off" spellcheck="false"></label>
      <label>Класс<input id="cls" type="text" list="clsList" autocomplete="off" spellcheck="false"></label>
      <datalist id="clsList"><option value="10А"><option value="10Б"></datalist>
      <button class="btn" id="totalBtn" type="button">Итоговая оценка</button>
      <button class="btn send" id="sendBtn" type="button">Отправить учителю</button>
      <button class="btn save" id="saveBtn" type="button">Сохранить (.txt)</button>
    </div>
  </header>

  <div class="modes" id="modes">
    <button type="button" data-mode="watch">👁 Смотрю</button>
    <button type="button" data-mode="solve">✍ Решаю сам</button>
  </div>
  <div class="levels" id="levels"></div>
  <details class="help" id="help"><summary>Справка</summary><div id="helpBody"></div></details>
  <div id="main"></div>
</div>
<div class="overlay" id="overlay" hidden><div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Итоговая оценка"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
'use strict';

/* ===== ССЫЛКА НА GOOGLE APPS SCRIPT: вставьте её вместо PASTE_SCRIPT_URL_HERE ===== */
var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzncbvNhLjytmPjPOzeA61QmGNGGjiV6kgtlra78TV_elUDFC7rLIgGt1-cxwx4tsdPww/exec';

/* ===================== АРИФМЕТИКА ===================== */
var DIG='0123456789ABCDEF';
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function toDigits(s){var r=[];for(var i=s.length-1;i>=0;i--)r.push(DIG.indexOf(s.charAt(i)));return r;}
function toStr(n,base){return n.toString(base).toUpperCase();}

/* Столбик: разряды нумеруются справа, с 0.
   Вычитание — школьным способом: заём у ближайшего ненулевого разряда слева,
   нули по пути получают 10 (в своей СС) и отдают 1 вправо. */
function compute(t){
  var a=toDigits(t.a),b=toDigits(t.b),base=t.base,L=Math.max(a.length,b.length);
  var steps=[],res=[],tr=0,chains=0,marks=null,i;
  if(t.op==='+'){
    var c=0;
    for(i=0;i<L;i++){
      var x=a[i]||0,y=b[i]||0,s=x+y+c,co=s>=base?1:0;
      steps.push({col:i,x:x,y:y,cin:c,s:s,d:s-co*base,cout:co});
      res.push(s-co*base);if(co)tr++;c=co;
    }
    if(c){steps.push({col:L,fin:true,d:1,cin:1,cout:0});res.push(1);}
  }else{
    var m=a.slice();while(m.length<L)m.push(0);
    marks=[];for(i=0;i<L;i++)marks.push([]);
    for(i=0;i<L;i++){
      var yy=b[i]||0,st={col:i,x0:m[i],y:yy,changed:marks[i].length>0,borrow:false,chain:[]};
      if(m[i]<yy){
        var j=i+1;while(j<L-1&&m[j]===0)j++;
        st.borrow=true;st.from=j;st.fromOld=m[j];m[j]--;st.fromNew=m[j];
        marks[j].push({v:DIG.charAt(m[j]),kind:'give',step:i});
        for(var k=j-1;k>i;k--){
          marks[k].push({v:(base===2?'10':String(base)),kind:'recv',step:i});
          m[k]=base-1;
          marks[k].push({v:DIG.charAt(base-1),kind:'give',step:i});
          st.chain.push(k);
        }
        st.before=m[i];m[i]+=base;
        marks[i].push({v:(base===2?'10':String(m[i])),kind:'recv',step:i,side:(base===2?'1 + 1':(st.before?'<b>'+base+'</b> + '+st.before:''))});
        tr++;if(st.chain.length)chains++;
      }
      st.x=m[i];st.d=m[i]-yy;steps.push(st);res.push(st.d);
    }
  }
  var sig=res.length;while(sig>1&&res[sig-1]===0)sig--;
  var rs='';for(i=sig-1;i>=0;i--)rs+=DIG.charAt(res[i]);
  return {a:a,b:b,L:L,W:(t.op==='+'?L+1:L),steps:steps,res:res,sig:sig,transfers:tr,chains:chains,marks:marks,resStr:rs};
}

/* ===================== ПОЯСНЕНИЯ К ШАГАМ ===================== */
function D(v){return '<b class="mono">'+DIG.charAt(v)+'</b>';}
function sb(base){return '<sub>'+base+'</sub>';}
function ten(base){return '<b class="recv mono">10</b>'+sb(base)+(base===2?' = 1 + 1 = 2':' = 8');}
function colList(arr){ /* номера разрядов (с 1) по возрастанию */
  var n=arr.map(function(k){return k+1;}).sort(function(x,y){return x-y;});
  if(n.length===1)return 'Разряд '+n[0]+' — нуль';
  return 'Разряды '+n.slice(0,-1).join(', ')+' и '+n[n.length-1]+' — нули';
}
function logLine(st,t){
  var base=t.base,h;
  if(t.op==='+'){
    if(st.fin)return 'перенос <b class="carry">1</b> → пишем '+D(1);
    h=D(st.x)+' + '+D(st.y)+(st.cin?' + <b class="carry">1</b>':'')+' = '+st.s;
    if(st.cout)h+=' = <span class="mono">'+toStr(st.s,base)+'</span>'+sb(base);
    return h+' → пишем '+D(st.d)+(st.cout?', перенос <b class="carry">1</b>':'');
  }
  if(!st.borrow){
    return (st.changed?'после заёма здесь '+D(st.x0)+': ':'')+D(st.x0)+' − '+D(st.y)+' = '+st.d+' → пишем '+D(st.d);
  }
  var L=[];
  L.push(D(st.x0)+' − '+D(st.y)+': вычесть нельзя — занимаем единицу в старшем разряде.');
  if(st.chain.length)L.push(colList(st.chain)+', занять там нечего — идём левее.');
  L.push('Разряд '+(st.from+1)+': '+D(st.fromOld)+' → <b class="carry mono">'+DIG.charAt(st.fromNew)+'</b> (отдал единицу вправо).');
  for(var i=0;i<st.chain.length;i++){
    L.push('Разряд '+(st.chain[i]+1)+': получил '+ten(base)+', отдал 1 вправо → осталось <b class="carry mono">'+DIG.charAt(base-1)+'</b>.');
  }
  var v=st.before+base;
  if(st.before===0)L.push('Разряд '+(st.col+1)+': получил '+ten(base)+'; '+v+' − '+st.y+' = '+st.d+' → пишем '+D(st.d));
  else L.push('Разряд '+(st.col+1)+': получил '+ten(base)+'; вместе со своей '+D(st.before)+': <b class="recv">'+base+' + '+st.before+' = '+v+'</b>; '+v+' − '+st.y+' = '+st.d+' → пишем '+D(st.d));
  return '<div class="lines"><div>'+L.join('</div><div>')+'</div></div>';
}
function num(s,base){return '<span class="mono"><b>'+s+'</b></span>'+sb(base);}
function opSign(op){return op==='+'?'+':'−';}
function opName(op){return op==='+'?'сложение':'вычитание';}
function checkLine(t,comp){
  var a=parseInt(t.a,t.base),b=parseInt(t.b,t.base),r=t.op==='+'?a+b:a-b;
  return 'Проверка в десятичной системе: '+num(t.a,t.base)+' = '+a+', '+num(t.b,t.base)+' = '+b+'; '+a+' '+opSign(t.op)+' '+b+' = '+r+' = '+num(comp.resStr,t.base)+' ✓';
}

/* ===================== ГЕНЕРАТОРЫ ЗАДАНИЙ ===================== */
function randNum(len,base){var s=DIG.charAt(rnd(1,base-1));for(var i=1;i<len;i++)s+=DIG.charAt(rnd(0,base-1));return s;}
function zeroRich(len,base){var s=DIG.charAt(rnd(1,base-1));for(var i=1;i<len;i++)s+=rnd(0,2)===0?'0':DIG.charAt(rnd(1,base-1));return s;}
function ones(s){return s.replace(/0/g,'').length;}
function some(steps,f){for(var i=0;i<steps.length;i++)if(!steps[i].fin&&f(steps[i]))return true;return false;}
/* k — ступень сложности. 2 СС: k = 0..4; 8 СС: сложение k = 0..2, вычитание k = 0..3 */
function cand(base,op,k){
  var t,c,len,a,b,i;
  if(op==='+'){
    if(base===2){
      if(k===0){ /* без переноса */
        len=rnd(4,5);a='1';b='';
        for(i=1;i<len;i++)a+=rnd(0,1);
        for(i=0;i<len;i++)b+=(a.charAt(i)==='1'?'0':String(rnd(0,1)));
        b=b.replace(/^0+/,'');
        if(b.length<2||ones(a)+ones(b)<3)return null;
        return rnd(0,1)?{a:a,b:b,op:'+',base:2}:{a:b,b:a,op:'+',base:2};
      }
      len=[0,4,rnd(5,6),rnd(5,7),rnd(6,7)][k];
      t={a:randNum(len,2),b:randNum(rnd(Math.max(3,len-1),len),2),op:'+',base:2};c=compute(t);
      var triple=some(c.steps,function(s){return s.x===1&&s.y===1&&s.cin===1;});
      if(k===1)return c.transfers===1?t:null;
      if(k===2)return c.transfers===2?t:null;
      return (c.transfers>=3&&triple)?t:null;
    }
    len=[2,3,rnd(3,4)][k];
    t={a:randNum(len,8),b:randNum(k===0?2:rnd(len-1,len),8),op:'+',base:8};
    c=compute(t);
    return c.transfers>=(k===2?2:1)?t:null;
  }
  if(base===2){
    len=[rnd(4,5),rnd(4,5),rnd(5,6),rnd(4,6),rnd(6,7)][k];
    t={a:(k>=3?zeroRich(len,2):randNum(len,2)),b:randNum(rnd(Math.max(1,len-3),len),2),op:'-',base:2};
  }else{
    len=[2,3,rnd(3,4),rnd(3,4)][k];
    t={a:(k===3?zeroRich(len,8):randNum(len,8)),b:randNum(k===0?rnd(1,2):rnd(Math.max(1,len-2),len),8),op:'-',base:8};
  }
  if(parseInt(t.a,base)<=parseInt(t.b,base))return null;
  c=compute(t);
  var tr=c.transfers,ch=c.chains;
  if(base===2){
    if(k===0)return (tr===0&&ones(t.b)>=2&&c.resStr.length>=2)?t:null; /* без заёма */
    if(k===1)return (tr===1&&!ch&&t.b.length>=2)?t:null;              /* один заём */
    if(k===2)return (tr===2&&!ch)?t:null;                              /* два заёма */
    if(k===3)return (ch>=1)?t:null;                                    /* заём через нули */
    return (ch>=1&&tr>=2)?t:null;
  }
  if(k===3)return ch>=1?t:null;
  return (tr>=(k===2?2:1)&&!ch)?t:null;
}
function gen(base,op,k,used){
  var t,last=null;
  for(var g=0;g<20000;g++){
    t=cand(base,op,k);if(!t)continue;
    last=t;
    var key=t.a+t.op+t.b;
    if(!(used&&used[key])){if(used)used[key]=1;return t;}
  }
  return last||(op==='+'?{a:'101',b:'11',op:op,base:base}:{a:'100',b:'1',op:op,base:base});
}
/* Темы «Смотрю» и упражнения «Решаю сам» идут в одном порядке */
var WT=[{base:2,op:'+',vars:5},{base:2,op:'-',vars:5},{base:8,op:'+',vars:3},{base:8,op:'-',vars:4}];
var EX=[
 {base:2,op:'+',n:5,title:'2 СС: сложение',hint:'от одного переноса до цепочки',plan:function(i){return i;}},
 {base:2,op:'-',n:5,title:'2 СС: вычитание',hint:'без заёма, с заёмом, заём через нули',plan:function(i){return i;}},
 {base:8,op:'+',n:4,title:'8 СС: сложение',hint:'с одним и несколькими переносами',plan:function(i){return [0,1,2,2][i];}},
 {base:8,op:'-',n:4,title:'8 СС: вычитание',hint:'последний пример — заём через нуль',plan:function(i){return [0,1,2,3][i];}}
];
function genSeries(e){var u={},r=[],E=EX[e];for(var i=0;i<E.n;i++)r.push(gen(E.base,E.op,E.plan(i),u));return r;}

/* ===================== СОСТОЯНИЕ ===================== */
var state={mode:'watch',wsel:0,level:0,watch:[],solve:[],saved:true,sending:false},q;
for(q=0;q<WT.length;q++)state.watch.push(null);
for(q=0;q<EX.length;q++)state.solve.push({series:null,history:[]});

function newCur(t){
  var W=compute(t).W,v=[],m=[];
  for(var i=0;i<W;i++){v.push('');m.push(t.op==='+'?false:'');}
  return {attempt:0,status:'input',values:v,marks:m,bad:[],msg:null};
}
function ensureWatch(){
  var i=state.wsel,T=WT[i];
  if(!state.watch[i]){var t=gen(T.base,T.op,0);state.watch[i]={t:t,comp:compute(t),step:0,k:0};}
  return state.watch[i];
}
function nextWatch(){
  var i=state.wsel,T=WT[i],k=(ensureWatch().k+1)%T.vars,t=gen(T.base,T.op,k);
  state.watch[i]={t:t,comp:compute(t),step:0,k:k};
}
function ensureSeries(){
  var S=state.solve[state.level];
  if(!S.series){var ts=genSeries(state.level);S.series={tasks:ts,idx:0,results:[],cur:newCur(ts[0]),done:false};}
  return S.series;
}
function points(results){var p=0;for(var i=0;i<results.length;i++)p+=results[i].points;return p;}
function fmt(p){return String(p).replace('.',',');}
/* Итог: по каждому упражнению лучший результат (включая незавершённую серию); невыполненное = 0 */
function totals(){
  var rows=[],sum=0,max=0;
  for(var i=0;i<EX.length;i++){
    var S=state.solve[i],best=-1,k;
    for(k=0;k<S.history.length;k++)best=Math.max(best,points(S.history[k].results));
    if(S.series&&!S.series.done&&S.series.results.length)best=Math.max(best,points(S.series.results));
    rows.push({title:EX[i].title,best:best,n:EX[i].n});
    sum+=Math.max(0,best);max+=EX[i].n;
  }
  return {rows:rows,sum:sum,max:max,grade:Math.round(sum/max*10)};
}

/* ===================== ОТРИСОВКА СТОЛБИКА ===================== */
function visMarks(comp,c,done){
  var r=[],m=(comp.marks&&comp.marks[c])||[];
  for(var i=0;i<m.length;i++)if(m[i].step<done)r.push(m[i]);
  return r;
}
function gridHTML(t,comp,o){
  var W=comp.W,c,r,sub=t.op==='-';
  var h='<div class="grid'+(o.dec?' dec':'')+'" style="grid-template-columns:'+(o.solve?'48px':'40px')+' repeat('+W+','+(o.solve?'minmax(40px,64px)':'minmax(30px,54px)')+') '+(!o.solve?'minmax(34px,max-content)':'34px')+'">';
  if(o.solve){
    h+='<div class="rowlabel">'+(sub?'заём':'')+'</div>';
    for(c=W-1;c>=0;c--){
      if(sub)h+='<input class="markin" data-col="'+c+'" maxlength="3" autocomplete="off" spellcheck="false" inputmode="numeric" value="'+(o.cur.marks[c]||'')+'" title="Запись заёма для себя — не оценивается"'+(o.locked?' disabled':'')+'>';
      else if(c===0)h+='<div></div>';
      else h+='<button type="button" class="mark'+(o.cur.marks[c]?' on':'')+'" data-act="mark" data-col="'+c+'" title="Пометка переноса для себя"'+(o.locked?' disabled':'')+'>'+(o.cur.marks[c]?'1':'')+'</button>';
    }
    h+='<div></div>';
  }else if(sub){
    /* две строки записи заёма: нижняя — первое изменение, верхняя — второе */
    for(r=1;r>=0;r--){
      h+='<div></div>';
      for(c=W-1;c>=0;c--){
        var vis=visMarks(comp,c,o.done),e=vis[r];
        if(!e){h+='<div class="bm"></div>';continue;}
        h+='<div class="bm '+e.kind+(r<vis.length-1?' x':'')+(e.step===o.done-1?' new':'')+'">'+e.v+'</div>';
      }
      var av=o.active>=0?visMarks(comp,o.active,o.done):[],ae=av[r];
      h+=(ae&&ae.side&&ae.step===o.done-1&&r===av.length-1)?'<div class="side">= '+ae.side+'</div>':'<div></div>';
    }
  }else{
    h+='<div></div>';
    for(c=W-1;c>=0;c--){
      var show=c>=1&&c-1<o.done&&comp.steps[c-1].cout;
      h+='<div class="markc'+(show&&c-1===o.done-1?' new':'')+'">'+(show?'1':'')+'</div>';
    }
    var cst=o.done>=1?comp.steps[o.done-1]:null;
    if(cst&&!cst.fin&&cst.col===o.active)h+='<div class="side">'+(cst.s>=t.base?cst.s+' = <b>'+t.base+'</b> + '+(cst.s-t.base):cst.s+' &lt; '+t.base)+'</div>';
    else h+='<div></div>';
  }
  /* первое число */
  h+='<div></div>';
  for(c=W-1;c>=0;c--){
    var strike=!o.solve&&sub&&visMarks(comp,c,o.done).length>0;
    var cls='cell'+(o.active===c?' act':'')+(o.lend&&o.lend.indexOf(c)>=0?' lend':'')+(strike?' strike':'');
    h+='<div class="'+cls+'">'+(c<comp.a.length?DIG.charAt(comp.a[c]):'')+'</div>';
  }
  h+='<div class="cell base"><sub>'+t.base+'</sub></div>';
  /* второе число */
  h+='<div class="cell op">'+opSign(t.op)+'</div>';
  for(c=W-1;c>=0;c--)h+='<div class="cell'+(o.active===c?' act':'')+'">'+(c<comp.b.length?DIG.charAt(comp.b[c]):'')+'</div>';
  h+='<div class="cell base"><sub>'+t.base+'</sub></div>';
  h+='<div class="rule"></div>';
  /* результат */
  h+='<div></div>';
  for(c=W-1;c>=0;c--){
    if(o.solve){
      var ic='inp';
      if(o.cur.status==='solved')ic+=' ok';
      else if(o.cur.bad.indexOf(c)>=0)ic+=' bad';
      else if(o.cur.status==='failed'&&o.cur.values[c]!=='')ic+=' ok';
      h+='<input class="'+ic+'" data-col="'+c+'" maxlength="2" autocomplete="off" spellcheck="false" inputmode="numeric" value="'+o.cur.values[c]+'"'+(o.locked?' disabled':'')+' aria-label="Разряд '+(c+1)+' справа">';
    }else{
      var shown=c<o.done&&c<comp.res.length;
      var lead=shown&&o.finished&&c>=comp.sig;
      h+='<div class="cell res'+(shown?' shown':'')+(lead?' lead':'')+(o.active===c?' act':'')+'">'+(shown?DIG.charAt(comp.res[c]):'')+'</div>';
    }
  }
  h+='<div class="cell base"><sub>'+t.base+'</sub></div>';
  if(o.solve&&o.cur.status==='failed'){
    h+='<div class="rowlabel">верно</div>';
    for(c=W-1;c>=0;c--)h+='<div class="cell right">'+(c<comp.sig?DIG.charAt(comp.res[c]):'')+'</div>';
    h+='<div class="cell base"><sub>'+t.base+'</sub></div>';
  }
  return h+'</div>';
}

 '2-':{chips:['0 − 0 = 0','1 − 0 = 1','1 − 1 = 0','10₂ − 1 = 1'],note:'Заняли 1 в старшем разряде — сюда она приходит как <b class="recv">10<sub>2</sub> = 1 + 1 = 2</b>. Если слева нуль, занимаем дальше: каждый нуль по пути получает 10<sub>2</sub>, отдаёт 1 вправо — и в нём остаётся <b class="carry">1</b>.'},
 '8+':{chips:['7 + 1 = 10₈','5 + 3 = 10₈','4 + 4 = 10₈','7 + 7 = 16₈'],note:'Сумма равна 8 или больше — пишем «сумма − 8», 1 переносим в старший разряд.'},
 '8-':{chips:['10₈ − 1 = 7','10₈ − 3 = 5','12₈ − 5 = 5'],note:'Заняли 1 в старшем разряде — сюда она приходит как <b class="recv">10<sub>8</sub> = 8</b>. Нуль по пути получает 10<sub>8</sub>, отдаёт 1 вправо — и в нём остаётся <b class="carry">7</b>.'}

function check(){
  var sr=ensureSeries(),cur=sr.cur,t=sr.tasks[sr.idx],comp=compute(t),bad=[],any=false,c;
  if(sr.done||cur.status==='solved'||cur.status==='failed')return;

  if(!any){cur.msg={k:'warn',t:'Сначала введите ответ в клетки под чертой.'};renderSolve();focusCell(0);return;}
  for(c=0;c<comp.W;c++){
    var v=cur.values[c],ok=c<comp.sig?(v===DIG.charAt(comp.res[c])):(v===''||v==='0');
    if(!ok)bad.push(c);
  }
  cur.attempt++;cur.bad=bad;
  var ans='';for(c=comp.W-1;c>=0;c--)ans+=(cur.values[c]===''?'_':cur.values[c]);
  ans=ans.replace(/^_+/,'');
  if(!bad.length){
    cur.status='solved';
    var p=cur.attempt===1?1:0.5;
    sr.results.push({t:t,points:p,tries:cur.attempt,answer:ans});
    cur.msg={k:'ok',t:p===1?'Верно! +1 балл':'Верно со второй попытки. +0,5 балла'};
  }else if(cur.attempt>=2){
    cur.status='failed';
    sr.results.push({t:t,points:0,tries:cur.attempt,answer:ans});
    cur.msg={k:'bad',t:'Пока неверно. Правильный ответ показан зелёным. Похожий пример можно разобрать по шагам в режиме «Смотрю».'};
  }else{
    cur.status='retry';
    cur.msg={k:'bad',t:'Есть ошибка: неверные разряды выделены цветом. Исправьте и проверьте ещё раз (вторая попытка — 0,5 балла).'};
  }
  state.saved=false;
  renderSolve();renderLevels();
  if(cur.status==='retry')focusCell(bad[0]);
}
function nextTask(){
  var sr=ensureSeries(),S=state.solve[state.level];
  if(sr.idx+1<sr.tasks.length){sr.idx++;sr.cur=newCur(sr.tasks[sr.idx]);renderSolve();focusCell(0);}
  else{
    sr.done=true;
    S.history.push({results:sr.results.slice(),n:sr.tasks.length,time:new Date()});
    renderSolve();
  }
  renderLevels();
}

/* ===================== ИТОГОВАЯ ОЦЕНКА ===================== */
var overlay=document.getElementById('overlay'),modal=document.getElementById('modal');
function two(n){return n<10?'0'+n:''+n;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function showTotal(){
  var T=totals(),d=new Date(),i;
  var f=document.getElementById('fio').value.trim(),c=document.getElementById('cls').value.trim();
  var h='<h2>Итоговая оценка</h2><div class="whoami">'+(f?esc(f):'Фамилия не указана')+(c?', '+esc(c):'')+' · обновлено в '+two(d.getHours())+':'+two(d.getMinutes())+'</div><table>';
  for(i=0;i<T.rows.length;i++){
    var r=T.rows[i];
    h+='<tr><td>'+(i+1)+'. '+r.title+'</td><td class="pts">'+(r.best<0?'не выполнялось':fmt(r.best)+' из '+r.n)+'</td></tr>';
  }
  h+='<tr class="sum"><td>Сумма баллов</td><td class="pts">'+fmt(T.sum)+' из '+T.max+'</td></tr></table>';
  h+='<div class="big"><div class="n">'+T.grade+'</div><div class="of">из 10</div></div>';
  h+='<div class="note" style="text-align:center">По каждому упражнению учитывается лучший результат, невыполненные упражнения — 0 баллов. Решили ещё — нажмите «Итоговая оценка» снова.</div>';
  h+='<div class="ctrl" style="justify-content:center"><button type="button" class="btn primary" data-act="m-close">Закрыть</button><button type="button" class="btn send" data-act="m-send">Отправить учителю</button><button type="button" class="btn save" data-act="m-save">Сохранить (.txt)</button></div>';
  modal.innerHTML=h;overlay.hidden=false;
  var b=modal.querySelector('[data-act="m-close"]');if(b)b.focus();
}
function hideTotal(){overlay.hidden=true;}
overlay.addEventListener('click',function(e){
  if(e.target===overlay){hideTotal();return;}
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.getAttribute('data-act');
  if(a==='m-close')hideTotal();else if(a==='m-send')sendResults();else exportTxt();
});
document.getElementById('totalBtn').addEventListener('click',showTotal);

/* ===================== ТЕМЫ, СПРАВКА ===================== */
var main=document.getElementById('main'),levelsEl=document.getElementById('levels'),helpBody=document.getElementById('helpBody');
function renderLevels(){
  var h='',i;
  levelsEl.style.gridTemplateColumns='repeat(4,1fr)';
  if(state.mode==='watch'){
    for(i=0;i<WT.length;i++)h+='<button type="button" data-level="'+i+'" class="'+(i===state.wsel?'on':'')+'"><b>'+WT[i].base+' СС</b>'+opName(WT[i].op)+' ('+opSign(WT[i].op)+')</button>';
  }else{
    for(i=0;i<EX.length;i++){
      var S=state.solve[i],b='',best=-1,k;
      for(k=0;k<S.history.length;k++)best=Math.max(best,points(S.history[k].results));
      if(S.series&&!S.series.done&&S.series.results.length)b='<span class="badge run">пример '+Math.min(S.series.results.length+1,S.series.tasks.length)+' из '+S.series.tasks.length+'</span>';
      else if(best>=0)b='<span class="badge">'+fmt(best)+' из '+EX[i].n+'</span>';
      h+='<button type="button" data-level="'+i+'" class="'+(i===state.level?'on':'')+'">'+b+'<b>Упражнение '+(i+1)+'</b>'+EX[i].title+'<small>'+EX[i].hint+'</small></button>';
    }
  }
  levelsEl.innerHTML=h;
}
function curBase(){return state.mode==='watch'?WT[state.wsel].base:EX[state.level].base;}
function renderHelp(){
  var base=curBase(),h='';
  h+='<p><b>Сложение.</b> Складываем цифры разряда (и перенос, если он есть). Если сумма меньше основания — записываем её. Если сумма равна основанию или больше — записываем «сумма − основание», а 1 переносим в старший разряд.</p>';
  h+='<p><b>Вычитание.</b> Если из цифры уменьшаемого нельзя вычесть цифру вычитаемого, занимаем 1 в старшем разряде. В младшем разряде она превращается в <b class="recv">10</b> — в 2 СС это 10<sub>2</sub> = 1 + 1 = 2, в 8 СС это 10<sub>8</sub> = 8 единиц. '+
     'Если в старшем разряде нуль, занимаем ещё левее: нуль получает 10 и сразу отдаёт 1 вправо — в нём остаётся <b class="carry">'+(base===2?'1':'7')+'</b>.</p>';
  if(base===2){
    h+='<table class="mono"><tr><td>0 + 0 = 0</td><td>0 + 1 = 1</td><td>1 + 0 = 1</td><td>1 + 1 = 10</td><td>1 + 1 + 1 = 11</td></tr>'+
       '<tr><td>0 − 0 = 0</td><td>1 − 0 = 1</td><td>1 − 1 = 0</td><td>10 − 1 = 1</td><td></td></tr></table>';
    h+='<p><b>Пример 100<sub>2</sub> − 1<sub>2</sub>.</b> Младший разряд: 0 − 1 — занимаем. Средний разряд — 0, идём к старшему: 1 → 0. Средний получает 10<sub>2</sub> = 2, отдаёт 1 вправо — в нём остаётся 1. Младший получает 10<sub>2</sub> = 2: 2 − 1 = 1. Ответ: 11<sub>2</sub> (проверка: 4 − 1 = 3).</p>';
  }else{
    h+='<p>Цифры 8 СС: 0–7. Пример: 5 + 6 = 11; 11 ≥ 8, значит 11 − 8 = 3 пишем, 1 переносим: 5<sub>8</sub> + 6<sub>8</sub> = 13<sub>8</sub>.</p>'+
       '<p>Заём: 2 − 5 вычесть нельзя, занимаем: 2 + 10<sub>8</sub> = 12<sub>8</sub> = 2 + 8 = 10; 10 − 5 = 5.</p>'+
       '<p><b>Пример 100<sub>8</sub> − 1<sub>8</sub>.</b> Средний разряд — 0: получает 10<sub>8</sub> = 8, отдаёт 1 вправо — остаётся 7. Младший получает 10<sub>8</sub> = 8: 8 − 1 = 7. Ответ: 77<sub>8</sub> (проверка: 64 − 1 = 63).</p>';
  }
  h+='<p><b>Самопроверка:</b> переведите оба числа и ответ в десятичную систему и выполните действие.</p>';
  helpBody.innerHTML=h;
}
function render(){
  var mb=document.querySelectorAll('#modes button');
  for(var i=0;i<mb.length;i++)mb[i].className=(mb[i].getAttribute('data-mode')===state.mode?'on':'');
  renderLevels();renderHelp();
  if(state.mode==='watch')renderWatch();
  else{renderSolve();var sr=ensureSeries();if(!sr.done&&sr.cur.status==='input'&&sr.cur.attempt===0)focusCell(firstEmpty(sr.cur));}
}
function firstEmpty(cur){for(var c=0;c<cur.values.length;c++)if(cur.values[c]==='')return c;return 0;}
/* Смена режима открывает ту же СС и то же действие; данные не сбрасываются */
function switchMode(m){
  if(m===state.mode)return;
  if(m==='watch')state.wsel=state.level;else state.level=state.wsel;
  state.mode=m;render();
}

/* ===================== ВВОД ===================== */
document.getElementById('modes').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  switchMode(b.getAttribute('data-mode'));
});
levelsEl.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(state.mode==='watch')state.wsel=+b.getAttribute('data-level');
  else state.level=+b.getAttribute('data-level');
  render();
});
main.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  var act=b.getAttribute('data-act'),w,sr;
  if(act.charAt(0)==='w'){
    w=ensureWatch();var K=w.comp.steps.length;
    if(act==='w-next')w.step=Math.min(K+1,w.step+1);
    else if(act==='w-prev')w.step=Math.max(0,w.step-1);
    else if(act==='w-end')w.step=K+1;
    else if(act==='w-reset')w.step=0;
    else if(act==='w-new')nextWatch();
    renderWatch();return;
  }
  if(act==='mark'){
    sr=ensureSeries();var col=+b.getAttribute('data-col');
    sr.cur.marks[col]=!sr.cur.marks[col];
    b.classList.toggle('on',sr.cur.marks[col]);
    b.textContent=sr.cur.marks[col]?'1':'';
    return;
  }
  if(act==='s-check')check();
  else if(act==='s-next')nextTask();
  else if(act==='s-restart'){
    sr=ensureSeries();
    if(!sr.done&&sr.results.length&&!window.confirm('Начать серию заново? Решённые примеры этой серии не попадут в отчёт.'))return;
    state.solve[state.level].series=null;render();
  }
  else if(act==='total')showTotal();
});
main.addEventListener('input',function(e){
  var el=e.target;if(!el.classList)return;
  if(el.classList.contains('markin')){
    var srm=ensureSeries();el.value=el.value.replace(/[^0-9]/g,'');
    srm.cur.marks[+el.getAttribute('data-col')]=el.value;return;
  }
  if(!el.classList.contains('inp'))return;
  var sr=ensureSeries(),cur=sr.cur,col=+el.getAttribute('data-col'),base=sr.tasks[sr.idx].base;
  var raw=el.value.replace(/\s/g,''),ch=raw?raw.charAt(raw.length-1):'';
  var v=ch===''?-1:DIG.indexOf(ch.toUpperCase());
  var i=cur.bad.indexOf(col);if(i>=0)cur.bad.splice(i,1);
  el.classList.remove('bad');
  var box=main.querySelector('.msg.warn.typed');if(box)box.parentNode.removeChild(box);
  if(ch!==''&&v>=0&&v<base){
    el.value=ch;cur.values[col]=ch;
    var nx=main.querySelector('input.inp[data-col="'+(col+1)+'"]');
    if(nx&&nx.value===''){nx.focus();}
  }else{
    el.value='';cur.values[col]='';
    if(ch!==''){
      var m=document.createElement('div');m.className='msg warn typed';
      m.textContent='В '+base+' СС нет цифры «'+ch+'».';
      el.closest('.card').appendChild(m);
    }
  }
});
main.addEventListener('focusin',function(e){if(e.target.classList&&e.target.classList.contains('inp'))e.target.select();});
main.addEventListener('keydown',function(e){
  var el=e.target;
  if(el.classList&&el.classList.contains('inp')){
    var col=+el.getAttribute('data-col');
    if(e.key==='Enter'){e.preventDefault();check();}
    else if(e.key==='ArrowLeft'){e.preventDefault();focusCell(col+1);}
    else if(e.key==='ArrowRight'){e.preventDefault();focusCell(col-1);}
    else if(e.key==='Backspace'&&el.value===''){e.preventDefault();focusCell(col-1);}
  }
});
document.addEventListener('keydown',function(e){
  if(!overlay.hidden){if(e.key==='Escape')hideTotal();return;}
  if(state.mode!=='watch')return;
  var tg=(e.target.tagName||'').toLowerCase();
  if(tg==='input'||tg==='select'||tg==='textarea')return;
  var w=ensureWatch(),K=w.comp.steps.length;
  if(e.key==='ArrowRight'){e.preventDefault();w.step=Math.min(K+1,w.step+1);renderWatch();}
  else if(e.key==='ArrowLeft'){e.preventDefault();w.step=Math.max(0,w.step-1);renderWatch();}
});

/* ===================== ОТЧЁТ ===================== */
function plain(t){return t.a+'('+t.base+') '+(t.op==='+'?'+':'-')+' '+t.b+'('+t.base+') = '+compute(t).resStr+'('+t.base+')';}
function seriesLines(results,n,doneFlag,k){
  var p=points(results),out=[];
  out.push('  Серия '+k+(doneFlag?' (завершена): баллов '+fmt(p)+' из '+n:' (не завершена): решено примеров '+results.length+' из '+n+', баллов '+fmt(p)));
  for(var i=0;i<results.length;i++){
    var r=results[i];
    out.push('    '+(i+1)+') '+plain(r.t)+' — '+(r.points===1?'верно с 1-й попытки (1 балл)':(r.points===0.5?'верно со 2-й попытки (0,5 балла)':'неверно, ответ ученика: '+(r.answer||'-')+' (0 баллов)')));
  }
  return out;
}
/* Подробности по упражнениям; null — если ничего не решено */
function detailLines(){
  var L=[],any=false,i,k;
  for(i=0;i<EX.length;i++){
    var S=state.solve[i],lines=[];
    for(k=0;k<S.history.length;k++)lines=lines.concat(seriesLines(S.history[k].results,S.history[k].n,true,k+1));
    if(S.series&&!S.series.done&&S.series.results.length)lines=lines.concat(seriesLines(S.series.results,S.series.tasks.length,false,S.history.length+1));
    L.push('Упражнение '+(i+1)+'. '+EX[i].title);
    if(lines.length){any=true;L=L.concat(lines);}else L.push('  не выполнялось');
  }
  return any?L:null;
}
function whoOk(){
  var fio=document.getElementById('fio'),cls=document.getElementById('cls');
  var f=fio.value.trim(),c=cls.value.trim();
  fio.classList.toggle('need',!f);cls.classList.toggle('need',!c);
  if(!f||!c){hideTotal();(f?cls:fio).focus();window.alert('Заполните поля «Фамилия, имя» и «Класс».');return null;}
  return {f:f,c:c};
}
function exportTxt(){
  var w=whoOk();if(!w)return;
  var det=detailLines();
  if(!det){window.alert('Пока нечего сохранять: решите хотя бы один пример в режиме «Решаю сам».');return;}
  var d=new Date(),L=[],i,T=totals();
  L.push('ТРЕНАЖЁР «Арифметика в двоичной и восьмеричной системах счисления»');
  L.push('Ученик: '+w.f);L.push('Класс: '+w.c);
  L.push('Дата: '+two(d.getDate())+'.'+two(d.getMonth()+1)+'.'+d.getFullYear()+', '+two(d.getHours())+':'+two(d.getMinutes()));
  L.push('');
  L.push('ИТОГОВАЯ ОЦЕНКА: '+T.grade+' из 10 (сумма баллов '+fmt(T.sum)+' из '+T.max+')');
  for(i=0;i<T.rows.length;i++)L.push('  Упражнение '+(i+1)+'. '+T.rows[i].title+': '+(T.rows[i].best<0?'не выполнялось':fmt(T.rows[i].best)+' из '+T.rows[i].n));
  L.push('Оценивание: верно с 1-й попытки — 1 балл, со 2-й — 0,5 балла; по каждому упражнению учитывается лучший результат.');
  L.push('');L.push('ПОДРОБНО');L=L.concat(det);
  var blob=new Blob(['\ufeff'+L.join('\r\n')],{type:'text/plain;charset=utf-8'});
  var name=(w.f+'_'+w.c+'_арифметика_2_8_СС').replace(/[\\\/:*?"<>|]+/g,'').replace(/\s+/g,'_')+'.txt';
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();
  setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(a.href);},500);
  state.saved=true;
}
document.getElementById('saveBtn').addEventListener('click',exportTxt);

/* ===================== ОТПРАВКА В GOOGLE-ТАБЛИЦУ ===================== */
var toastEl=document.getElementById('toast'),toastTimer=null;
function toast(text,kind){
  toastEl.className='toast '+kind;toastEl.textContent=text;toastEl.hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){toastEl.hidden=true;},6000);
}
function sendResults(){
  if(state.sending)return;
  var w=whoOk();if(!w)return;
  var det=detailLines();
  if(!det){window.alert('Пока нечего отправлять: решите хотя бы один пример в режиме «Решаю сам».');return;}
  if(SCRIPT_URL.indexOf('https://')!==0){toast('Ссылка для отправки не настроена. Сохраните результат в файл (.txt).','bad');return;}
  var T=totals(),ex=[];
  for(var i=0;i<T.rows.length;i++)ex.push(T.rows[i].best<0?'':T.rows[i].best);
  var payload={fio:w.f,cls:w.c,grade:T.grade,sum:T.sum,max:T.max,ex:ex,details:det.join('\n')};
  state.sending=true;toast('Отправляю…','info');
  fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})
    .then(function(){state.saved=true;toast('Результат отправлен учителю: '+T.grade+' из 10.','ok');})
    .catch(function(){toast('Не удалось отправить (нет интернета?). Сохраните результат в файл (.txt).','bad');})
    .then(function(){state.sending=false;});
}
document.getElementById('sendBtn').addEventListener('click',sendResults);
window.addEventListener('beforeunload',function(e){if(!state.saved){e.preventDefault();e.returnValue='';}});

/* поля ученика не должны «помнить» предыдущего */
document.getElementById('fio').value='';document.getElementById('cls').value='';
['fio','cls'].forEach(function(id){document.getElementById(id).addEventListener('input',function(){this.classList.remove('need');});});

/* для автотестов */
window.__trainer={compute:compute,cand:cand,gen:gen,genSeries:genSeries,EX:EX,WT:WT,logLine:logLine,totals:totals,state:state,render:render};

render();
})();
</script>
</body>
