.level h3{margin-top:.2em}

.tagA{background:var(--green-soft);color:var(--green)}.tagB{background:var(--blue-soft);color:var(--blue)}.tagC{background:var(--violet-soft);color:var(--violet)}.tagS{background:var(--orange-soft);color:var(--orange)}
.io{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:640px}
.io div b{display:block;font-size:.9rem;color:var(--muted)}
.check{background:var(--blue-soft);border-radius:10px;padding:10px 14px;margin-top:10px}
.check input,.check select{font-family:"JetBrains Mono",Consolas,monospace;font-size:1rem;padding:6px 10px;border:2px solid var(--line);border-radius:8px;width:150px}
.check .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:6px 0}

@media (max-width:760px){
  html{font-size:17px}

  .student .grow{flex-basis:100%}
  .panel{padding:14px 12px}
  .answer input{min-width:0;width:100%}
  pre.code{font-size:.82rem}
  .theory table,.review{display:block;overflow-x:auto}
}
.idx td,.idx th{text-align:center!important;min-width:2.4em}
.idx th{background:var(--blue-soft)}
.idx tr.neg td{color:var(--muted);font-size:.9em}
.plist{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--green-soft);border:2px solid #9cc9b2;border-radius:12px;padding:10px 14px;margin:10px 0 14px}
.plist input{font-family:"JetBrains Mono",Consolas,monospace;font-size:1.05rem;padding:7px 10px;border:2px solid #9cc9b2;border-radius:8px;background:#fff;flex:1;min-width:0}
.check .row label{min-width:13em}
@media (max-width:760px){.check .row label{min-width:0;flex-basis:100%}.check input{width:100%!important}}

<body>
<header>
  <div class="wrap">
    <h1>📋 Повторяем списки в Python</h1>
    <p>Учебник-тренажёр: создание списка и индексы · append() · перебор списка циклом · поиск минимума и суммы — база для сортировок</p>
  </div>
</header>

<div class="wrap">
  <div class="student">
    <label for="fio">Фамилия, имя:</label>
    <input id="fio" type="text" autocomplete="off" name="fio_nosave">
    <label for="cls">Класс:</label>
    <select id="cls"><option value="">— выбери —</option><option>10А</option><option>10Б</option></select>
    <span class="grow"></span>
    <span id="saveState" class="note"></span>
  </div>

  <nav class="tabs" id="tabs"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============ утилиты ============ */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const L=(...l)=>l.join('\n');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const pf=v=>Number.isInteger(v)?v+'.0':String(v); // как Python печатает float
const rl=(n,a,b)=>Array.from({length:n},()=>R(a,b));                                // n случайных чисел
const ru=(n,a,b)=>shuffle(Array.from({length:b-a+1},(_,i)=>a+i)).slice(0,n);        // n разных чисел
const PL=a=>'['+a.map(v=>typeof v==='string'?`'${v}'`:String(v)).join(', ')+']';   // как Python печатает список
function rng(a,b,s){const r=[];if(s>0)for(let i=a;i<b;i+=s)r.push(i);else for(let i=a;i>b;i+=s)r.push(i);return r;}
function hl(code){
  const re=/(#.*$)|('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*")|\b(if|elif|else|for|in|while|and|or|not|True|False|from|import|None)\b|\b(print|input|int|float|str|range|map|len|list|sum|min|max|randint|append|index|count|split|insert|pop|remove|extend|copy|clear|sort|abs)\b|(\b\d+(?:\.\d+)?\b)/g;
  return code.split('\n').map(line=>{
    let out='',last=0;
    line.replace(re,(m,c,s,k,f,n,off)=>{
      out+=esc(line.slice(last,off));last=off+m.length;
      const cls=c?'tc':s?'ts':k?'tk':f?'tf':'tn';
      out+=`<span class="${cls}">${esc(m)}</span>`;return m;});
    out+=esc(line.slice(last));
    return out;
  });
}
function codeBlock(code,nums){
  const lines=hl(code);
  if(nums) return `<pre class="code nums">${lines.map(l=>`<span class="ln">${l}</span>`).join('\n')}</pre>`;
  return `<pre class="code">${lines.join('\n')}</pre>`;
}
function trace(head,rows){
  return `<table><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table>`;
}
/* таблица «индекс — элемент» */
function IT(a,name,neg){name=name||'a';
  return `<table class="idx"><tr><th>i</th>${a.map((_,i)=>`<td>${i}</td>`).join('')}</tr><tr><th>${name}[i]</th>${a.map(v=>`<td><b>${esc(typeof v==='string'?"'"+v+"'":v)}</b></td>`).join('')}</tr>${neg?`<tr class="neg"><th>i с конца</th>${a.map((_,i)=>`<td>${i-a.length}</td>`).join('')}</tr>`:''}</table>`;}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',2600);}

/* ============ генераторы заданий ============
   kind:'input' — ответ вводится; kind:'choice' — выбор варианта (ans — индекс)
   seq:true — последовательность через пробел; lst:true — ответ в виде списка Python
*/
const G={make:[],app:[],loop:[],min:[]};
const OUT='Что появится на экране? Впиши вывод программы.';
const OUTL='Что появится на экране? Впиши вывод программы — вместе с квадратными скобками и запятыми.';

/* ---------- 1. Создание списка и индексы ---------- */
G.make.push(function(){ // положительный индекс
  const n=R(5,8),a=rl(n,-9,50),k=R(1,n-1);
  return {kind:'input',text:OUT,code:L(`a = ${PL(a)}`,`print(a[${k}])`),ans:String(a[k]),
    explain:`Индексы начинаются с <b>нуля</b>: первый элемент — a[0], поэтому a[${k}] — это ${k+1}-й по счёту элемент.${IT(a)}a[${k}] = ${a[k]}.`};
});
G.make.push(function(){ // отрицательный индекс
  const n=R(5,8),a=rl(n,-9,50),k=R(1,3);
  return {kind:'input',text:OUT,code:L(`a = ${PL(a)}`,`print(a[-${k}])`),ans:String(a[n-k]),
    explain:`Отрицательный индекс считает с конца: a[-1] — последний элемент, a[-2] — предпоследний. a[-${k}] = a[${n} − ${k}] = a[${n-k}] = ${a[n-k]}.${IT(a,'a',true)}`};
});
G.make.push(function(){ // выражение из элементов
  const n=R(5,7),a=rl(n,1,30),i=R(0,n-2);
  if(Math.random()<.5)return {kind:'input',text:OUT,code:L(`a = ${PL(a)}`,`print(a[${i}] + a[-1])`),ans:String(a[i]+a[n-1]),
    explain:`a[${i}] = ${a[i]}, a[-1] — последний элемент, ${a[n-1]}. Сумма: ${a[i]} + ${a[n-1]} = ${a[i]+a[n-1]}.${IT(a)}`};
  return {kind:'input',text:OUT,code:L(`a = ${PL(a)}`,'print(a[len(a) - 1] - a[0])'),ans:String(a[n-1]-a[0]),
    explain:`len(a) = ${n}, значит a[len(a) − 1] = a[${n-1}] — <b>последний</b> элемент (${a[n-1]}). a[0] = ${a[0]}. Разность: ${a[n-1]} − ${a[0]} = ${a[n-1]-a[0]}.`};
});
G.make.push(function(){ // len
  const v=R(1,4);
  if(v===1){const a=rl(R(4,9),0,20);return {kind:'input',text:OUT,code:L(`a = ${PL(a)}`,'print(len(a))'),ans:String(a.length),
    explain:`<code>len()</code> — количество элементов списка, здесь их ${a.length}. Обрати внимание: последний индекс на 1 меньше — ${a.length-1}.`};}
  if(v===2){const x=R(0,9),n=R(3,8);return {kind:'input',text:OUT,code:L(`t = [${x}] * ${n}`,'print(len(t))'),ans:String(n),
    explain:`<code>[${x}] * ${n}</code> — список из ${n} одинаковых элементов: ${PL(Array(n).fill(x))}. Длина — ${n}.`};}
  if(v===3){const p=R(1,10),q=p+R(3,9);return {kind:'input',text:OUT,code:L(`b = [i for i in range(${p}, ${q})]`,'print(len(b))'),ans:String(q-p),
    explain:`range(${p}, ${q}) даёт числа от ${p} до ${q-1} (правая граница не входит) — всего ${q} − ${p} = ${q-p} чисел.`};}
  const p=R(0,5),s=R(2,4),q=p+s*R(3,6)+R(0,1),arr=rng(p,q,s);
  return {kind:'input',text:OUT,code:L(`c = [i for i in range(${p}, ${q}, ${s})]`,'print(len(c))'),ans:String(arr.length),
    explain:`range(${p}, ${q}, ${s}) даёт числа ${arr.join(', ')} — всего ${arr.length}.`};
});
G.make.push(function(){ // генератор списка
  const v=R(1,4);let code,arr,ex;
  if(v===1){const k=R(2,5),n=R(4,6);arr=rng(0,n,1).map(i=>i*k);code=`a = [i * ${k} for i in range(${n})]`;ex=`i принимает значения ${rng(0,n,1).join(', ')}, каждое умножается на ${k}.`;}
  else if(v===2){const n=R(4,6);arr=rng(1,n+1,1).map(i=>i*i);code=`a = [i ** 2 for i in range(1, ${n+1})]`;ex=`i = ${rng(1,n+1,1).join(', ')}; в список попадают их квадраты.`;}
  else if(v===3){const m=pick([3,4,5]),p=R(1,5),q=p+R(10,16);arr=rng(p,q,1).filter(i=>i%m===0);code=`a = [i for i in range(${p}, ${q}) if i % ${m} == 0]`;ex=`Перебираются числа от ${p} до ${q-1}, в список попадают только делящиеся на ${m}.`;}
  else{const c=R(1,9),n=R(3,5);arr=rng(0,n,1).map(i=>i+c);code=`a = [i + ${c} for i in range(${n})]`;ex=`i = ${rng(0,n,1).join(', ')}; к каждому прибавляется ${c}.`;}
  return {kind:'input',lst:true,text:OUTL,code:L(code,'print(a)'),ans:PL(arr),
    explain:`Генератор списка: <code>[выражение for i in …]</code>. ${ex} <code>print(a)</code> выводит список в квадратных скобках через запятую.`};
});

];

function makeTasks(mod,n){
  let gens=[];
  if(mod==='final'){const per=Math.ceil(n/TOPICS.length);TOPICS.forEach(m=>{gens.push(...shuffle(G[m]).slice(0,per).map(g=>({g,m})));});gens=shuffle(gens).slice(0,n);}
  else{let pool=[];while(pool.length<n)pool.push(...shuffle(G[mod]));gens=pool.slice(0,n).map(g=>({g,m:mod}));}
  return gens.map(x=>Object.assign(x.g(),{mod:x.m}));
}
function newSession(mod,mode){return {tasks:makeTasks(mod,mode==='learn'?LEARN_N:CTRL_N),idx:0,ans:[],checked:false,sel:null,started:mode==='learn',done:false,logged:false};}

/* ============ проверка ответа ============ */
const LOOKALIKE={A:'А',B:'В',C:'С',E:'Е',H:'Н',K:'К',M:'М',O:'О',P:'Р',T:'Т',X:'Х',a:'а',c:'с',e:'е',o:'о',p:'р',x:'х',y:'у'};
function normalize(s,seq){
  s=String(s).replace(/\u00a0/g,' ').trim();
  if(seq)s=s.replace(/[,;]/g,' ');
  s=s.replace(/[ABCEHKMOPTXaceopxy]/g,ch=>LOOKALIKE[ch]); // латинские буквы-двойники → русские
  return s.replace(/\s+/g,' ');
}
const flat=s=>normalize(s).replace(/\s+/g,'').replace(/"/g,"'");
function isCorrect(t,given){
  if(t.kind==='choice')return given===t.ans;
  if(t.lst)return flat(given)===flat(t.ans);
  return normalize(given,t.seq)===normalize(t.ans,t.seq);
}
function quoteHint(t,given){
  if(t.kind!=='input')return '';
  const g=normalize(given,t.seq);
  if(t.lst&&!g.startsWith('['))return '<br>💡 <code>print(a)</code> выводит список <b>в квадратных скобках, через запятую</b>. Без скобок, через пробел, выводит <code>print(*a)</code>.';
  if(!t.lst&&g.startsWith('['))return '<br>💡 Здесь выводится не список целиком, а отдельные значения — без квадратных скобок.';
  if(normalize(t.ans).includes('.0')&&g+'.0'===normalize(t.ans))return '<br>💡 Обрати внимание на тип: результат — вещественное число (float).';
  return '';
}

function progressBar(s,mode){

}
function taskBody(t){
  let h=`<div class="q">${t.text}</div>`;
  if(t.code)h+=codeBlock(t.code,t.nums);
  if(t.input)h+=`<div class="given">⌨️ Пользователь вводит: <kbd>${esc(t.input)}</kbd>${t.inputNote?` <span class="note">(${t.inputNote})</span>`:''}</div>`;

}
function taskHTML(mode){
  const s=S.sess[S.mod][mode];
  if(mode==='control'&&!s.started){

      return `<button type="button" data-i="${i}" class="${t.mono?'mono':''} ${c}" ${s.checked?'disabled':''}>${esc(o)}</button>`;}).join('')+`</div>`;

  else{const a=s.ans[s.idx];
    h+=`<div class="fb ${a.ok?'ok':'no'}"><b class="t">${a.ok?'✔ Верно!':'✘ Не совсем.'}</b>${a.ok?'':` Правильный ответ: <code>${esc(t.kind==='choice'?t.opts[t.ans]:t.ans)}</code>`}${a.ok?'':quoteHint(t,a.given)}<div style="margin-top:6px">${t.explain}</div>${!a.ok&&S.mod!=='final'?'<div style="margin-top:8px"><button type="button" class="btn sec" id="toTheory">📘 Открыть справку по теме</button></div>':''}</div>
    <div class="answer"><button type="button" class="btn" id="nxt">${s.idx+1<s.tasks.length?'Следующее задание →':'Итоги серии →'}</button></div>`;}

function grade(c,n){return n?Math.round(c/n*10):0;}
const hasAns=r=>r!==null&&r!==undefined&&String(r).trim()!=='';
function ctrlHTML(s){
  if(!s.resp)s.resp=s.tasks.map(()=>null);

  }else{
    h+=`<div class="answer"><input type="text" id="ansIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Твой ответ" value="${hasAns(r)?esc(r):''}"></div>`;
  }

function bindCtrl(s){
  const area=document.getElementById('taskArea');
  const upd=()=>{const b=area.querySelector(`.cnav button[data-k="${s.idx}"]`);if(b)b.classList.toggle('done',hasAns(s.resp[s.idx]));document.getElementById('cntDone').textContent=s.resp.filter(hasAns).length;};
  const go=k=>{if(k<0||k>=s.tasks.length)return;s.idx=k;s.confirm=false;render();};
  area.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{s.resp[s.idx]=+b.dataset.i;area.querySelectorAll('.opts button').forEach(x=>x.classList.toggle('sel',+x.dataset.i===s.resp[s.idx]));upd();});
  const inp=document.getElementById('ansIn');
  if(inp){if(!s.confirm)inp.focus();inp.oninput=()=>{s.resp[s.idx]=inp.value;upd();};inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go(s.idx+1);}};}
  area.querySelectorAll('.cnav button').forEach(b=>b.onclick=()=>go(+b.dataset.k));
  document.getElementById('cPrev').onclick=()=>go(s.idx-1);

  document.getElementById('finCtrl').onclick=()=>{s.confirm=true;render();};
  const y=document.getElementById('finYes');if(y)y.onclick=()=>finishCtrl(s);

function finishCtrl(s){

  s.ans=s.tasks.map((t,i)=>hasAns(s.resp[i])?{given:s.resp[i],ok:isCorrect(t,s.resp[i]),skip:false}:{given:null,ok:false,skip:true});

  sendResults('sendMsg');

function summaryHTML(s,mode){
  const c=s.ans.filter(a=>a.ok).length,n=s.tasks.length;
  let h=`<div class="summary">`;
  if(mode==='learn'){h+=`<h3>Серия завершена!</h3><div class="big" style="color:var(--blue)">${c} из ${n}</div><p>${c===n?'Отлично — всё верно! 🎉':c>=n*0.7?'Хороший результат. Посмотри ещё раз задания, где были ошибки.':'Перечитай справку и попробуй новую серию — задания будут другими.'}</p>
    <button type="button" class="btn" id="again">Новая серия заданий</button></div>`;return h;}

function bubblePass(a){a=a.slice();let k=0;for(let i=0;i<a.length-1;i++)if(a[i]>a[i+1]){[a[i],a[i+1]]=[a[i+1],a[i]];k++;}return {k,a};}
const PYT={
 '1':{name:'Задача 1',tag:'tagA',lvl:'append + перебор',fields:['Длина списка chet','Сумма элементов chet'],
   solve:a=>{const c=a.filter(x=>x%2===0);return [String(c.length),String(c.reduce((p,x)=>p+x,0))];}},
 '2':{name:'Задача 2',tag:'tagB',lvl:'минимум и его индекс',fields:['Минимальный элемент','Его индекс'],
   solve:a=>{let im=0;for(let i=1;i<a.length;i++)if(a[i]<a[im])im=i;return [String(a[im]),String(im)];}},
 'S':{name:'Задача ★',tag:'tagS',lvl:'шаг к сортировке',fields:['Количество обменов','Список после прохода'],
   solve:a=>{const r=bubblePass(a);return [String(r.k),r.a.join(' ')];}}
};

    ['Чётные элементы примера: 4, 10, −2. Их 3, сумма 4 + 10 + (−2) = 12.','Перебор: <code>for x in a:</code>, условие <code>if x % 2 == 0:</code>, внутри <code>chet.append(x)</code>. После цикла — <code>print(len(chet))</code> и <code>print(sum(chet))</code>.'])}
  ${lv('2','<p>Найди <b>минимальный</b> элемент списка и его <b>индекс</b> — без функций <code>min()</code> и <code>index()</code>, с помощью цикла. Если минимальных элементов несколько, выведи индекс первого. Выведи минимум, а на следующей строке — его индекс.</p>',[['Ввод (пример)','8 3 -5 7 -5 2'],['Вывод','-5\n2']],
    ['Запоминай индекс «рекордсмена»: <code>im = 0</code>, затем <code>for i in range(1, len(a)):</code> и <code>if a[i] &lt; a[im]:</code> <code>im = i</code>. В конце выведи <code>a[im]</code> и <code>im</code>.','Почему знак <code>&lt;</code>, а не <code>&lt;=</code>? С <code>&lt;=</code> в примере получится индекс 4 — последнего из минимумов, а нужен первый.'])}
  ${lv('S','<p>Сделай <b>один проход «пузырька»</b>: перебери соседние пары слева направо; если <code>a[i] &gt; a[i + 1]</code> — поменяй элементы местами и увеличь счётчик обменов. Выведи количество обменов, а на следующей строке — список после прохода командой <code>print(*a)</code>.</p>',[['Ввод (пример)','5 1 4 2 8 3'],['Вывод','4\n1 4 2 5 3 8']],

async function sendResults(msgId,manual){
  const say=t=>{const e=document.getElementById(msgId);if(e)e.innerHTML=t;};
  if(!SEND_ON){say(manual?'Отправка не настроена — сохрани файл .txt.':'Не забудь сохранить результаты в файл .txt.');return;}

<tr><td>Генератор с условием</td><td><code>t = [i for i in range(1, 51) if i % 10 == 3]</code></td><td><code>[3, 13, 23, 33, 43]</code></td></tr>
<tr><td>Случайные числа</td><td><code>from random import randint</code><br><code>x = [randint(10, 20) for i in range(5)]</code></td><td>5 чисел от 10 до 20</td></tr>
<tr><td>Ввод в одну строку</td><td><code>a = list(map(int, input().split()))</code></td><td><kbd>3 8 1</kbd> → <code>[3, 8, 1]</code></td></tr>
<tr><td>Ввод в столбик</td><td><code>d = [int(input()) for i in range(5)]</code></td><td>5 чисел, каждое с новой строки</td></tr></table>
<div class="box rule"><b>randint(a, b)</b> включает <b>обе</b> границы: <code>randint(10, 20)</code> может вернуть и 10, и 20.<br><b>range(a, b)</b> правую границу <b>не</b> включает: <code>range(10, 20)</code> — это числа от 10 до 19.</div>
<h3>Вывод списка</h3>
<div class="two"><div>${C(L('x = [1, 2, 3]','print(x)','print(*x)',"print(*x, sep='\\n')"))}</div><div>${OUTB('[1, 2, 3]\n1 2 3\n1\n2\n3')}<p class="cap"><code>print(x)</code> — в скобках через запятую; <code>print(*x)</code> — через пробел; с <code>sep='\\n'</code> — каждый с новой строки.</p></div></div>
<details class="try"><summary>Проверь себя: что выведет программа?</summary>${C(L('a = [7, 3, 9, 1]','print(a[1] + a[-1], len(a))'))}${OUTB('4 4')}<p>a[1] = 3, a[-1] = 1, сумма 4; в списке 4 элемента.</p></details>
`,
app:`
<h3>Метод append()</h3>
<p><code>a.append(x)</code> добавляет <b>один</b> элемент x в <b>конец</b> списка a. Длина списка увеличивается на 1.</p>
<div class="two"><div>${C(L('a = [0, 3, 6]','a.append(9)','print(a)'))}</div><div>${OUTB('[0, 3, 6, 9]')}</div></div>
<div class="box rule"><b>Функция или метод?</b><br>Функция пишется перед списком, а список — в скобках: <code>len(a)</code>, <code>sum(a)</code>, <code>min(a)</code>, <code>max(a)</code>.<br>Метод пишется через точку после имени списка: <code>a.append(5)</code>, <code>a.index(7)</code>, <code>a.count(2)</code>.</div>
<h3>Изменение элемента</h3>
<div class="two"><div>${C(L('a = [4, 8, 15, 16]','a[2] = 100','a[0] += 1','print(a)'))}</div><div>${OUTB('[5, 8, 100, 16]')}<p class="cap">Новое значение записывается на место старого, длина не меняется.</p></div></div>
<h3>Заполнение списка в цикле</h3>
<div class="two"><div>${C(L('a = []','for i in range(5):','    a.append(i * 3)','print(a)'))}${OUTB('[0, 3, 6, 9, 12]')}<p class="cap">Начинаем с пустого списка, на каждом шаге добавляем элемент.</p></div>
<div>${C(L('b = [7, 4, 10, 3, 8]','chet = []','for x in b:','    if x % 2 == 0:','        chet.append(x)','print(chet)'))}${OUTB('[4, 10, 8]')}<p class="cap">Отбор: в новый список попадают только чётные элементы.</p></div></div>
<div class="box warn"><b>Частые ошибки</b><br>• <code>a = []</code>, затем <code>a[0] = 5</code> — IndexError: в пустом списке нет элемента a[0]. Нужно <code>a.append(5)</code>.<br>• <code>a = a.append(5)</code> — метод append ничего не возвращает, и в a окажется <code>None</code>. Пиши просто <code>a.append(5)</code>.<br>• <code>a.append(1, 2)</code> — ошибка: append добавляет только <b>один</b> элемент.</div>
<details class="try"><summary>Другие методы списков (для справки)</summary>
<table><tr><th>Метод</th><th>Что делает</th><th>Пример: x = [1, 2, 3]</th></tr>
<tr><td><code>x.insert(i, b)</code></td><td>вставляет b на место с индексом i</td><td><code>x.insert(1, 9)</code> → [1, 9, 2, 3]</td></tr>
<tr><td><code>x.pop(i)</code></td><td>удаляет элемент с индексом i (без i — последний)</td><td><code>x.pop(0)</code> → [2, 3]</td></tr>
<tr><td><code>x.remove(b)</code></td><td>удаляет первый элемент, равный b</td><td><code>x.remove(3)</code> → [1, 2]</td></tr>
<tr><td><code>x.extend(b)</code></td><td>добавляет в конец все элементы списка b</td><td><code>x.extend([7, 8])</code> → [1, 2, 3, 7, 8]</td></tr>
<tr><td><code>x.count(b)</code></td><td>сколько раз встречается b</td><td><code>x.count(2)</code> → 1</td></tr></table></details>
`,
loop:`
<h3>Два способа перебора</h3>
<div class="two"><div><b>По значениям</b>${C(L('a = [7, 2, 9]','for x in a:',"    print(x, end=' ')"))}${OUTB('7 2 9')}<p class="cap">x получает сами <b>элементы</b>. Удобно, когда важно только значение: сумма, подсчёт, вывод.</p></div>
<div><b>По индексам</b>${C(L('a = [7, 2, 9]','for i in range(len(a)):','    print(i, a[i])'))}${OUTB('0 7\n1 2\n2 9')}<p class="cap">i — <b>номер</b> элемента, a[i] — сам элемент. Нужно, когда важно <b>место</b>: изменить элемент, сравнить соседей, найти позицию.</p></div></div>
<div class="box rule"><code>range(len(a))</code> даёт ровно все индексы списка: от 0 до len(a) − 1.</div>
<h3>Изменение элементов</h3>
<div class="two"><div>${C(L('a = [3, 5, 1]','for i in range(len(a)):','    a[i] = a[i] * 2','print(a)'))}${OUTB('[6, 10, 2]')}</div>
<div><p>Изменить элементы можно только <b>через индекс</b>: <code>a[i] = …</code>.</p><p>Цикл <code>for x in a:</code> с командой <code>x = x * 2</code> меняет лишь переменную x — сам список останется прежним.</p></div></div>
<h3>Подсчёт элементов</h3>
<div class="two"><div>${C(L('a = [12, 7, 30, 5, 18]','k = 0','for x in a:','    if x > 10:','        k += 1','print(k)'))}</div><div>${OUTB('3')}<p class="cap">k — счётчик: до цикла 0, увеличивается на 1, когда условие выполнено.</p></div></div>
<h3>Соседние элементы</h3>
<div class="two"><div>${C(L('a = [4, 9, 2, 7]','for i in range(len(a) - 1):','    if a[i] > a[i + 1]:','        print(a[i], a[i + 1])'))}${OUTB('9 2')}</div>
<div><p>Сравниваем a[i] с <b>правым соседом</b> a[i + 1]. Последняя пара — a[2] и a[3], поэтому i доходит только до len(a) − 2: заголовок <code>range(len(a) - 1)</code>.</p></div></div>
<div class="box link">🔗 Сравнение соседей <code>a[i] &gt; a[i + 1]</code> — основа <b>сортировки пузырьком</b>.</div>
<div class="box warn"><b>Частые ошибки</b><br>• <code>range(len(a) + 1)</code> — на последнем шаге IndexError.<br>• При сравнении соседей <code>range(len(a))</code> — на последнем шаге a[i + 1] выходит за границу.<br>• Путают i и a[i]: <code>print(i)</code> печатает номер, <code>print(a[i])</code> — элемент.<br>• <code>for i in range(a):</code> — ошибка: в range нужно число, например len(a).</div>
`,
min:`
<h3>Сумма элементов</h3>
<div class="two"><div>${C(L('a = [4, -1, 7]','s = 0','for x in a:','    s += x','print(s)'))}${OUTB('10')}</div>
<div>${trace(['x','s'],[['—',0],[4,4],[-1,3],[7,10]])}<p class="cap">До цикла s = 0, на каждом шаге прибавляем очередной элемент. Встроенная функция: <code>sum(a)</code>.</p></div></div>
<p>Среднее арифметическое: <code>sum(a) / len(a)</code> (результат — float).</p>
<h3>Поиск минимума</h3>
<div class="two"><div>${C(L('a = [6, 3, 8, 1, 5]','m = a[0]','for x in a:','    if x < m:','        m = x','print(m)'))}${OUTB('1')}</div>
<div>${trace(['x','x &lt; m?','m'],[[6,'нет',6],[3,'да',3],[8,'нет',3],[1,'да',1],[5,'нет',1]])}</div></div>
<p>1) Считаем «рекордсменом» первый элемент. 2) Сравниваем с ним каждый элемент. 3) Нашли меньше — запоминаем. Для <b>максимума</b> знак меняется на <code>&gt;</code>. Встроенные функции: <code>min(a)</code>, <code>max(a)</code>.</p>
<div class="box warn">Нельзя начинать с <code>m = 0</code>: если все числа положительные, ответ будет 0, хотя такого числа в списке нет. Начальное значение берут из самого списка: <code>m = a[0]</code>.</div>
<h3>Индекс минимума</h3>
<div class="two"><div>${C(L('a = [6, 3, 8, 1, 5]','im = 0','for i in range(1, len(a)):','    if a[i] < a[im]:','        im = i','print(im, a[im])'))}${OUTB('3 1')}</div>
<div><p>Запоминаем не значение, а <b>индекс</b> im. Знак <code>&lt;</code> находит <b>первый</b> из одинаковых минимумов.</p><p>Встроенный способ: <code>a.index(min(a))</code>.</p></div></div>
<h3>Обмен двух элементов</h3>
<div class="two"><div>${C(L('b = [12, 4, 15, 24, 16]','b[1], b[4] = b[4], b[1]','print(b)'))}${OUTB('[12, 16, 15, 24, 4]')}<p class="cap">Параллельное присваивание.</p></div>
<div>${C(L('x = b[1]','b[1] = b[4]','b[4] = x'))}<p class="cap">Через третью переменную — тот же результат.</p></div></div>
<div class="box warn">Так обменять нельзя: <code>b[1] = b[4]</code>, затем <code>b[4] = b[1]</code> — после первой строки старое значение b[1] потеряно, оба элемента станут равны 16.</div>
<div class="box link">🔗 <b>Сортировка выбором</b>: 1) найти индекс минимума; 2) поменять минимум с первым элементом; 3) повторить для оставшейся части списка. Всё это ты уже умеешь!</div>
<details class="try"><summary>Проверь себя: что выведет программа?</summary>${C(L('a = [9, 4, 7, 2, 6]','im = 0','for i in range(1, len(a)):','    if a[i] < a[im]:','        im = i','a[0], a[im] = a[im], a[0]','print(*a)'))}${OUTB('2 4 7 9 6')}<p>Минимум 2 стоит на индексе 3 и меняется местами с первым элементом 9.</p></details>
`
};
