<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Электронные таблицы: адресация и математические функции</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#f3f3f3;color:#1f2d3a;font-family:"Times New Roman",Times,serif;font-size:21px;line-height:1.3}
/* шапка в стиле Excel */
header{background:#e2efe6;border-bottom:1px solid #b9d7c3;padding:7px 16px;display:flex;align-items:center;gap:12px}
.xlico{flex:none;width:34px;height:34px;border-radius:6px;background:#2e8b57;color:#fff;font:bold 20px Calibri,Arial,sans-serif;display:flex;align-items:center;justify-content:center}
header h1{margin:0;font-size:24px;color:#185c37}
#top{background:#fff;border-bottom:1px solid #d4d4d4;padding:6px 16px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;position:sticky;top:0;z-index:20}
.who{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-weight:bold}
.who input,.who select{font:inherit;font-weight:normal;font-size:20px;padding:3px 8px;border:1px solid #9cb8a5;border-radius:4px;color:#1f2d3a;background:#fff}
#fio{width:240px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{font:inherit;font-size:19px;padding:5px 14px;border-radius:5px;cursor:pointer;background:#fff}
#viewTabs button{border:2px solid #9fbfe6;color:#1f5fa8}
#viewTabs button.on{background:#2f76c0;border-color:#2f76c0;color:#fff;font-weight:bold}
#modTabs button{border:2px solid #a8d1b5;color:#1d6b40}
#modTabs button.on{background:#2e8b57;border-color:#2e8b57;color:#fff;font-weight:bold}
#modTabs.off{display:none}
#saveTxt{border:2px solid #d4d4d4;color:#3a4a5a}
#sendBtn{border:2px solid #e0a43a;color:#8a5200;font-weight:bold}
.sendst{font-size:17px;color:#5a6b7a}.sendst.ok{color:#1d6b40;font-weight:bold}.sendst.bad{color:#a0600a;font-weight:bold}
.finbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;padding-top:8px;border-top:1px solid #e1e1e1}
.btn.fin{background:#fff;color:#8a5200;border:2px solid #e0a43a}
.btn.fin:hover{background:#fff8e1}
#msg{width:100%;color:#a0600a;font-weight:bold}
#msg:empty{display:none}
main{max-width:1100px;margin:0 auto;padding:12px 12px 40px}
.card{background:#fff;border:1px solid #d4d4d4;border-radius:6px;padding:12px 16px;margin-bottom:12px}
h2{margin:0 0 8px;font-size:24px;color:#185c37}
h3{margin:2px 0 6px;font-size:21px;color:#185c37}
p{margin:6px 0}
.hidden{display:none!important}
.muted{color:#5a6b7a}
.ad{font-weight:bold;color:#1f5fa8;white-space:nowrap}
.fm{font-family:"JetBrains Mono",Consolas,"Courier New",monospace;font-weight:bold;color:#185c37;background:#eef7f1;border:1px solid #cfe6d7;border-radius:4px;padding:0 5px;white-space:nowrap}
.mono{font-family:"JetBrains Mono",Consolas,"Courier New",monospace;font-weight:bold}
.btn{font:inherit;font-size:19px;background:#2e8b57;color:#fff;border:1px solid #2e8b57;border-radius:5px;padding:7px 16px;font-weight:bold;cursor:pointer}
.btn:hover{background:#277a4c}
.btn.alt{background:#fff;color:#1d6b40;border:1px solid #9cb8a5;font-weight:normal}
.btn.alt:hover{background:#eef7f1}
.btn.alt.on{background:#d8eedf;border-color:#2e8b57;font-weight:bold}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
/* лист Excel */
.gwrap{position:relative;overflow-x:auto;padding:2px 14px 12px 2px;max-width:100%}
table.xl{border-collapse:collapse;font-family:Calibri,Arial,sans-serif;font-size:18px;background:#fff}
table.xl th{background:#f2f2f2;color:#555;font-weight:normal;border:1px solid #d4d4d4;padding:1px 6px;min-width:28px;font-size:16px}
table.xl td{border:1px solid #e1e1e1;padding:2px 7px;min-width:70px;height:32px;text-align:right;white-space:nowrap;color:#1f2d3a;position:relative}
table.xl td.txt{text-align:left}
table.xl td.fcell{text-align:left;font-family:"JetBrains Mono",Consolas,monospace;font-size:15px;font-weight:bold}
table.xl td.srcc{background:#f6fbf8}
table.xl td.cp{background:#fffdf2}
table.xl td.flash{animation:fl .7s ease-out}
@keyframes fl{from{background:#d8eedf}to{background:#fffdf2}}
table.xl td.sel{outline:2px solid #217346;outline-offset:-2px}
table.xl td.sel::after{content:"";position:absolute;right:-4px;bottom:-4px;width:7px;height:7px;background:#217346;border:1px solid #fff;z-index:2}
table.xl td.lockc{background:#c6efce}
table.xl td.lockc::before{content:"$";position:absolute;left:3px;top:0;font-size:12px;color:#006100;font-weight:bold}
table.xl td.dst{outline:2px dashed #d08a00;outline-offset:-3px;background:#fff4dc;text-align:center;font-weight:bold;color:#a0600a}
table.xl td.errv{color:#a0600a;font-weight:bold}
table.xl td.rg0{background:#dce9fb;outline:2px dashed #1f6fd1;outline-offset:-2px}
table.xl td.rg1{background:#efe0f6;outline:2px dashed #8e44ad;outline-offset:-2px}
table.xl td.rg2{background:#fdeacc;outline:2px dashed #c06a00;outline-offset:-2px}
.rc0{color:#1f6fd1}.rc1{color:#8e44ad}.rc2{color:#c06a00}
/* адреса в формулах: акцент на закреплённых частях */
.lk{background:#c6efce;color:#006100;border-radius:3px;padding:0 1px}
.rabs{box-shadow:0 0 0 2px #2e8b57;border-radius:3px}
.chg{color:#c55a11;text-decoration:underline}
.err{color:#a0600a}
.plus{position:absolute;width:22px;height:22px;pointer-events:none;display:none;transition:left .45s ease,top .45s ease;z-index:5}
/* таблица видов адресации */
.types{border-collapse:collapse;width:100%;font-size:20px}
.types th,.types td{border:1px solid #d4d4d4;padding:6px 10px;text-align:left;vertical-align:middle}
.types th{background:#e2efe6;color:#185c37}
.types td.ex{font-family:"JetBrains Mono",Consolas,monospace;font-weight:bold;font-size:24px;white-space:nowrap}
.tip{background:#fff8e1;border:1px solid #f0d48a;border-radius:5px;padding:6px 12px;margin-top:8px}
.explain{background:#f6fbf8;border:1px solid #cfe6d7;border-radius:5px;padding:6px 12px;margin-top:6px;font-size:19px;min-height:40px}
.explain ul{margin:2px 0;padding-left:20px}
/* функции */
.flist{border-collapse:collapse;width:100%;font-size:20px}
.flist td,.flist th{border:1px solid #d4d4d4;padding:6px 10px;text-align:left;vertical-align:middle}
.flist th{background:#e2efe6;color:#185c37}
.flist tr.fr{cursor:pointer}
.flist tr.fr:hover td{background:#f6fbf8}
.flist tr.fr.on td{background:#d8eedf}
.flist td.nm{font-family:"JetBrains Mono",Consolas,monospace;font-weight:bold;color:#185c37;white-space:nowrap}
.fbar{display:flex;align-items:stretch;border:1px solid #c6c6c6;background:#fff;font-family:Calibri,Arial,sans-serif;font-size:18px;margin-bottom:6px;max-width:640px}
.fbar .nb{width:60px;border-right:1px solid #c6c6c6;padding:3px 6px;text-align:center}
.fbar .fx{width:44px;border-right:1px solid #c6c6c6;padding:3px 6px;font-style:italic;font-weight:bold;color:#555;text-align:center}
.fbar .fx.pulse{background:#ffe08a;animation:pu 1s ease-in-out infinite;color:#1f2d3a}
@keyframes pu{50%{background:#fff4c9}}
.fbar .ft{padding:3px 8px;font-family:"JetBrains Mono",Consolas,monospace;font-weight:bold;font-size:16px;flex:1;min-height:30px;overflow-x:auto;white-space:nowrap}
.ftip{display:inline-block;background:#fffde6;border:1px solid #d9c56a;border-radius:3px;padding:1px 8px;font-family:Calibri,Arial,sans-serif;font-size:15px;margin:0 0 6px}
.cap{background:#fff8e1;border:1px solid #f0d48a;border-radius:5px;padding:8px 12px;font-size:20px;margin:8px 0;min-height:50px}
.cap b{color:#185c37}
.pl{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.pl-left{flex:1 1 440px;min-width:0}
.pl-right{flex:0 1 320px}
.xdlg{border:1px solid #9cb8a5;border-radius:4px;background:#fff;font-family:Calibri,Arial,sans-serif;font-size:16px;box-shadow:0 3px 12px rgba(30,70,50,.22);max-width:320px}
.xdlg .t{background:#e2efe6;padding:4px 10px;font-weight:bold;border-bottom:1px solid #c6c6c6}
.xdlg .b{padding:8px 10px}
.xdlg .lst{border:1px solid #c6c6c6;margin:4px 0}
.xdlg .lst div{padding:1px 8px}
.xdlg .lst div.on{background:#2e8b57;color:#fff}
.xdlg .fld{display:flex;align-items:center;gap:6px;margin:4px 0}
.xdlg .fld span{width:140px;text-align:right}
.xdlg .fld i{flex:1;border:1px solid #9aa6b2;padding:1px 6px;font-style:normal;min-height:24px;font-family:"JetBrains Mono",Consolas,monospace;font-size:14px}
.xdlg .fld i.act{outline:2px solid #2e8b57}
.xdlg .ok{display:inline-block;border:1px solid #7f8b97;padding:1px 16px;border-radius:3px;margin-top:6px;background:#f3f5f7}
.xdlg .ok.pulse{background:#ffe08a;animation:pu 1s infinite}
.steps{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.steps span{width:28px;height:28px;border-radius:50%;border:1px solid #9cb8a5;display:inline-flex;align-items:center;justify-content:center;font-size:15px;color:#1d6b40;cursor:pointer;background:#fff}
.steps span.on{background:#2e8b57;color:#fff;border-color:#2e8b57}
.steps span.done{background:#d8eedf}
/* задания */
.qtext{font-size:22px;margin:0 0 8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opt{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #9cb8a5;border-radius:6px;padding:8px 12px;font:inherit;font-size:21px;min-height:50px;text-align:left;color:#1f2d3a;cursor:pointer}
.opt:hover{background:#f6fbf8}
.opt::before{content:"";flex:none;width:18px;height:18px;border-radius:50%;border:2px solid #7fae8f;background:#fff}
.opt.sel{background:#d8eedf;border-color:#2e8b57;font-weight:bold}
.opt.sel::before{background:#2e8b57;box-shadow:inset 0 0 0 3px #fff}
.opt.right{background:#c6efce;border-color:#2e8b57}
.opt.wrong{background:#fde9cc;border-color:#e3a33b}
.opt .mono{font-size:19px}
.bigad{font-family:"JetBrains Mono",Consolas,monospace;font-weight:bold;font-size:42px;background:#f6fbf8;border:1px solid #cfe6d7;border-radius:6px;padding:0 20px;display:inline-block;vertical-align:middle}
.numin{font:inherit;font-size:24px;width:180px;padding:5px 10px;border:1px solid #9cb8a5;border-radius:5px;color:#1f2d3a}
.fb{border-radius:6px;padding:8px 12px;margin-top:10px}
.fb.ok{background:#e6f5ea;border:1px solid #8fcca0}
.fb.no{background:#fdf0d8;border:1px solid #e6bd6d}
.fb ul{margin:4px 0;padding-left:20px}
/* модули с кружочками */
.mods{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.mod{border:1px solid #d4d4d4;border-radius:6px;padding:8px 12px;background:#fafafa}
.mod .mh{display:flex;justify-content:space-between;gap:8px;font-weight:bold;color:#185c37}
.bar{height:10px;background:#e7e7e7;border-radius:5px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:#2e8b57;width:0;transition:width .4s}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots button{width:40px;height:40px;border-radius:50%;border:2px solid #9cb8a5;background:#fff;color:#1d6b40;font:inherit;font-size:18px;font-weight:bold;cursor:pointer}
.dots button.done{background:#d6e6f7;border-color:#7fa9d4;color:#1f5fa8}
.dots button.cur{outline:3px solid #2f76c0;outline-offset:2px}
.dots button.ok{background:#c6efce;border-color:#2e8b57;color:#006100}
.dots button.no{background:#fde9cc;border-color:#e3a33b;color:#a0600a}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px;flex-wrap:wrap}
.confirm{margin-top:10px;background:#fff8e1;border:1px solid #f0d48a;border-radius:6px;padding:10px 14px;text-align:center}
.summary{background:#e6f5ea;border:1px solid #8fcca0;border-radius:6px;padding:8px 12px;margin-top:10px;font-weight:bold}
.score{text-align:center;font-size:62px;font-weight:bold;color:#185c37;line-height:1.1}
.score small{font-size:26px;color:#3f5f50}
.rrows{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px;margin:10px 0 14px}
.rr{display:flex;justify-content:space-between;gap:10px;padding:4px 10px;border-radius:5px;font-size:19px}
.rr.ok{background:#e6f5ea}.rr.no{background:#fdf0d8}
.center{text-align:center}
@media(max-width:700px){
  body{font-size:18px} header{padding:5px 10px} header h1{font-size:18px} .xlico{width:28px;height:28px;font-size:16px}
  #top{padding:5px 8px;position:static;gap:6px} #fio{width:100%} .who label{width:100%} .who label:last-child{width:auto}
  .tabs button{font-size:17px;padding:4px 10px}
  main{padding:8px 6px 30px} .card{padding:10px 10px}
  .opts,.rrows,.mods{grid-template-columns:1fr} .qtext{font-size:19px} .opt{font-size:18px;min-height:44px}
  .types{font-size:17px} .types td.ex{font-size:19px} .flist{font-size:17px}
  table.xl{font-size:15px} table.xl th{font-size:13px;padding:1px 4px} table.xl td{min-width:48px;padding:1px 4px;height:28px} table.xl td.fcell{font-size:12px}
  .flist .fm{white-space:normal;word-break:break-all;font-size:14px} .flist td{padding:4px 6px}
  .bigad{font-size:32px} .dots button{width:36px;height:36px;font-size:16px}
}
</style>

<body>
<header><div class="xlico">X</div><h1>Электронные таблицы: адресация ячеек и математические функции</h1></header>
<div id="top">
  <div class="who">
    <label>Фамилия и имя <input id="fio" type="text" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="60"></label>
    <label>Класс <select id="klass" autocomplete="off"><option value="">выбрать</option><option>8А</option><option>8Б</option><option>8В</option></select></label>
  </div>
  <div class="tabs" id="viewTabs"><button data-v="learn">Изучение</button><button data-v="train">Тренировка</button><button data-v="ctrl">Контроль</button></div>
  <div class="tabs" id="modTabs"><button data-m="addr">Виды адресации</button><button data-m="func">Математические функции</button></div>
  <div class="tabs"><button id="sendBtn">Отправить результаты учителю</button><button id="saveTxt">Сохранить результаты (.txt)</button></div>
  <span class="sendst" id="sendSt"></span>
  <div id="msg"></div>
</div>
<main>
  <section id="addr-learn" class="view"></section>
  <section id="func-learn" class="view"></section>
  <section id="addr-train" class="view"></section>
  <section id="func-train" class="view"></section>
  <section id="ctrl" class="view"></section>
</main>
<script>
"use strict";
/* ===================== Помощники ===================== */
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function fmt(n){ if (typeof n !== "number") return String(n); const r = Math.round(n * 10000) / 10000; return String(r).replace(".", ",").replace("-", "−"); }
function parseNum(s){ s = String(s).trim().replace(/\s/g, "").replace(",", ".").replace("−", "-"); if (!/^-?\d+(\.\d+)?$/.test(s)) return null; return +s; }
const near = (a, b) => typeof a === "number" && typeof b === "number" && Math.abs(a - b) < 1e-9 * Math.max(1, Math.abs(b));
function plural(n, a, b, c){ n = Math.abs(n) % 100; const d = n % 10; if (n > 10 && n < 20) return c; if (d === 1) return a; if (d >= 2 && d <= 4) return b; return c; }
const strip = h => { const d = document.createElement("div"); d.innerHTML = h; return d.textContent.replace(/\s+/g, " ").trim(); };
const ad = s => `<span class="ad">${esc(s)}</span>`;              // адрес или диапазон в тексте
const fm = s => `<span class="fm">${esc(s)}</span>`;              // формула в тексте
const hl = s => s.replace(/(\$?[A-L]\$?\d+(?::\$?[A-L]\$?\d+)?)/g, '<span class="ad">$1</span>'); // подсветить адреса в простом тексте

/* ===================== Адреса и формулы ===================== */
const COLS = "ABCDEFGHIJKL";
const AD = (c, r) => COLS[c] + r;
function splitA(a){ return {c: COLS.indexOf(a[0]), r: +a.slice(1)}; }
function tokenize(f){
  const out = [], re = /(\$?)([A-L])(\$?)(\d+)/g; let m, last = 0;
  while ((m = re.exec(f))){
    if (m.index > last) out.push({t: "s", s: f.slice(last, m.index)});
    out.push({t: "r", ca: !!m[1], c: COLS.indexOf(m[2]), ra: !!m[3], r: +m[4]});
    last = re.lastIndex;
  }
  if (last < f.length) out.push({t: "s", s: f.slice(last)});
  return out;
}
const refText = t => t.err ? "#ССЫЛКА!" : (t.ca ? "$" : "") + COLS[t.c] + (t.ra ? "$" : "") + t.r;
const fStr = tok => tok.map(t => t.t === "s" ? t.s : refText(t)).join("");
function shiftRef(t, dc, dr){
  const n = {...t, c: t.ca ? t.c : t.c + dc, r: t.ra ? t.r : t.r + dr};
  n.err = n.c < 0 || n.c >= COLS.length || n.r < 1;
  return n;
}
const shiftF = (tok, dc, dr) => tok.map(t => t.t === "r" ? shiftRef(t, dc, dr) : t);
const refsOf = tok => tok.filter(t => t.t === "r");
function refKind(t){ return t.ca && t.ra ? "abs" : (!t.ca && !t.ra ? "rel" : "mix"); }
const KIND_RU = {rel: "Относительный", abs: "Абсолютный", mix: "Смешанный"};
/* формула в HTML: закреплённое ($) — зелёным, изменившееся при копировании — подчёркнуто */
function refHTML(t, s){
  if (t.err) return `<span class="err">#ССЫЛКА!</span>`;
  const cc = s && s.c !== t.c, rc = s && s.r !== t.r;
  const col = t.ca ? `<span class="lk">$${COLS[t.c]}</span>` : `<span class="${cc ? "chg" : ""}">${COLS[t.c]}</span>`;
  const row = t.ra ? `<span class="lk">$${t.r}</span>` : `<span class="${rc ? "chg" : ""}">${t.r}</span>`;
  return `<span class="${t.ca && t.ra ? "rabs" : ""}">${col}${row}</span>`;
}
const fHTML = (tok, src) => tok.map((t, i) => t.t === "s" ? esc(t.s) : refHTML(t, src ? src[i] : null)).join("");
const fBox = (tok, src) => `<span class="fm">${fHTML(tok, src)}</span>`;
function evalTok(tok, get){
  let ex = "";
  for (const t of tok){
    if (t.t === "s"){ ex += t.s; continue; }
    if (t.err) return "#ССЫЛКА!";
    let v = get(AD(t.c, t.r));
    if (v === undefined || v === null || v === "") v = 0;
    if (typeof v === "string") return v.startsWith("#") ? v : "#ЗНАЧ!";
    ex += "(" + v + ")";
  }
  ex = ex.replace(/^=/, "");
  if (!/^[\d.+\-*/() ]*$/.test(ex)) return "#ИМЯ?";
  let r; try { r = Function("return " + ex)(); } catch(e){ return "#ЗНАЧ!"; }
  if (!isFinite(r)) return "#ДЕЛ/0!";
  return Math.round(r * 1e9) / 1e9;
}
function shiftWords(dc, dr){
  const p = [];

/* ===================== Показ задания ===================== */
function isRight(it, a){
  if (a === undefined || a === null) return false;
  if (it.kind === "opt") return a === it.correct;
  const v = parseNum(a); return v !== null && near(v, it.ans);
}
const hasAnswer = (it, a) => a !== undefined && a !== null && (it.kind !== "num" || String(a).trim() !== "");
const answerText = (it, a) => !hasAnswer(it, a) ? "нет ответа" : it.kind === "opt" ? strip(it.opts[a]) : String(a);
const rightText = it => it.kind === "opt" ? strip(it.opts[it.correct]) : fmt(it.ans);
/* show: true — показать правильность и пояснение */
function renderItem(box, it, st, onChange, show){
  let h = `<div class="qtext">${it.q}</div>`;
  if (it.kind === "opt") h += `<div class="opts">${it.opts.map((o, i) => {
      let c = st.a === i ? "sel" : ""; if (show){ if (i === it.correct) c += " right"; else if (st.a === i) c += " wrong"; }
      return `<button class="opt ${c}" data-o="${i}" ${show ? "disabled" : ""}>${o}</button>`; }).join("")}</div>`;
  else h += `<div class="row"><b>Ответ:</b><input class="numin" inputmode="decimal" autocomplete="off" value="${esc(st.a ?? "")}" ${show ? "disabled" : ""}></div><div class="muted" style="font-size:17px">Дробную часть пишите через запятую: 4,7</div>`;
  h += `<div data-act></div>`;
  if (show){ const ok = isRight(it, st.a);
    h += `<div class="fb ${ok ? "ok" : "no"}"><b>${ok ? "Верно!" : hasAnswer(it, st.a) ? "Неверно." : "Нет ответа."}</b>${ok ? "" : ` Правильный ответ: <span class="mono">${esc(rightText(it))}</span>.`}<div>${it.explain}</div></div>`; }
  box.innerHTML = h;
  if (show) return;
  if (it.kind === "opt") box.querySelectorAll("[data-o]").forEach(b => b.onclick = () => { st.a = +b.dataset.o; onChange && onChange(); renderItem(box, it, st, onChange); });
  else { const inp = box.querySelector(".numin"); inp.oninput = () => { st.a = inp.value; onChange && onChange(); }; }
}

/* ===================== Тренировка: проверка сразу после каждого задания ===================== */
const TR = {addr: null, func: null};
const HIST = {addr: [], func: []};
function newTrain(m){
  const groups = GROUPS[m](), items = [], grp = [];
  groups.forEach((g, gi) => g.items.forEach(it => { items.push(it); grp.push(gi); }));
  TR[m] = {groups, items, grp, st: items.map(() => ({a: null, checked: false})), pos: 0, done: false};
  renderTrain(m);
}
function trainStats(m){
  const T = TR[m]; if (!T) return null;
  const ok = i => T.st[i].checked && isRight(T.items[i], T.st[i].a);
  return {n: T.items.length, checked: T.st.filter(s => s.checked).length, good: T.items.filter((_, i) => ok(i)).length,
    by: T.groups.map((g, gi) => { const idx = T.grp.map((x, i) => x === gi ? i : -1).filter(i => i >= 0);
      return {name: g.name, n: idx.length, checked: idx.filter(i => T.st[i].checked).length, good: idx.filter(ok).length, idx}; })};
}
function renderTrain(m){
  const T = TR[m], v = $(m + "-train"), n = T.items.length, S = trainStats(m), st = T.st[T.pos], it = T.items[T.pos];
  const ok = i => isRight(T.items[i], T.st[i].a);
  const mods = S.by.map(g => {
    const pct = Math.round(g.checked / g.n * 100);
    return `<div class="mod"><div class="mh"><span>${g.name}</span><span>${pct}%${g.checked ? ` · верно ${g.good} из ${g.checked}` : ""}</span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="dots">${g.idx.map(i => `<button class="${T.st[i].checked ? (ok(i) ? "ok" : "no") : ""} ${i === T.pos ? "cur" : ""}" data-d="${i}">${i + 1}</button>`).join("")}</div></div>`;
  }).join("");
  const all = S.checked === n;
  v.innerHTML = `<div class="card"><h2>Тренировка: ${m === "addr" ? "виды адресации" : "математические функции"}</h2>
    <div class="mods">${mods}</div>
    ${all ? `<div class="summary">Все задания выполнены: верно ${S.good} из ${n} (${Math.round(S.good / n * 100)}%).
      <div class="row"><button class="btn" data-new>Новые задания</button><button class="btn alt" data-send>Отправить результаты учителю</button></div></div>` : ""}</div>
    <div class="card"><div data-item></div>
      <div class="nav"><button class="btn alt" data-prev ${T.pos ? "" : "disabled"}>◀ Назад</button><span class="muted">Задание ${T.pos + 1} из ${n}</span><button class="btn alt" data-nx ${T.pos < n - 1 ? "" : "disabled"}>Далее ▶</button></div></div>`;
  const box = v.querySelector("[data-item]");
  renderItem(box, it, st, null, st.checked);
  const act = box.querySelector("[data-act]");
  if (!st.checked){
    act.innerHTML = `<div class="row"><button class="btn" data-check>Проверить</button><span class="err" data-warn></span></div>`;
    act.querySelector("[data-check]").onclick = () => {
      if (!hasAnswer(it, st.a)){ act.querySelector("[data-warn]").innerHTML = "<b>Сначала выберите или введите ответ.</b>"; return; }
      st.checked = true;
      const S2 = trainStats(m);
      if (S2.checked === n && !T.done){ T.done = true;
        HIST[m].push({t: new Date(), good: S2.good, n, by: S2.by.map(g => [g.name, g.good, g.n])}); }
      renderTrain(m);
    };
  } else {
    const next = T.st.findIndex((s, i) => i > T.pos && !s.checked), first = T.st.findIndex(s => !s.checked), go = next >= 0 ? next : first;
    if (go >= 0){ act.innerHTML = `<div class="row"><button class="btn" data-go>Следующее задание ▶</button></div>`; act.querySelector("[data-go]").onclick = () => { T.pos = go; renderTrain(m); }; }
  }
  v.querySelectorAll("[data-d]").forEach(b => b.onclick = () => { T.pos = +b.dataset.d; renderTrain(m); });
  v.querySelector("[data-prev]").onclick = () => { T.pos--; renderTrain(m); };
  v.querySelector("[data-nx]").onclick = () => { T.pos++; renderTrain(m); };
  if (all){ v.querySelector("[data-new]").onclick = () => newTrain(m); v.querySelector("[data-send]").onclick = sendSummary; }
}

function enqueue(rec){
  rec.id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  SEND.queue.push(rec); saveQ(); pump();
}
async function pump(){
  if (SEND.busy || !SEND.queue.length) return;
  if (!SENDCFG){ setSend("bad", "Адрес таблицы учителя не указан — сохраните результаты в файл (.txt)."); return; }
  SEND.busy = true; clearTimeout(SEND.timer);
  const waits = [1500, 3000, 6000, 10000, 15000];
  while (SEND.queue.length){
    const rec = SEND.queue[0]; let ok = false;
    for (let i = 0; i < 5 && !ok; i++){
      setSend("", `Отправка учителю… ${i ? "(попытка " + (i + 1) + ")" : ""}`);
      try {
        const r = await fetch(GOOGLE_SHEET_URL, {method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"}, body: JSON.stringify(rec)});
        const j = await r.json();
        if (j && j.ok === true) ok = true;
      } catch(e){}
      if (!ok && i < 4) await sleep(waits[i] + Math.random() * 1000);
    }
    if (!ok){ SEND.busy = false; setSend("bad", "Не удалось отправить — нет связи. Результат сохранён и отправится сам, когда появится интернет. Можно нажать «Отправить» ещё раз.");
      SEND.timer = setTimeout(pump, 60000); return; }
    SEND.queue.shift(); saveQ();
  }
  SEND.busy = false; setSend("ok", "✓ Результаты отправлены учителю");
}
window.addEventListener("online", pump);
function detailCtrl(){ return C.items.map((it, i) => `${i + 1}. ${it.topic}: ${C.ok[i] ? "верно" : "неверно (ответ: " + answerText(it, C.st[i].a) + "; правильно: " + rightText(it) + ")"}`).join("\n"); }
function sendControl(){
  const sec = Math.round((C.t1 - C.t0) / 1000);
  enqueue({fio: C.fio, kl: C.kl, kind: "Контроль", result: `верно ${C.score} из 10, время ${Math.floor(sec / 60)} мин ${sec % 60} с`, grade: C.score, details: detailCtrl()});
}
function trainText(m){
  const S = trainStats(m), name = m === "addr" ? "Адресация" : "Функции";
  const hist = HIST[m].map((h, i) => `попытка ${i + 1}: ${h.good} из ${h.n}`).join("; ");
  if (!S.checked && !HIST[m].length) return null;
  return `${name}: сейчас верно ${S.good} из ${S.checked} проверенных (всего заданий ${S.n})${hist ? "; завершённые наборы — " + hist : ""}`;
}
function sendSummary(){
  const fio = $("fio").value.trim(), kl = $("klass").value;
  if (fio.length < 3 || !kl){ say("Чтобы отправить результаты, заполните фамилию, имя и выберите класс."); $("fio").focus(); return; }
  const parts = [trainText("addr"), trainText("func")].filter(Boolean);
  const pending = SEND.queue.length;
  if (!parts.length && C.state !== "done"){
    if (pending){ pump(); return; }
    say("Пока нечего отправлять: выполните задания тренировки или контроль."); return; }
  say("");
  if (parts.length) enqueue({fio, kl, kind: "Тренировка", result: parts.map(p => p.split(":")[0] + ": " + p.match(/верно \d+ из \d+/)[0]).join("; "), grade: "", details: parts.join("\n")});
  else pump();
}
$("sendBtn").onclick = sendSummary;
if (SEND.queue.length) setTimeout(pump, 1500);

/* ===================== Сохранение в файл ===================== */
function say(t){ $("msg").textContent = t; }
function saveTxt(){
  const fio = $("fio").value.trim() || C.fio || "", kl = $("klass").value || C.kl || "";
  if (!fio){ say("Чтобы сохранить результаты, введите фамилию и имя."); $("fio").focus(); return; }
  say("");
  const now = new Date(), N = "\r\n", tm = d => d.toLocaleTimeString("ru-RU").slice(0, 5);
  let t = `Тренажёр «Электронные таблицы: адресация и математические функции»${N}Ученик: ${fio}${N}Класс: ${kl}${N}Дата: ${now.toLocaleDateString("ru-RU")} ${tm(now)}${N}${N}`;
  t += `===== КОНТРОЛЬ =====${N}`;
  if (C.state === "done"){
    const sec = Math.round((C.t1 - C.t0) / 1000);
    t += `Оценка: ${C.score} из 10 (время ${Math.floor(sec / 60)} мин ${sec % 60} с)${N}` + detailCtrl().split("\n").map(x => "  " + x).join(N) + N;
  } else t += (C.state === "run" ? "начат, но не завершён" : "не выполнялся") + N;
  [["addr", "ТРЕНИРОВКА: ВИДЫ АДРЕСАЦИИ"], ["func", "ТРЕНИРОВКА: МАТЕМАТИЧЕСКИЕ ФУНКЦИИ"]].forEach(([m, title]) => {
    t += `${N}===== ${title} =====${N}`;
    const S = trainStats(m);
    t += `Текущий набор: проверено ${S.checked} из ${S.n}, верно ${S.good}${N}`;
    HIST[m].forEach((h, i) => { t += `Набор ${i + 1} (${tm(h.t)}): ${h.good} из ${h.n} (${Math.round(h.good / h.n * 100)}%) — ${h.by.map(b => `${b[0]} ${b[1]}/${b[2]}`).join(", ")}${N}`; });
  });
  const blob = new Blob(["﻿" + t], {type: "text/plain;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `Адресация и функции — ${fio}${kl ? " " + kl : ""}.txt`.replace(/[\\/:*?"<>|]/g, "");
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ===================== Переключение ===================== */
const UI = {m: "addr", v: "learn"};
function show(){
  document.querySelectorAll(".view").forEach(s => s.classList.add("hidden"));
  $(UI.v === "ctrl" ? "ctrl" : UI.m + "-" + UI.v).classList.remove("hidden");
  $("modTabs").classList.toggle("off", UI.v === "ctrl");
  document.querySelectorAll("#modTabs button").forEach(b => b.classList.toggle("on", b.dataset.m === UI.m));
  document.querySelectorAll("#viewTabs button").forEach(b => b.classList.toggle("on", b.dataset.v === UI.v));
}
document.querySelectorAll("#modTabs button").forEach(b => b.onclick = () => {
  if (UI.m !== b.dataset.m){ UI.m = b.dataset.m; if (!TR[UI.m] || TR[UI.m].done) newTrain(UI.m); }
  show(); });
document.querySelectorAll("#viewTabs button").forEach(b => b.onclick = () => { UI.v = b.dataset.v; show(); window.scrollTo(0, 0); });
$("saveTxt").onclick = saveTxt;
function clearWho(){ $("fio").value = ""; $("klass").value = ""; }
$("fio").name = "f" + Math.random().toString(36).slice(2);
clearWho(); window.addEventListener("pageshow", clearWho);
renderAddrLearn(); renderFuncLearn(); newTrain("addr"); newTrain("func"); renderCtrl(); show();
</script>
