<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Блиц-опрос «Логические операции»</title>
<style>
:root{--ink:#1e293b;--muted:#5b6b82;--accent:#2563eb;--line:#c9d6e8;--ok:#16a34a;--okbg:#dcfce7;--err:#dc2626;--errbg:#fee2e2;--gold:#f59e0b}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:"Times New Roman",Times,serif;font-size:20px;min-height:100vh;background-color:#eef2ff;background-attachment:fixed}
header{background:linear-gradient(90deg,#1e3a8a,#5b21b6);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 3px 12px #1e1b4b44}
header h1{font-size:26px;margin:0;color:#fff;display:flex;align-items:center;gap:8px}
.who{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}
.who label{font-size:17px;color:#dbeafe}
.who input{font:inherit;font-size:19px;padding:6px 10px;border:2px solid #a5b4fc;border-radius:8px;width:230px;background:#fff}
.who select{font:inherit;font-size:19px;padding:5px 8px;border:2px solid #a5b4fc;border-radius:8px;background:#fff;min-width:80px}
.who input:disabled,.who select:disabled{background:#e0e7ff;color:var(--ink)}
.snd{font-size:22px;background:#ffffff22;border:2px solid #a5b4fc;border-radius:8px;padding:2px 8px;cursor:pointer}
main{max-width:1000px;margin:0 auto;padding:16px}
.f{font-family:"Cambria Math","Times New Roman","Segoe UI Symbol",serif}
h2{color:#1e3a8a;margin:8px 0}
.btn{font:inherit;font-size:21px;padding:10px 22px;border-radius:12px;border:2px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
.btn.sec{background:#fff;color:var(--accent)}
.btn.big{font-size:28px;padding:14px 40px;border-radius:16px;background:linear-gradient(90deg,#f59e0b,#ef4444);border:0;box-shadow:0 6px 18px #ef444466;transition:transform .15s}
.btn.big:hover{transform:scale(1.05)}
.btn.help{background:#ecfdf5;border-color:#34d399;color:#065f46}
.btn.send{font-size:23px;padding:12px 26px;border:0;background:linear-gradient(90deg,#16a34a,#0d9488);box-shadow:0 5px 16px #16a34a66;animation:glow 1.6s ease-in-out infinite}
.btn.send:disabled{animation:none;opacity:.85;cursor:default;box-shadow:none}
@keyframes glow{0%,100%{box-shadow:0 5px 16px #16a34a55}50%{box-shadow:0 5px 26px #16a34acc}}
.btn:disabled{cursor:default}
.btns{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.card{background:#ffffffee;border:2px solid var(--line);border-radius:16px;padding:16px 20px;margin:14px 0;backdrop-filter:blur(2px)}
/* герой стартовой страницы */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:22px 26px;color:#fff;background:radial-gradient(circle at 85% 20%,#7c3aed 0,#4338ca 40%,#1e3a8a 100%);box-shadow:0 10px 30px #312e8155;display:grid;grid-template-columns:1fr 330px;gap:20px;align-items:center}
.hero h2{color:#fff;font-size:36px;margin:0 0 8px}
.hero p{font-size:20px;color:#e0e7ff;margin:6px 0}
.hero .bits{position:absolute;inset:0;pointer-events:none;opacity:.13;font-family:monospace;font-size:22px;line-height:1.5;color:#fff;white-space:pre;overflow:hidden}
.demo{position:relative;background:#ffffff14;border:2px solid #ffffff33;border-radius:18px;padding:12px;text-align:center}
.demo .row{display:flex;justify-content:center;align-items:center;gap:10px;margin:6px 0}
.sw{font:inherit;font-size:22px;font-weight:bold;width:96px;padding:6px 0;border-radius:30px;border:2px solid #fff;cursor:pointer;background:#334155;color:#fff;transition:background .2s}
.sw.on{background:#facc15;color:#1e293b;border-color:#fde68a}
.chip{font:inherit;font-size:24px;width:44px;height:40px;border-radius:10px;border:2px solid #ffffff66;background:#ffffff1a;color:#fff;cursor:pointer}
.chip.sel{background:#fff;color:#4338ca}
.demo .eq{font-size:26px;margin-top:4px}
.demo small{display:block;color:#c7d2fe;font-size:15px}
.attempts{display:inline-block;margin-top:8px;background:#ffffff22;border:2px solid #ffffff44;border-radius:20px;padding:4px 14px;font-size:18px}
.rules li{margin:6px 0}
.pts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:10px 0}
.pt{background:#f5f8ff;border:2px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.pt b{display:block;font-size:30px;color:#1d4ed8}
.pt span{font-size:17px;color:var(--muted)}
.pt.y{background:#fffbeb;border-color:#fcd34d}.pt.y b{color:#b45309}
.pt.g{background:#f0fdf4;border-color:#86efac}.pt.g b{color:#15803d}
table.sc{border-collapse:collapse;font-size:19px;margin:8px 0;background:#fff}
table.sc td,table.sc th{border:2px solid var(--line);padding:4px 12px;text-align:center}
table.sc th{background:#eef4ff}
/* лампочка */
.lamp .glass{fill:#e2e8f0;stroke:#94a3b8;stroke-width:2;transition:fill .25s}
.lamp .fil{stroke:#94a3b8;stroke-width:2;fill:none}
.lamp .rays{opacity:0;stroke:#f59e0b;stroke-width:3;stroke-linecap:round;transition:opacity .25s}
.lamp.on .glass{fill:#fde047;stroke:#f59e0b}
.lamp.on .fil{stroke:#b45309}
.lamp.on .rays{opacity:1}
.lamp.on{filter:drop-shadow(0 0 12px #facc15)}
/* игра */
.hud{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.hud .q{font-size:20px;color:#1e3a8a;background:#ffffffcc;border-radius:10px;padding:3px 10px}
.hud .att{font-size:17px;color:#6d28d9;background:#f3e8ffcc;border-radius:10px;padding:3px 10px}
.hud .score{margin-left:auto;font-size:26px;font-weight:bold;color:#1e3a8a;background:#fff;border:2px solid var(--line);border-radius:12px;padding:4px 14px;min-width:150px;text-align:center}
.streak{font-size:22px;font-weight:bold;color:#ea580c;min-width:120px;transition:transform .2s}
.streak.pop{transform:scale(1.4)}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.dots .lamp{width:24px;height:30px}
.dots .lamp.err .glass{fill:#475569;stroke:#dc2626}
.dots .cur{transform:translateY(-4px);filter:drop-shadow(0 0 4px #6366f1)}
.timer{height:16px;background:#e2e8f0;border-radius:10px;overflow:hidden;margin-bottom:12px}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#22c55e,#84cc16);border-radius:10px}
.timer i.mid{background:linear-gradient(90deg,#f59e0b,#facc15)}
.timer i.low{background:linear-gradient(90deg,#ef4444,#f97316)}
.qcard{position:relative;background:#fffffff2;border:3px solid var(--line);border-radius:20px;padding:20px 24px 24px;text-align:center;transition:border-color .2s,background .2s;box-shadow:0 6px 20px #312e8122}
.qcard.ok{border-color:var(--ok);background:#f0fdf4}
.qcard.err{border-color:var(--err);background:#fef2f2;animation:shake .4s}
.qcard .qlamp{position:absolute;left:18px;top:12px;width:52px;height:65px}
.qcard.ok .qlamp{animation:flash .6s}
@keyframes flash{0%{transform:scale(.7)}50%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.qtype{display:inline-block;font-size:16px;color:#6d28d9;background:#f3e8ff;border-radius:20px;padding:3px 14px;margin-bottom:8px}
.qtext{font-size:26px;margin:4px 0 10px}
.qbig{font-size:46px;margin:30px 0 14px}
.qbig .opw{position:relative;display:inline-block;padding:0 4px;border-radius:8px;margin:0 .12em}
.qbig .opw .num{position:absolute;left:50%;top:-30px;transform:translateX(-50%);font-family:"Times New Roman",serif;font-size:18px;min-width:26px;height:26px;line-height:22px;border-radius:13px;background:#1d4ed8;color:#fff;border:2px solid #fff;display:none}
.qbig.shownums .opw .num{display:block}
.qbig .opw.hl{background:#fde68a}
table.tt{border-collapse:collapse;margin:4px auto 14px;font-size:28px;background:#fff}
table.tt th,table.tt td{border:2px solid #9fb3cc;padding:3px 18px}
table.tt th{background:#eef4ff}
table.tt td.r{background:#f5f3ff;font-weight:bold}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:760px;margin:0 auto}
.opt{position:relative;font:inherit;font-size:24px;color:var(--ink);padding:14px 10px 14px 46px;border:3px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;transition:transform .1s,background .15s}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--accent);background:#eff6ff}
.opt .k{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:15px;color:#fff;background:#94a3b8;border-radius:6px;width:24px;height:24px;line-height:24px}
.opt.sym{font-size:40px;padding:6px 10px 6px 46px;font-family:"Cambria Math","Segoe UI Symbol",serif}
.opt:disabled{cursor:default;color:var(--ink)}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--errbg);border-color:var(--err)}
.opt.dim{opacity:.45}
.c0{border-left:10px solid #ef4444}.c1{border-left:10px solid #3b82f6}.c2{border-left:10px solid #f59e0b}.c3{border-left:10px solid #22c55e}
.fb{min-height:34px;font-size:22px;margin-top:12px}
.fly{position:absolute;right:24px;top:14px;font-size:34px;font-weight:bold;color:var(--ok);animation:fly 1.1s ease-out forwards;pointer-events:none}
.fly small{display:block;font-size:17px;color:#ea580c}
@keyframes fly{0%{opacity:0;transform:translateY(20px) scale(.6)}20%{opacity:1;transform:translateY(0) scale(1.15)}100%{opacity:0;transform:translateY(-50px) scale(1)}}
/* отсчёт */
.cd{position:fixed;inset:0;background:#1e1b4bdd;display:none;align-items:center;justify-content:center;z-index:30}
.cd.show{display:flex}
.cd b{font-size:180px;color:#fff;text-shadow:0 0 40px #a78bfa;animation:pulse .9s ease-out}
@keyframes pulse{0%{transform:scale(2);opacity:0}40%{transform:scale(1);opacity:1}100%{transform:scale(.8);opacity:.2}}
/* итог */
.reshero{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.grade{font-size:30px;margin:6px 0}
.grade b{font-size:64px;color:#1d4ed8}
.rank{font-size:28px;color:#7c3aed;margin:4px 0 10px}
.lamprow{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.lamprow .lamp{width:34px;height:42px}
.lamprow .lamp.err .glass{fill:#475569;stroke:#dc2626}
.mist li{margin:6px 0}
.sendst{margin-top:12px;font-size:19px;padding:8px 12px;border-radius:10px;background:#eef4ff;border:2px solid var(--line)}
.sendst:empty{display:none}
.sendst.ok{background:#f0fdf4;border-color:var(--ok)}
.sendst.err{background:#fff7e0;border-color:#f5b942}
canvas#conf{position:fixed;inset:0;pointer-events:none;z-index:25}
/* справка */
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;margin:12px 0}
.hcard{border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:#fbfdff}
.hname{font-size:22px;font-weight:bold;color:#1e3a8a}
.hname .f{color:#7c3aed;font-size:28px}
.hrule{margin:6px 0;color:#0f766e}
table.tt.small{font-size:20px;margin:6px 0}
table.tt.small th,table.tt.small td{padding:2px 12px}
.halt{font-size:17px;color:var(--muted)}
.warn{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#fff7e0;border:2px solid #f5b942;border-radius:12px;padding:12px 18px;font-size:20px;z-index:40;box-shadow:0 4px 16px #0002;max-width:92vw;display:none}
.warn.show{display:block}
@media (max-width:760px){.hero{grid-template-columns:1fr}.opts{grid-template-columns:1fr}.qbig{font-size:34px}.who input{width:170px}.qcard .qlamp{display:none}}
</style>
</head>
<body>
<header>
 <h1><span id="hlamp"></span>Блиц-опрос «Логические операции»</h1>
 <div class="who">
  <label for="fio">Фамилия, имя</label><input id="fio" autocomplete="off" spellcheck="false">
  <label for="cls">Класс</label><select id="cls"><option value="">—</option><option>9А</option><option>9Б</option><option>9В</option></select>
  <button class="snd" id="snd" title="Звук">🔊</button>
 </div>
</header>
<main></main>
<div class="cd" id="cd"></div>
<div class="warn" id="warn"></div>
<canvas id="conf"></canvas>

<script>
/* ===== Адрес веб-приложения Google Apps Script (результаты → Google-таблица).
   Вставьте между кавычками адрес из «Начать развертывание → Новое развертывание», он заканчивается на /exec.
   Если оставить пустым, результат сохраняется только в файл .txt. */
const SCRIPT_URL='https://script.google.com/macros/s/AKfycby6Emal27Gvl58xpppG1T1FPS5osDm4ygrifTfk7w6kTwnsKxF-sJdap_uQuwdz5_o9Jw/exec';

/* ===== Настройки опроса ===== */
const MAX_ATTEMPTS=3;                   // попыток на ученика (0 — без ограничения)
const PER_TYPE=4;                       // вопросов каждого вида (4 вида → 16 вопросов)
const TIME={sym:10,value:10,table:15,order:15};   // секунд на вопрос
const PTS=100, BONUS=50, FAST=1.5;      // очки за верный ответ; макс. бонус за скорость; ответ быстрее FAST с — полный бонус
const G_CORRECT=8, G_SPEED=2;           // оценка: правильность — до 8, скорость — до 2

const OPS={
 not:{s:'¬',name:'инверсия',read:'не A',rule:'меняет значение на противоположное',alt:'<span style="text-decoration:overline">A</span> · НЕ A'},
 and:{s:'∧',name:'конъюнкция',p:2,f:(a,b)=>a&b,read:'A и B',rule:'истинна (1), только когда оба высказывания истинны',alt:'A &amp; B · A · B'},
 or:{s:'∨',name:'дизъюнкция',p:3,f:(a,b)=>a|b,read:'A или B',rule:'ложна (0), только когда оба высказывания ложны',alt:'A + B · A | B'},
 xor:{s:'⊕',name:'исключающее ИЛИ',p:3,f:(a,b)=>a^b,read:'либо A, либо B',rule:'истинно (1), когда значения разные',alt:'A XOR B'},
 imp:{s:'→',name:'импликация',p:4,f:(a,b)=>(1-a)|b,read:'если A, то B',rule:'ложна (0), только когда 1 → 0',alt:'A ⇒ B'},
 eq:{s:'↔',name:'эквивалентность',p:5,f:(a,b)=>a===b?1:0,read:'A тогда и только тогда, когда B',rule:'истинна (1), когда значения одинаковые',alt:'A ≡ B · A ⇔ B'}
};
const ALL=['not','and','or','xor','imp','eq'],BIN=['and','or','xor','imp','eq'];
const TYPES={sym:'Обозначения',table:'Таблица истинности',order:'Порядок действий',value:'Вычисли'};

/* ===== утилиты ===== */
const $=s=>document.querySelector(s);
const R=n=>Math.floor(Math.random()*n);
const pick=a=>a[R(a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=R(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function h(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap=s=>s[0].toUpperCase()+s.slice(1);
const fmt=n=>String(Math.round(n*10)/10).replace('.',',');
const fio=()=>$('#fio').value.trim(),cls=()=>$('#cls').value;
function setWho(lock){$('#fio').disabled=lock;$('#cls').disabled=lock;}

/* ===== лампочка ===== */
function lamp(on,cls=''){
 const rays=[[32,0,32,-7],[10,8,5,3],[54,8,59,3],[3,28,-4,28],[61,28,68,28]].map(r=>`<line x1="${r[0]}" y1="${r[1]}" x2="${r[2]}" y2="${r[3]}"/>`).join('');
 return `<svg class="lamp ${on?'on':''} ${cls}" viewBox="-6 -10 76 92"><g class="rays">${rays}</g>
 <path class="glass" d="M32 6a22 22 0 0 1 13 39.5c-3 2.5-4.5 5.5-4.5 9h-17c0-3.5-1.5-6.5-4.5-9A22 22 0 0 1 32 6z"/>
 <path class="fil" d="M26 54V44l3-7 3 6 3-6 3 7v10"/>
 <rect x="23" y="56" width="18" height="5" rx="2" fill="#94a3b8"/><rect x="24" y="62" width="16" height="5" rx="2" fill="#64748b"/><rect x="27" y="68" width="10" height="4" rx="2" fill="#475569"/></svg>`;
}
$('#hlamp').innerHTML=lamp(true).replace('<svg','<svg style="width:30px;height:36px"');

/* ===== фоновый рисунок: схемы, нули и единицы ===== */
(function(){
 const c='%234338ca';
 const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><g fill='none' stroke='${c}' stroke-opacity='.13' stroke-width='2'>
 <path d='M0 40h60v50h70v-30h60'/><path d='M260 130h-50v60h-80v40'/><path d='M20 260v-60h50v-40'/><path d='M150 0v30h40v40h70'/>
 <circle cx='60' cy='40' r='4'/><circle cx='130' cy='90' r='4'/><circle cx='210' cy='190' r='4'/><circle cx='70' cy='160' r='4'/><circle cx='190' cy='70' r='4'/>
 <rect x='95' y='150' width='34' height='24' rx='4'/><path d='M100 162h24'/></g>
 <g fill='${c}' fill-opacity='.10' font-family='Cambria Math,serif' font-size='26'>
 <text x='14' y='120'>1</text><text x='200' y='30'>0</text><text x='160' y='240'>∧</text><text x='230' y='110'>∨</text><text x='40' y='230'>⊕</text><text x='110' y='40'>→</text><text x='180' y='150'>¬</text><text x='90' y='215'>1</text></g></svg>`;
 document.body.style.backgroundImage=`url("data:image/svg+xml,${svg.replace(/\n/g,'')}"),linear-gradient(135deg,#e0e7ff 0%,#f5f3ff 45%,#e0f2fe 100%)`;
})();

/* ===== звук ===== */
let soundOn=true,AC=null;
$('#snd').onclick=()=>{soundOn=!soundOn;$('#snd').textContent=soundOn?'🔊':'🔇';};
function tone(f,d,type='sine',t0=0,vol=.18){
 if(!soundOn)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
 const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(AC.destination);
 const t=AC.currentTime+t0;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d);}catch(e){}
}
const sndOk=()=>{tone(660,.12,'triangle');tone(990,.2,'triangle',.1);};
const sndBad=()=>{tone(180,.35,'sawtooth',0,.12);};
const sndTick=()=>tone(1200,.05,'square',0,.05);
const sndGo=()=>{tone(523,.15,'triangle');tone(659,.15,'triangle',.15);tone(784,.3,'triangle',.3);};
const sndCount=()=>tone(440,.15,'triangle');
const sndFin=()=>[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',i*.14));
const sndClick=()=>tone(880,.05,'square',0,.06);

/* ===== попытки (хранятся в браузере этого компьютера) ===== */
const attKey=()=>'blitzLogic|'+cls()+'|'+fio().toLowerCase().replace(/\s+/g,' ');
function attGet(){try{return JSON.parse(localStorage.getItem(attKey()))||{n:0,best:null};}catch(e){return {n:0,best:null};}}
function attSet(v){try{localStorage.setItem(attKey(),JSON.stringify(v));}catch(e){}}
function attClearAll(){try{Object.keys(localStorage).filter(k=>k.startsWith('blitzLogic|')).forEach(k=>localStorage.removeItem(k));}catch(e){}}

/* ===== генерация вопросов ===== */
function optsFrom(correct,pool,n=4){return shuffle([correct,...shuffle(pool.filter(x=>x!==correct)).slice(0,n-1)]);}
function qSym(){
 const op=pick(ALL);
 if(R(2)) return {tp:'sym',text:`Как обозначается <b>${OPS[op].name}</b>?`,big:'',
  opts:optsFrom(op,ALL).map(o=>({v:o,t:OPS[o].s})),symOpts:true,ans:op,right:`${OPS[op].name} — ${OPS[op].s}`};
 return {tp:'sym',text:'Что обозначает этот знак?',big:`<span class="f">${OPS[op].s}</span>`,
  opts:optsFrom(op,ALL).map(o=>({v:o,t:OPS[o].name})),ans:op,right:`${OPS[op].s} — ${OPS[op].name}`};
}
function qTable(){
 const op=pick(BIN),rows=[[0,0],[0,1],[1,0],[1,1]];
 const tb='<table class="tt f"><tr><th>A</th><th>B</th><th>F</th></tr>'+rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td class="r">${OPS[op].f(r[0],r[1])}</td></tr>`).join('')+'</table>';
 return {tp:'table',text:'Какой операции соответствует таблица?',big:tb,
  opts:optsFrom(op,BIN).map(o=>({v:o,t:`${OPS[o].s} ${OPS[o].name}`})),ans:op,right:`${OPS[op].s} ${OPS[op].name}`};
}
function qValue(){
 const op=pick(ALL);
 if(op==='not'){const a=R(2);return {tp:'value',text:'Чему равно значение?',big:`<span class="f">¬${a} = ?</span>`,opts:[{v:0,t:'0'},{v:1,t:'1'}],ans:1-a,right:`¬${a} = ${1-a}`};}
 const a=R(2),b=R(2),r=OPS[op].f(a,b);
 return {tp:'value',text:'Чему равно значение?',big:`<span class="f">${a} ${OPS[op].s} ${b} = ?</span>`,opts:[{v:0,t:'0'},{v:1,t:'1'}],ans:r,right:`${a} ${OPS[op].s} ${b} = ${r}`};
}
function tok(n){
 const wrap=a=>[{k:'('},...a,{k:')'}];
 if(n.t==='v')return [{k:'v',s:n.name}];
 if(n.t==='n'){const inner=tok(n.a);return [{k:'op',op:'not',id:n.id},...(n.a.t==='b'?wrap(inner):inner)];}
 let L=tok(n.a),Rt=tok(n.b);const p=OPS[n.op].p;
 if(n.a.t==='b'){const pa=OPS[n.a.op].p;if(pa>p||(pa===p&&(n.a.op!==n.op||n.op==='imp'||n.op==='eq')))L=wrap(L);}
 if(n.b.t==='b'){if(OPS[n.b.op].p>=p)Rt=wrap(Rt);}
 return [...L,{k:'op',op:n.op,id:n.id},...Rt];
}
/* выражение-«цепочка»: каждая операция использует результат предыдущей → порядок однозначный */
function qOrder(){
 const nOps=R(4)?3:2;
 const used=shuffle(BIN.slice());const vars=shuffle(['A','B','C','D']);
 let node={t:'b',op:used.pop(),a:{t:'v',name:vars[0]},b:{t:'v',name:vars[1]},id:0};
 let notUsed=false,vi=2;
 for(let i=1;i<nOps;i++){
  if(!notUsed&&node.t==='b'&&R(3)===0){node={t:'n',a:node,id:i};notUsed=true;}
  else{const v={t:'v',name:vars[vi++%4]};node=R(2)?{t:'b',op:used.pop(),a:node,b:v,id:i}:{t:'b',op:used.pop(),a:v,b:node,id:i};}
 }
 const tokens=tok(node);
 const ask=nOps===3?pick([0,1,2]):pick([0,1]);
 const askTxt=ask===0?'первым':ask===nOps-1?'последним':'вторым';
 let big='',plain='',opsList=[];
 tokens.forEach(t=>{
  if(t.k==='op'){big+=`<span class="opw" data-id="${t.id}"><span class="num">${t.id+1}</span>${OPS[t.op].s}</span>`;plain+=(t.op==='not'?'¬':` ${OPS[t.op].s} `);opsList.push(t);}
  else{big+=t.k==='v'?t.s:t.k;plain+=t.k==='v'?t.s:t.k;}
 });
 const target=opsList.find(t=>t.id===ask);
 return {tp:'order',text:`Какое действие выполнится <b>${askTxt}</b>?`,big:`<span class="f">${big}</span>`,plain,
  opts:shuffle(opsList.map(t=>({v:t.id,t:OPS[t.op].s}))),symOpts:true,ans:ask,orderQ:true,right:`${askTxt} — ${OPS[target.op].s}`};
}
function makeQuiz(){
 const gen={sym:qSym,table:qTable,order:qOrder,value:qValue};let qs=[];
 for(const tp in gen){const seen=new Set();let g=0;
  while(qs.filter(q=>q.tp===tp).length<PER_TYPE&&g++<200){const q=gen[tp]();const k=q.text+q.big+q.ans;if(seen.has(k))continue;seen.add(k);qs.push(q);}}
 for(let t=0;t<200;t++){shuffle(qs);if(qs.every((q,i)=>i===0||q.tp!==qs[i-1].tp))break;}
 return qs;
}

  score:game.okN,total:N,grade:game.grade,minutes:durMin(),leaves:game.leaves,leaveTimes:game.leaveTimes.join(', ')};
 fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)})
  .then(()=>{game.sent=true;st.className='sendst ok';st.innerHTML='✔ Результат отправлен учителю.';if(sb)sb.textContent='✔ Отправлено';})
  .catch(()=>{st.className='sendst err';st.innerHTML='Не удалось отправить (нет интернета?). Нажмите «Отправить результат учителю» ещё раз или сохраните файл .txt.';if(sb){sb.disabled=false;sb.textContent='📨 Отправить результат учителю';}});
}
function exportTxt(){
 const N=game.qs.length,d=new Date(),ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
 const P=gradeParts(game.okN,game.bonus,N);
 const lines=['Блиц-опрос «Логические операции»',`Ученик: ${fio()}`,`Класс: ${cls()}`,`Дата: ${game.end.toLocaleString('ru-RU')}`,MAX_ATTEMPTS?`Попытка: ${game.attempt} из ${MAX_ATTEMPTS}`:'','',
  ...Object.keys(TYPES).map(tp=>{const rr=game.res.filter(r=>r.q.tp===tp);return `${TYPES[tp]}: верно ${rr.filter(r=>r.ok).length} из ${rr.length}`;}),'',
  `Верных ответов: ${game.okN} из ${N}`,`За правильность: ${fmt(P.gc)} из ${G_CORRECT}`,`За скорость: ${fmt(P.gs)} из ${G_SPEED} (бонус ${game.bonus} из ${N*BONUS})`,
  `Оценка: ${game.grade} из 10`,`Уходов со страницы: ${game.leaves}`+(game.leaves?` (${game.leaveTimes.join(', ')})`:'')];
 const b=new Blob(['﻿'+lines.join('\r\n')],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);
 a.download=`Блиц_логика_${fio().replace(/[\\/:*?"<>|]+/g,'').replace(/\s+/g,'_')}_${cls()}_попытка${game.attempt}_${ds}.txt`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);
}

/* ===== конфетти ===== */
let confRaf=null;
function confetti(){
 const cv=$('#conf'),ctx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
 const cols=['#2563eb','#7c3aed','#f59e0b','#22c55e','#ef4444','#facc15'];
 const P=Array.from({length:160},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:-2+Math.random()*4,vy:2+Math.random()*4,s:6+Math.random()*8,r:Math.random()*6,vr:-.2+Math.random()*.4,c:pick(cols)}));
 const t0=performance.now();
 const f=now=>{ctx.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.04;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();});
  if(now-t0<4500)confRaf=requestAnimationFrame(f);else ctx.clearRect(0,0,cv.width,cv.height);};
 confRaf=requestAnimationFrame(f);
}
function stopConf(){cancelAnimationFrame(confRaf);const cv=$('#conf');cv.getContext('2d').clearRect(0,0,cv.width,cv.height);}

/* ===== клавиши и защита ===== */
document.addEventListener('keydown',e=>{
 /* для учителя: Ctrl + Alt + 0 на стартовой странице — сбросить попытки всех учеников на этом компьютере */
 if(!inGame()&&e.ctrlKey&&e.altKey&&e.key==='0'){if(confirm('Сбросить счётчик попыток всех учеников на этом компьютере?')){attClearAll();updAttInfo();alert('Попытки сброшены.');}return;}
 if(inGame()&&(e.key==='F5'||e.key==='F12'||((e.ctrlKey||e.metaKey)&&['r','R','к','К','u','U','г','Г'].includes(e.key)))){e.preventDefault();return;}
 if(inGame()&&!answered&&/^[1-4]$/.test(e.key)){const b=document.querySelectorAll('.opt')[+e.key-1];if(b)b.click();}
});
function warn(t){const w=$('#warn');w.innerHTML=t+'<div style="text-align:right;margin-top:8px"><button class="btn" style="font-size:17px;padding:5px 12px" onclick="this.closest(\'.warn\').classList.remove(\'show\')">Понятно</button></div>';w.classList.add('show');}
document.addEventListener('visibilitychange',()=>{if(!inGame())return;if(document.hidden){game.leaves++;game.leaveTimes.push(new Date().toLocaleTimeString('ru-RU'));}else warn(`Во время опроса нельзя уходить со страницы.<br>Уход отмечен в результате (всего: <b>${game.leaves}</b>).`);});
window.addEventListener('beforeunload',e=>{if(inGame()){e.preventDefault();e.returnValue='';}});
document.addEventListener('contextmenu',e=>{if(inGame())e.preventDefault();});

showStart();
</script>
